# MathModelAgent 云服务器一键部署
# 用法: cp backend/.env.production.example backend/.env.production（填 key）→ docker compose -f docker-compose.cloud.yml up -d --build
services:
  math-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: math-backend
    # 备案期仅本机回环监听；对外经 Cloudflare 隧道 nb.sgweb.asia（见 DEPLOY_CLOUD.md）
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - ./backend/.env.production
    volumes:
      - ./data:/app/data                    # ChromaDB 向量库持久化
      - ./knowledge_base:/app/knowledge_base # 知识库文档持久化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
