# MathModelAgent 云服务器后端（前端在 Cloudflare Pages，本文件只跑后端）
#
# 服务器上:
#   1. git clone https://github.com/zhang66633/NB_project.git && cd NB_project
#   2. cp backend/.env.production.example backend/.env.production  # 填密钥
#   3. docker compose -f docker-compose.cloud.yml up -d --build
#   4. curl http://localhost:8002/api/health
#
# 说明:
#   - 沙箱: 容器内无法嵌套 Docker → 强制 subprocess 模式（Unix rlimits 生效）
#   - 向量库: 嵌入式 ChromaDB（本地 data/chroma_db，不依赖独立容器）
#   - Redis: 未配置 → fakeredis 内存兜底（单实例够用）
#   - 持久化: data/ 与 knowledge_base/ 挂卷，重启/重建不丢
services:
  backend:
    build:
      context: ./backend
    container_name: mathmodel-backend
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env.production
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - DEBUG=false
      - SANDBOX_BACKEND=subprocess
      - SANDBOX_MAX_MEMORY_MB=1024
      - CHROMA_HTTP_URL=
    volumes:
      - ./backend/data:/app/data
      - ./backend/knowledge_base:/app/knowledge_base
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
