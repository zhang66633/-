# nginx 生产环境配置
# 用作反向代理 + 静态文件服务
# 在 docker-compose.yml 中将此文件挂载到 /etc/nginx/conf.d/default.conf

upstream backend {
    server backend:8000;
    keepalive 32;
}

# 速率限制: 每个 IP 每秒最多 10 个请求, 突发 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 连接数限制: 每个 IP 最多 20 个并发连接
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/markdown;
    gzip_min_length 256;
    gzip_vary on;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # ── 前端静态文件 ──────────────────────────────
    location / {
        root /app/dist;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存 (带 hash 的 JS/CSS 可长期缓存)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API 代理 ──────────────────────────────────
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;

        # 速率限制
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        # 超时 (LLM 调用可能很长)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── WebSocket 代理 ────────────────────────────
    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400s;  # WebSocket 长连接
        proxy_send_timeout 86400s;
    }

    # ── 健康检查 ──────────────────────────────────
    location /health {
        proxy_pass http://backend/health/ready;
        access_log off;
    }
}
