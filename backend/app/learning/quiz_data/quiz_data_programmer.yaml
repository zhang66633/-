    TypeError(only 0-dimensional arrays can be converted to Python scalars)。
    传 `"numpy"` 生成的是向量化函数,数组输入正常;新版 SymPy 默认(不传 modules)会自动选 numpy,也能处理数组——
    但为明确起见,对数组计算一律显式写 `lambdify(x, expr, "numpy")`,
    再交给 integrate.quad / Matplotlib 画图,避免「默认模块」随版本变化的坑。
