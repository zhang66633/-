- id: prog_sympy_01_q1
  unit_id: prog_sympy_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    ```python
    import sympy as sp
    x = sp.symbols("x")
    print(sp.diff(sp.sin(x) * sp.exp(x), x))
    ```
    该一阶导数等于:
  options:
    - $(\sin x + \cos x)\, e^x$
    - $\sin x \cdot e^x$
    - $\cos x \cdot e^x$
    - $(\cos x - \sin x)\, e^x$
  answer_index: 0
  explanation: |
    乘法法则:$\dfrac{d}{dx}(\sin x \cdot e^x) = (\sin x + \cos x) e^x$。
    SymPy 实际输出的是未合并形式 `exp(x)*sin(x) + exp(x)*cos(x)`,与上式相等(可用 simplify 合并)。
    $\sin x \cdot e^x$ 是忘了求导;$\cos x \cdot e^x$ 只对 sin 求导、漏了 $e^x$ 部分的乘积项;
    $(\cos x - \sin x) e^x$ 是乘法法则符号记反。手算一遍再对照输出,是练习符号工具的正确姿势。
  tags: [SymPy, diff, 求导, 乘法法则]

- id: prog_sympy_01_q2
  unit_id: prog_sympy_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    ```python
    sp.solve(sp.Eq(x**5 - x - 1, 0), x)
    ```
    返回的不是数值解(而是空列表或 RootOf 形式),原因是:
  options:
    - 方程没有实根,所以 solve 返回空
    - 一般五次方程无根式解析解,solve 返回 RootOf/空;改用 nsolve(给初值)求数值根(约 1.1673)
    - SymPy 的 bug,重新安装即可
    - 变量声明错误导致的
  answer_index: 1
  explanation: |
    伽罗瓦理论:五次及以上多项式一般没有根式解析解,`solve` 无法给出初等函数形式,
    返回 RootOf 占位或空列表——这不是 SymPy 的 bug,也不代表无根。
    该方程有实根 x ≈ 1.1673:用 `sp.nsolve(eq, x, 1)`(牛顿法,需给初值)或 `sp.nroots(x**5 - x - 1)` 一次求全部复根。
    先画图确认根的大致位置再给初值,是数值求根的标准流程。
  tags: [SymPy, solve, nsolve, 数值求根]

- id: prog_sympy_01_q3
