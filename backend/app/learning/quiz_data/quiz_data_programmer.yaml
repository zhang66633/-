- id: prog_optimize_01_q1
  unit_id: prog_optimize_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    ```python
    from scipy.optimize import linprog
    res = linprog([-3, -5], A_ub=[[1, 3], [2, 1]], b_ub=[9, 8],
                  bounds=[(0, None), (0, None)], method="highs")
    print(res.x, -res.fun)
    ```
    输出是:
  options:
    - '[3. 2.] 19.0'
    - '[0. 0.] 0.0'
    - '[3. 2.] -19.0'
    - '[2. 3.] 19.0'
  answer_index: 0
  explanation: |
    `linprog` 只能求 **min**:max 3x₁+5x₂ 等价于 min -3x₁-5x₂,系数取负;
    求解后真实最优值 = `-res.fun` = 19.0,最优解 (3, 2)。
    [0. 0.] 0.0 是忘给目标取负(用 c=[3,5] 求 min,最优解跑到原点);
    [3. 2.] -19.0 是忘了把 res.fun 取负回 max 问题;
    [2. 3.] 19.0 违反约束 1×2+3×3=11>9,不可行——是把解分量记反。
    每次求解后还应检查 res.success 与 res.message。
  tags: [scipy, linprog, 线性规划, 最大化取负]

- id: prog_optimize_01_q2
  unit_id: prog_optimize_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    用 SLSQP 求 $\min\ f(x,y) = x^2 + y^2$,约束 $x + y \geq 3$。以下约束写法**正确**的是:
  options:
    - '{"type": "ineq", "fun": lambda v: 3 - v[0] - v[1]}'
    - '{"type": "ineq", "fun": lambda v: v[0] + v[1] - 3}'
    - '{"type": "ineq", "fun": lambda v: v[0] + v[1]}'
    - bounds=[(0, 3), (0, 3)] 即可表达 x+y≥3,无需 constraints
  answer_index: 1
  explanation: |
    `ineq` 约束的可行条件是 **fun(x) ≥ 0**:要表达 x+y ≥ 3,直写 v[0]+v[1]-3。
    正确写法解得 (1.5, 1.5),f=4.5。
    第一个选项方向反了,可行域变成 x+y ≤ 3,求解器给出 (0,0)、f=0——约束完全失效;
    第三个漏掉常数项 -3,约束变成 x+y ≥ 0,原约束没生效;
    bounds 是**逐变量**的矩形界,[0,3]² 不能表达「x+y ≥ 3」这种跨变量约束(如 (0,0) 在界内却不满足原约束)。
  tags: [scipy, minimize, SLSQP, 不等式约束]

- id: prog_optimize_01_q3
  unit_id: prog_optimize_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    求 $f(x) = x\sin(10\pi x) + 2$ 在 $[0, 4]$ 上的最大值。用 `minimize`(BFGS)从 $x_0 = 1.5$ 出发得到
    $x \approx 0.452,\ f \approx 2.451$;用 `differential_evolution` 得到 $x \approx 3.8503,\ f \approx 5.8501$。
    以下判断正确的是:
  options:
    - 两个结果都正确,取平均即可
    - differential_evolution 不基于梯度,结果必然不如 minimize 可靠
    - 函数多峰,minimize 陷入初值附近的局部最优;应先画图判断多峰,再改用全局方法(或全局粗搜 + 局部精修)
    - minimize 的结果是求解器 bug,增大 maxiter 重新求解即可
  answer_index: 2
  explanation: |
    f 在 [0,4] 上有约 40 个峰,`minimize` 类方法沿梯度爬到**初值附近的**山头就停:
    初值 1.5 落在 0.45 峰的引力范围内,得到的 2.45 甚至比初值处的函数值还差——这是多峰问题的本质,不是 bug。
    增大 maxiter 只会让局部收敛更精确,不会跳出局部极值;差分进化在可行域全域撒种群,多峰场景更可靠(代价是慢);
    两个结果「取平均」毫无意义。应对口诀:画图判断多峰 → 全局粗搜 + 局部精修,多组初值启动取最优。
  tags: [scipy, 全局优化, differential_evolution, 局部最优]

- id: prog_cvxpy_01_q1
  unit_id: prog_cvxpy_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    以下哪个模型是**非 DCP** 的(`prob.is_dcp()` 为 False,`solve()` 时抛 `DCPError`)?
  options:
    - cp.Problem(cp.Minimize(cp.sum_squares(x)))
    - cp.Problem(cp.Maximize(cp.sum_squares(x)))
    - cp.Problem(cp.Minimize(cp.norm2(A @ x - b)))
    - cp.Problem(cp.Minimize(c @ x), [x >= 0])
  answer_index: 1
  explanation: |
    DCP 规则:`Minimize` 的目标必须是**凸**的,`Maximize` 的目标必须是**凹**的。
    `sum_squares` 是凸表达式,放在 Maximize 下违反规则 → is_dcp() 为 False,solve() 抛 DCPError。
    其余三个都是合法模型:sum_squares 与 norm2 的 Minimize 是凸问题,c@x 是仿射(既凸又凹)。
    DCPError 是好事——它在建模阶段就拦住「数学上就不是凸问题」的错误;报错先怀疑模型本身。
  tags: [cvxpy, DCP, 凸优化, 曲率]

- id: prog_cvxpy_01_q2
  unit_id: prog_cvxpy_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    ```python
    import cvxpy as cp
    import numpy as np
    x = cp.Variable(2)
    prob = cp.Problem(cp.Minimize(cp.sum_squares(x - np.array([1.0, 2.0]))))
    print(x.value)      # ①
    prob.solve()
    print(x.value)      # ②
    ```
    两处输出分别是:
  options:
    - ① None,② 约 [1. 2.]
    - ① 约 [0. 0.],② 约 [1. 2.]
    - ① 报 AttributeError,② 约 [1. 2.]
    - ① None,② 仍是 None
  answer_index: 0
  explanation: |
    `solve()` 之前变量尚未被赋值,`x.value` 是 None(不是 0,也不是报错);
    solve() 之后才能取到最优解——本题 min ‖x-(1,2)‖² 的最优解显然就是 [1, 2]。
    取值顺序不能乱:先 solve → 查 `prob.status == "optimal"` → 再取 value。
    若 status 是 infeasible/unbounded,此时 value 是 ±∞ 或 None,直接拿去做后续计算会静默出错。
  tags: [cvxpy, solve, value, status]

- id: prog_cvxpy_01_q3
  unit_id: prog_cvxpy_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    `c` 是单位运输成本矩阵(np.ndarray),`x = cp.Variable((2, 2))` 是运输量矩阵,
    目标函数 $\sum_{i,j} c_{ij} x_{ij}$ 的正确写法是:
  options:
    - cp.sum(c @ x)
    - cp.sum(c * x)
    - cp.sum(cp.multiply(c, x))
    - cp.sum(x) * c
  answer_index: 2
  explanation: |
    逐元素乘必须用 `cp.multiply`:成本矩阵与变量矩阵逐元素相乘再求和,才是总运输成本。
    `@` 是矩阵乘:`c @ x` 算出的是另一个矩阵,求和后语义完全不对(实跑:c=[[1,2],[3,4]]、x 全 1 时,
    cp.sum(cp.multiply(c, x)) = 10 而 cp.sum(c @ x) = 20);
    `*` 在 cvxpy 中同样按矩阵乘法处理(该用法已弃用并发出警告),不是逐元素乘;
    最后一项先求和再乘矩阵,维度与语义都不对。
  tags: [cvxpy, multiply, 矩阵乘法, 声明式建模]

- id: prog_sklearn_01_q1
  unit_id: prog_sklearn_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    ```python
    from sklearn.datasets import make_classification
    from sklearn.preprocessing import StandardScaler
    from sklearn.model_selection import train_test_split
    from sklearn.linear_model import LogisticRegression

    X, y = make_classification(n_samples=300, n_features=6, random_state=0)
    X_s = StandardScaler().fit_transform(X)          # 全量标准化
    X_train, X_test, y_train, y_test = train_test_split(X_s, y, test_size=0.2)
    model = LogisticRegression(max_iter=2000).fit(X_train, y_train)
    print(model.score(X_test, y_test))
    ```
    以下说法正确的是:
  options:
    - 完全正确,标准化与划分顺序无关
    - 有数据泄露:缩放器在全量数据上 fit,测试集信息混入缩放参数;应先划分、训练集 fit_transform、测试集只 transform(或装进 Pipeline)
    - 代码会报错,fit_transform 返回的 ndarray 不能传给 train_test_split
    - 没有泄露,但评估结果必然虚低
  answer_index: 1
  explanation: |
    缩放器在**全量数据**上 fit,均值/方差用到了测试集的取值,测试集信息泄漏进预处理,评估不再严格无偏。
    正确顺序:先 train_test_split,再对训练集 fit_transform、测试集只 transform;
    或直接把 scaler 和模型装进 Pipeline,由 cross_val_score 在折内调度(参见《建模数据处理流水线》单元)。
    代码不会报错——这正是泄漏能静默发生的原因;泄漏的方向通常让评估**虚高**,不是虚低。
  tags: [sklearn, 数据泄露, StandardScaler, 训练测试划分]

- id: prog_sklearn_01_q2
  unit_id: prog_sklearn_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    二分类问题的混淆矩阵为(行=真实,列=预测):
    ```python
    cm = [[50, 5],
          [10, 35]]
    ```
    准确率是:
  options:
    - "77.8%"
    - "87.5%"
    - "85%"
    - "90%"
  answer_index: 2
  explanation: |
    读法:行=真实,列=预测。50 真负、5 假正、10 假负、35 真正,总数 100。
    准确率 = (50+35)/100 = **85%**。
    77.8% 是召回率(35/(10+35),正类找回了多少);
    87.5% 是精确率(35/(5+35),预测为正的里面对了多少);
    90% 是 (50+35+5)/100——漏掉了 10 个假负,典型的算错方式。
    类别不均衡时准确率会失真,要看精确率/召回率/F1(classification_report)。
  tags: [sklearn, 混淆矩阵, 准确率, 评估指标]

- id: prog_sklearn_01_q3
  unit_id: prog_sklearn_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    为什么 KMeans 聚类前通常要做标准化?
  options:
    - 标准化能自动确定最优簇数
    - 不标准化 KMeans 会抛出异常
    - 标准化能防止 KMeans 过拟合
    - 欧氏距离对量纲敏感,量纲大的特征会主导距离,聚类被「大数特征」绑架
  answer_index: 3
  explanation: |
    KMeans 用欧氏距离,每个特征的量纲直接决定它对距离的贡献:
    某特征取值 0~1000、另一特征 0~1,聚类几乎完全被第一个特征主导。
    标准化(StandardScaler)把各特征拉到可比尺度,距离才有意义。
    簇数靠肘部法则等确定,与标准化无关;不标准化照常运行,只是结果差;
    「过拟合」是监督学习的概念,不适用于 KMeans。所有特征同量纲(如像素灰度 0~255)可不做,但做了也几乎无害。
  tags: [sklearn, KMeans, 标准化, 欧氏距离]

- id: prog_networkx_01_q1
  unit_id: prog_networkx_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    ```python
    import networkx as nx
    G = nx.Graph()
    G.add_weighted_edges_from([
        ("A", "B", 120), ("A", "C", 150), ("B", "D", 100),
        ("C", "D", 80), ("B", "E", 200), ("D", "E", 90),
        ("C", "F", 110), ("E", "F", 70),
    ], weight="length")            # 里程存进 "length" 属性
    print(nx.dijkstra_path_length(G, "A", "F"))   # 忘了传 weight="length"
    ```
    输出是:
  options:
    - "2"
    - "260"
    - "380"
    - 抛 NetworkXNoPath
  answer_index: 0
  explanation: |
    默认权重键是 `"weight"`,而这里里程存进了 `"length"` 属性;不传 weight 参数时,
    Dijkstra 把所有边按权重 1 处理,退化成「数边数」——A→C→F 只经过 2 条边,返回 2。
    正确写法 `weight="length"` 得到 260(A→C→F,150+110);380 是 A→B→D→E→F 的加权里程
    (一条看似「顺路」但更长的路径);图是连通的,不会抛 NetworkXNoPath。
    属性名与默认键不一致时忘记显式传 weight,得到的是「边数最少」而不是「里程最短」,结果完全错误。
  tags: [networkx, Dijkstra, 权重, 最短路径]

- id: prog_networkx_01_q2
  unit_id: prog_networkx_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    供水管网建模:水从水源经管道流向汇点,管道容量有方向性。应使用:
  options:
    - nx.Graph
    - nx.DiGraph
    - 两者等价,结果相同
    - nx.MultiGraph
  answer_index: 1
  explanation: |
    水沿管道**单向**流动,必须用 `nx.DiGraph`(有向图)。
    `nx.Graph` 无向图允许反向流动,最大流结果会错误;
    「两者等价」错误——有向图中 `dijkstra_path(G, s, t)` 与 `dijkstra_path(G, t, s)` 可能不同甚至无路;
    `MultiGraph` 用于两节点间有多条平行边的场景,与方向性无关。
    判断口诀:信息/物质能否沿边反向流动——公路、光缆用 Graph,水流、物流、资金流用 DiGraph。
  tags: [networkx, DiGraph, 有向图, 最大流]

- id: prog_networkx_01_q3
  unit_id: prog_networkx_01
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    建图时把容量存进了默认的 `"weight"` 键,随后调用 `nx.maximum_flow(D, "s", "t")`(未显式传 `capacity` 参数),会发生什么?
  options:
    - 自动读取 "weight" 属性作为容量,结果正确
    - 与显式传 capacity="weight" 的结果完全一致
    - 静默返回一个偏大的荒谬值
    - 边缺少 "capacity" 属性,检测到无限容量路径,抛 NetworkXUnbounded
  answer_index: 3
  explanation: |
    `maximum_flow` 默认找 `"capacity"` 属性;边没有该属性时容量被当作**无穷大**,
    存在无限容量的 s-t 路径时直接抛 `NetworkXUnbounded`(networkx 3.x 实跑验证)。
    它既不会自动读取 "weight",也不会静默给出结果——但数据已经「错了」:
    正确姿势是 `add_weighted_edges_from(..., weight="capacity")` 把权重存成容量键,
    再 `nx.maximum_flow(D, "s", "t", capacity="capacity")`。这与 Dijkstra 的 weight 键陷阱是同一类错误。
  tags: [networkx, maximum_flow, capacity, 最大流]

- id: prog_ga_impl_q1
  unit_id: prog_ga_impl
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    二进制编码 GA 中,10 位染色体、变量区间 $[0, 5]$,位串 `1010101010` 解码后的 $x$ 约等于:
  options:
    - 约 3.333
    - 约 3.330
    - 约 5.000
    - 约 1.667
  answer_index: 0
  explanation: |
    位串十进制值 D = 2⁹+2⁷+2⁵+2³+2¹ = 682,解码公式
    $x = lb + (ub-lb)\cdot D/(2^L-1) = 5 \times 682/1023 \approx 3.3333$。
    3.330 是分母误写成 $2^L = 1024$(这样 ub 永远取不到,边界上的最优解会系统性错过);
    1.667 是把位串误读成 0101010101(D=341);
    5.000 是全 1 串 1111111111 的解码结果。分母是 $2^L - 1$ 不是 $2^L$,这是解码最常见的错误。
  tags: [遗传算法, 二进制编码, 解码]

- id: prog_ga_impl_q2
  unit_id: prog_ga_impl
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    罚函数处理约束后,个体适应度可能是负数。为什么此时轮盘赌选择不能用,而锦标赛选择可以用?
  options:
    - 轮盘赌计算太慢,拖累进化速度
    - 轮盘赌只支持整数适应度
    - 锦标赛选择比轮盘赌更快收敛到全局最优
    - 轮盘赌按 p_i = f_i/Σf_j 抽样要求 f_i ≥ 0,负适应度破坏概率语义;锦标赛只看排序,与正负无关
  answer_index: 3
  explanation: |
    轮盘赌把适应度当概率权重:$p_i = f_i/\sum f_j$ 要求 $f_i \geq 0$,
    负的 f_i 会产生负概率,抽样语义崩溃(求和也可能抵消为 0 报错)。
    锦标赛随机抽 k 个个体取最优,只依赖相对大小,与正负无关,是罚函数场景下更稳的选择。
    轮盘赌的替代方案还有先把 min 问题变换成 max:$f' = -f$ 或 $f' = 1/(1+f)$。
    速度与收敛快慢的说法都不是本质原因。
  tags: [遗传算法, 轮盘赌, 锦标赛, 罚函数]

- id: prog_ga_impl_q3
  unit_id: prog_ga_impl
  role: programmer
  category: 编程
  difficulty: intermediate
  question: |
    若删掉二进制 GA 中「每代把历史最优个体原样复制进下一代」的精英保留步骤,最可能观察到:
  options:
    - 程序报错,无法运行
    - 收敛会更快,因为少了复制开销
    - 收敛曲线剧烈震荡,已找到的最优解可能被交叉/变异毁掉
    - 结果与有精英保留完全一致
  answer_index: 2
  explanation: |
    交叉和变异都是「破坏性」算子:没有精英保留,历史最优个体随时可能被交叉打散或被变异破坏,
    收敛曲线会剧烈震荡,最终解也差一截。
    精英保留一行代码(如 `pop[0] = elite`)就能稳定收敛,几乎必加;
    它不影响运行(不会报错),也不是冗余——「结果完全一致」与事实相反,「更快收敛」颠倒了因果。
  tags: [遗传算法, 精英保留, 收敛曲线]

