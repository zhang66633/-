- id: prog_perf_01_q1
  unit_id: prog_perf_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    关于 `np.vectorize(f)`,下列说法正确的是:
  options:
    - 是语法糖:内部仍是 Python 层循环,不加速甚至更慢
    - 与 Numba 的 @njit 等价,都是 JIT 编译
    - 会自动利用多核并行加速
    - 只能作用于 numpy 的 ufunc
  answer_index: 0
  explanation: |
    `np.vectorize` 只是把函数调用「循环」包了一层语法糖:内部仍是 Python 层的逐元素调用,
    加上类型转换开销,往往比直接循环还慢——它**不是**加速器。
    它的价值是语义糖:让标量函数接受数组输入、支持广播,方便书写。
    要性能只有两条路:真向量化(把计算写进 NumPy 的广播/ufunc,让运算发生在 C 层),
    或必须写循环时用 Numba 的 @njit 编译。它也不是并行工具,不限于 ufunc。
  tags: [性能优化, np.vectorize, 向量化, Numba]

- id: prog_perf_01_q2
  unit_id: prog_perf_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    给函数加 `@njit` 后,第一次调用明显比后续调用慢,原因是:
  options:
    - 首次调用要初始化 GPU
    - 是 Numba 的 bug,第二次才会正常
    - 首次调用含 JIT 编译时间;基准测试应先预热一次再计时
    - 首次调用包含 Python 解释器启动开销
  answer_index: 2
  explanation: |
    第一次调用时 Numba 把 Python 函数**编译**成机器码(约 0.1~1 秒),之后直接执行机器码。
    不同参数**类型**(如 float64 数组 vs int64 数组)还会触发不同的编译版本。
    因此基准测试必须「先预热一次再计时」,否则编译时间混进基准,得出「Numba 反而慢」的假象;
    生产代码加 `@njit(cache=True)` 把编译结果缓存到磁盘。小数据量、单次调用时 @njit 也可能因编译开销反而更慢。
  tags: [Numba, njit, JIT编译, 基准测试]

- id: prog_perf_01_q3
  unit_id: prog_perf_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    某段双重循环代码复杂度为 $O(n^2)$,用 Numba 可加速约 50 倍;同时存在 $O(n\log n)$ 的替代算法。
    $n = 10^5$ 时,最优策略是:
  options:
    - 直接用 Numba 加速现有代码即可,50 倍已足够
    - 优先换 O(n log n) 算法:复杂度收益是数量级的(n²/(n log n) ≈ 6000 倍,远超 50 倍)
    - 两者收益相当,任选其一
    - 先做常数级微调(局部变量、缓存属性),不够再改算法
  answer_index: 1
  explanation: |
    复杂度差异是数量级的:$n^2 = 10^{10}$ 对 $n\log_2 n \approx 1.7\times 10^6$,差距约 6000 倍,
    远超 Numba 的 50 倍常数级收益——把一个 O(n²) 双重循环用 Numba 加速,不如改成 O(n log n) 算法快。
    常数级微调(局部变量、in-place)只有 1~3 倍,且往往牺牲可读性。
    优化顺序:先测量定位热点 → 降复杂度(算法/数据结构)→ 向量化或 JIT → 最后才常数级微调。
  tags: [性能优化, 复杂度, 算法, 优化层级]

- id: prog_pipeline_01_q1
  unit_id: prog_pipeline_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    ```python
    pipe = Pipeline([("scaler", StandardScaler()), ("model", Ridge())])
    ```
    用 GridSearchCV 同时调 Ridge 的 alpha 与 StandardScaler 的 with_mean,参数网格应写成:
  options:
    - '{"model__alpha": [0.1, 1.0], "scaler__with_mean": [True, False]}'
    - '{"alpha": [0.1, 1.0], "with_mean": [True, False]}'
    - '{"Ridge__alpha": [0.1, 1.0], "StandardScaler__with_mean": [True, False]}'
    - '{"model.alpha": [0.1, 1.0], "scaler.with_mean": [True, False]}'
  answer_index: 0
  explanation: |
    流水线内调参用**双下划线**连接「步骤名」与「参数名」:`步骤名__参数名`。
    直写参数名会报 Invalid parameter 错误(GridSearchCV 找不到它们);
    用类名 Ridge/StandardScaler 也不行——键必须是你给步骤起的名字 scaler/model;
    单下划线或点号语法不存在。
    嵌套流水线(ColumnTransformer 里套 Pipeline)的名字更长,如 `pre__num__sc__with_mean`,
    不确定时用 `print(grid.estimator.get_params().keys())` 照抄。
  tags: [sklearn, Pipeline, GridSearchCV, 双下划线]

- id: prog_pipeline_01_q2
  unit_id: prog_pipeline_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    为什么保存模型时应该 `joblib.dump` 整条 Pipeline,而不是只保存模型?
  options:
    - 单独保存模型会导致文件损坏
    - 流水线序列化后文件体积更小
    - joblib 只能序列化 Pipeline 对象,不能保存裸模型
    - 预测时新数据必须走与训练完全相同的预处理,只存模型预处理状态丢失,预测静默漂移
  answer_index: 3
  explanation: |
    预测时的新数据必须经过与训练**完全相同**的预处理:同样的填充值、缩放均值/标准差、独热类别表。
    只存模型意味着这些状态丢失或手写重建,一旦有出入(如训练时众数填充、预测时均值填充),
    特征分布漂移,预测静默变差。
    joblib 能序列化任意 Python 对象,裸模型也能存——但存整条 Pipeline,load 后直接 predict,
    训练/预测环境零漂移,这是竞赛论文「可复现性」的工程保证。
  tags: [sklearn, Pipeline, joblib, 可复现性]

- id: prog_pipeline_01_q3
  unit_id: prog_pipeline_01
  role: programmer
  category: 编程
  difficulty: advanced
  question: |
    ColumnTransformer 中 `OneHotEncoder(handle_unknown="ignore")` 的作用是:
  options:
    - 自动把未知类别填充为众数
    - 预测时遇到训练集未见过的类别,输出全 0 行而不是抛 ValueError
    - 忽略数值列的缺失值
    - 把未知类别合并为一个「其他」列
  answer_index: 1
  explanation: |
    `handle_unknown="ignore"` 保证预测时若出现训练集没见过的类别(如新城市「深圳」),
    编码器输出全 0 行而不是抛 ValueError——这是部署场景的头号保险。
    它不会把未知类别填充为众数(那是 SimpleImputer 的事),也不会合并成「其他」列
    (合并稀有类别要用 handle_unknown="infrequent_if_exist");数值缺失值处理与 OneHotEncoder 无关。
    不加该参数时,测试集出现新类别直接报错——数据类赛题的经典翻车点。
  tags: [sklearn, OneHotEncoder, ColumnTransformer, 部署]
