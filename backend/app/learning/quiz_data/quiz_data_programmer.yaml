- id: prog_py_01_q1
  unit_id: prog_py_01
  role: programmer
  category: 编程
  difficulty: beginner
  question: |
    建模竞赛中,拿到题目附件的 `.csv` 数据后,需要完成「读取 → 清洗 → 分组聚合」,应优先使用 Python 科学计算四件套中的哪个库?
  options:
    - Pandas —— 专攻表格数据的读取、清洗、聚合
    - NumPy —— 多维数组与向量化运算的地基
    - SciPy —— 数值算法工具箱
    - Matplotlib —— 数据可视化
  answer_index: 0
  explanation: |
    四件套分工:Pandas 洗(表格数据)、NumPy 算(数值计算)、SciPy 解(数值算法)、Matplotlib 画(可视化)。
    建模题的典型链路是「Pandas 读入并清洗 → NumPy 数值计算 → SciPy 求解 → Matplotlib 出图」。
