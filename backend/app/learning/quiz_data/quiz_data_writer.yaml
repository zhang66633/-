- id: writer_abs_01_q1
  unit_id: writer_abs_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    摘要是「论文的命门」。在「问题—方法—结果—结论」四段式结构中,新手最容易整段省略、却恰恰是评委最想看的部分是:
  options:
    - 问题背景段,应详细交代研究意义
    - 方法段,应写出模型的完整推导过程
    - 结果段,应给出与题目每一问对应的具体数值
    - 结论段,应多写展望性口号
  answer_index: 2
  explanation: |
    四段中「结果」最容易被新手省略(通篇「效果良好」无数值),但它是评委最想看的部分——
    摘要必须给出与题目每一问对应的具体数值,带单位、带比较。
    A 恰恰相反:背景一句带过即可,大段背景是差摘要的第一病灶;
    B 错在「推导过程」——推导属于正文,摘要只写模型名与求解算法;
    D 错在「口号」——结论要写明确判断或建议(如利率区间),不喊口号。
  tags: [摘要, 四段式结构, 结果数值]

- id: writer_abs_01_q2
  unit_id: writer_abs_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    以下四条摘要片段中,写法最规范的是:
  options:
    - 本文运用多种科学的数学方法进行了综合分析,得到了较为理想的结果。
    - 建立 TOPSIS 信誉评级模型与随机森林违约预测模型,预测 302 家无信贷记录企业的平均违约概率为 0.183。
    - 本文的研究具有重要意义,可以为银行信贷决策提供一定的参考。
    - 我们采用遗传算法求解,效果令人满意。
  answer_index: 1
  explanation: |
    B 方法点名(TOPSIS、随机森林)+ 结果给数值(302 家、0.183),是规范写法。
    A 是典型差摘要:方法没报真名(「科学的方法」不是模型名)、结果零数值;
    C 是口号式结论,三个「一定」说明作者自己都不确定;
    D 语态错误(中文摘要用「本文」不用「我们」),且「效果令人满意」没有数值。
  tags: [摘要, 方法点名, 数值, 第三人称]

- id: writer_abs_01_q3
  unit_id: writer_abs_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    为「基于 BP 神经网络的交通流量预测」论文挑选关键词,最规范的一组是:
  options:
    - 深度学习;人工智能;大数据;云计算
    - 数学建模;研究;问题;方法
    - 交通;预测;神经网络
    - 交通流量预测;BP 神经网络;时间序列;遗传算法
  answer_index: 3
  explanation: |
    D 覆盖问题领域(交通流量预测)、核心模型(BP 神经网络)与辅助方法(时间序列、遗传算法),
    检索价值高,数量 4 个符合「3–5 个、分号分隔」的规范。
    A 与论文内容毫无关系,属于凑数关键词;
    B 全是无区分度的废词,等于没写;
    C 「交通」过泛且数量偏少。
  tags: [摘要, 关键词]

- id: writer_abs_02_q1
  unit_id: writer_abs_02
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    100 分制摘要评分表中,分值最高的评分项是:
  options:
    - '数值(30 分):每个问题是否对应数值、带单位、与正文一致'
    - '结构(20 分):四段是否齐全'
    - '方法(15 分):模型与算法是否点名'
    - '结论(15 分):是否有明确判断或建议'
  answer_index: 0
  explanation: |
    评分表分值为:结构 20、数值 30、方法 15、结论 15、语言 10、关键词与格式 10——
    「数值」占 30 分最高,呼应「数值是摘要的命根子」。
    其余三项分值较小,但都是真实存在的评分项,不是错误。
  tags: [摘要, 评分表]

- id: writer_abs_02_q2
  unit_id: writer_abs_02
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    关于「遮摘要法」训练,正确的做法是:
  options:
    - 先精读原文摘要并背诵,写作时直接模仿其句式
    - 在旁边观察队友写摘要,记录其用词习惯
    - 直接抄写优秀论文的摘要,在抄写中体会结构
    - 遮住原文摘要只读正文,合上论文凭记忆写一稿,再对照原文逐句找差距
  answer_index: 3
  explanation: |
    「遮摘要法」的关键动作是自己先写:读正文 → 合上论文 → 凭记忆写摘要 →
    对照原文逐句找差距(它写了什么我没写?我写了什么它没写?)。
    A、C 绕过了「把正文信息重新组织压缩」这一核心训练环节,直接看原文等于什么都没练;
    B 旁观代替不了动手。
  tags: [摘要, 遮摘要法, 训练方法]

- id: writer_abs_02_q3
  unit_id: writer_abs_02
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    改写差摘要时,把「效果不错」换成「效果良好」,这种改法的问题在于:
  options:
    - 只换词不换结构——改写的三个动作应是补数值、点方法名、删口号
    - 用词还不够准确,应改为「效果显著」
    - 语态不对,应统一改为第三人称「本文」
    - 字数不足,应扩充为完整段落
  answer_index: 0
  explanation: |
    「不错 → 良好」只是同义替换,零信息量。改写的三个动作:
    补数值(补上具体数字)、点方法名(把「一个模型」换成模型名)、删口号(删「具有重要意义」类空话)。
    B、C、D 都在措辞层面打转,没有触及结构——只换词不换结构等于没改。
  tags: [摘要, 改写, 三个动作]

- id: writer_struct_01_q1
  unit_id: writer_struct_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    国赛论文标准骨架中,「问题分析」一章的正确位置是:
  options:
    - 与「问题重述」合并,统称「问题重述与分析」
    - 位于「问题重述」之后、「模型假设与符号说明」之前
    - 位于「模型假设与符号说明」之后、「模型建立与求解」之前
    - 位于「模型建立与求解」之后,作为建模思路的补充说明
  answer_index: 1
  explanation: |
    标准顺序:摘要 → 问题重述 → 问题分析 → 模型假设与符号说明 → 模型建立与求解 →
    模型检验与灵敏度分析 → 模型评价与改进 → 参考文献。
    先讲清解题思路(分析),再谈假设,顺序不能颠倒,故 C、D 错;
    A 混淆了两者功能:重述是「题目说了什么」,分析是「我打算怎么干」,不能合并。
  tags: [论文结构, 章节顺序, 问题分析]

- id: writer_struct_01_q2
  unit_id: writer_struct_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    国赛论文各章篇幅的大致比例,符合「六二二」口诀的是:
  options:
    - 问题重述与分析占一半以上,体现对题目的透彻理解
    - 模型评价与改进占三成,充分展示反思能力
    - 模型建立与求解占六成以上,检验约占两成,其余章节合起来不到两成
    - 各章平均分配,体现结构均衡
  answer_index: 2
  explanation: |
    「六二二」:模型建立与求解是核心,占六成以上;模型检验与灵敏度分析约占两成;
    其余章节(重述、分析、假设、评价、文献等)合起来不到两成,评委的时间分配也大致如此。
    A、B、D 都把篇幅投给了次要章节,颠倒了主次。
  tags: [论文结构, 篇幅比例]

- id: writer_struct_01_q3
  unit_id: writer_struct_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    模型章节内连续 12 个公式,公式之间只有「于是」「可得」,最后一句「解得 x=3」。按「四问」结构,这段文字缺失的是:
  options:
    - 是什么(What)与怎么用(How)
    - 为什么(Why)与结果如何(So what)
    - 只有为什么(Why)
    - 四问齐全,只是公式数量偏多
  answer_index: 1
  explanation: |
    公式墙里只有 What(公式本身)与 How(求解过程),
    缺 Why(为什么引入这个模型/公式)与 So what(结果意味着什么)。
    每引入一个公式应配套四问;连续公式超过 3 个必须插入一段解释性文字,故 D 错;
    A 说反了缺失项;C 只识别出部分缺失。
  tags: [论文结构, 四问结构, 公式]

- id: writer_viz_01_q1
  unit_id: writer_viz_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    需要展示「目标函数随参数 $\lambda$ 在 $[0,1]$ 上连续变化的行为」,最合适的呈现方式是:
  options:
    - 三线表,逐行列出 $\lambda = 0.1, 0.2, \dots, 1.0$ 时的目标值
    - 折线图(曲线)
    - 箱线图
    - 饼图
  answer_index: 1
  explanation: |
    自变量是连续变化的参数,读者要看连续行为与拐点,只有曲线能表达——选折线图。
    表格适合多对象多指标的精确数值查阅,读不出连续变化趋势;
    箱线图用于分布;饼图用于占比,且类别超过 5 个必用条形图。
    原则:趋势与关系用图,精确数值查阅用表。
  tags: [图表, 图型选择, 折线图]

- id: writer_viz_01_q2
  unit_id: writer_viz_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    关于三线表的规范,下列说法正确的是:
  options:
    - 顶线、栏目线、底线三条横线,无竖线;表题在表上方居中
    - 顶线、栏目线、底线三条横线,加上竖线分隔行列更清晰;表题在表下方
    - 顶线、底线两条横线即可,栏目线可有可无;表题在表上方
    - 三条竖线与一条横线构成网格;表题在表下方
  answer_index: 0
  explanation: |
    三线表 = 顶线、栏目线、底线三条横线,没有任何竖线;表题在表上方居中(图题才在图下方);
    单位写在表头或表题,不写在每个数字后。
    B 错在竖线与表题位置;D 的「三竖一横」是 Word 网格表习惯,是外行标志;
    C 缺了栏目线,三线不齐。
  tags: [三线表, booktabs, 表题]

- id: writer_viz_01_q3
  unit_id: writer_viz_01
  role: writer
  category: 论文写作
  difficulty: beginner
  question: |
    正文某处写「结果见图 3」,图 3 之后紧跟下一节、再无任何文字说明。这违反的图表铁律是:
  options:
    - 独立可读
    - 先引用后出现
    - '一图一结论:引用图表后必须紧跟一句解读'
    - 灰度可辨
  answer_index: 2
  explanation: |
    「一图一结论」要求每张图/表只服务一个结论,正文引用后必须紧跟解读句
    (如「图 3 表明,成本随批量增加先降后升,在批量 500 时最低」)——图本身不是结论,解读句才是。
    独立可读指标题、坐标轴、图例完整;先引用后出现指正文先提、图表后出;
    灰度可辨指黑白打印可区分——本例图表本身可能都合规,唯独缺解读。
  tags: [图表, 三条铁律, 解读句]

- id: writer_hypothesis_q1
  unit_id: writer_hypothesis
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    下列四条模型假设中,写法合格的是:
  options:
    - '假设 1:本题所给数据真实可靠。'
    - '假设 2:市场环境保持稳定。'
    - '假设 3:各门店的日需求相互独立且服从正态分布。(理由:对附件 30 天数据的 Shapiro-Wilk 检验均未拒绝正态性,p>0.05。)'
    - '假设 4:模型中的参数都是合理的。'
  answer_index: 2
  explanation: |
    合格假设 = 一句话陈述 + 一句理由:假设 3 给出了检验名称(Shapiro-Wilk)与数据证据(p>0.05),
    既合理又可在检验环节回访。
    A「数据真实」不是建模假设(数据有误应预处理而非假设);
    B「环境稳定」无法量化、无法验证,等于什么都没假设;
    D「参数合理」是自我表扬,不是假设。
  tags: [模型假设, 陈述与理由, 可验证性]

- id: writer_hypothesis_q2
  unit_id: writer_hypothesis
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    符号说明表中有一条目写作「$r$:半径」。关于该条目的问题与补全方式,正确的是:
  options:
    - 没有问题,「半径」的含义已经足够清楚
    - '缺少下标、单位与定义来源,应补全为「$r_k$:第 $k$ 个配送区域的服务半径,单位 km,$k=1,2,\dots,8$;由 3.2 节 K-means 聚类结果计算」'
    - 只缺单位,补上「km」即可
    - 只缺下标,改成「$r_k$」即可
  answer_index: 1
  explanation: |
    符号表四列(符号/含义/单位/备注)都要落实:原条目含义含糊(什么对象的半径?)、缺单位、
    缺取值范围与定义方式,三处都缺。
    B 补全了对象(配送区域)、下标与取值范围($k=1,\dots,8$)、单位(km)、定义来源(3.2 节 K-means)。
    A 忽视了规范要求;C、D 只补了一处,表格仍是「半成品」。
  tags: [符号说明, 三线表, 符号规范]

- id: writer_hypothesis_q3
  unit_id: writer_hypothesis
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    一条好假设在论文中的完整生命周期是:
  options:
    - 提出(附理由)→ 建模时融入公式 → 检验环节扰动回访 → 评价节讨论局限
    - 提出 → 写入符号说明表 → 正文不再提及
    - 建模遇到困难时临时补充 → 检验环节删掉不合用的
    - 提出 → 引用一篇文献支撑 → 写入结论
  answer_index: 0
  explanation: |
    假设的完整生命周期:提出(陈述+理由)→ 使用(建模时变成公式,如「由假设 2,车速恒为 40 km/h,
    故 $t_{ij}=d_{ij}/40$」)→ 回访(检验环节扰动检验)→ 评价(成为改进方向的素材)。
    B 的「孤岛假设」是常见病灶;假设不是临时补丁(C),也不只是文献引用(D)——
    「可验证性」要求它在检验环节被回访,否则假设成了摆设。
  tags: [模型假设, 生命周期, 假设回访]

- id: writer_result_q1
  unit_id: writer_result
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    一段结果分析只写了「我们用 MATLAB 求解了模型,结果如图 4 和图 5 所示」,再无下文。按「展示—解读—关联—引申」四步法,这段文字只完成了:
  options:
    - 展示
    - 解读
    - 关联
    - 引申
  answer_index: 0
  explanation: |
    「结果如图 4、图 5 所示」只是把图贴出来——完成的是「展示」。
    缺解读(数值意味着什么)、关联(与假设/预期对照)、引申(引出下一步)。
    图不是结论,解读句才是;只有展示就是流水账。
  tags: [结果分析, 四步法, 解读句]

- id: writer_result_q2
  unit_id: writer_result
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    以下四条灵敏度分析写法中,合格的是:
  options:
    - 我们对参数 λ 进行了灵敏度分析,结果如图 6 所示。
    - 从图中可以看出 λ 对结果有一定的影响。整体来看,模型还是比较稳健的。
    - 灵敏度分析表明模型是稳健的,可以在实际中应用。
    - 当 λ 在 [0.4, 0.6] 内变化时,总成本变化不超过 3.2%,结论对 λ 的取值不敏感;而当需求量整体下降 20% 时,方案 2 反超方案 1,提示需求预测是本模型的关键风险点。
  answer_index: 3
  explanation: |
    合格结论句 = 扰动范围 + 数值幅度 + 结论是否变化的判断。
    D 给出了 λ 的范围与 3.2% 的幅度,并指出需求量下降 20% 时方案排序反转——量化且警示了关键风险点。
    A 只有图没有结论;B 全是模糊词(「一定的影响」「比较稳健」),评委仍不知道 λ 变动 10% 结论变不变;
    C 是没有数值支撑的口号。
  tags: [灵敏度分析, 结论句]

- id: writer_result_q3
  unit_id: writer_result
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    模型求解「某市共享单车每日最优投放量」,程序输出 $3.7 \times 10^6$ 辆(该市人口约 400 万)。正确的处理是:
  options:
    - 在讨论段解释「该数值与常识略有出入,但不影响结论」
    - 修改措辞为「约 370 万辆左右」,弱化争议
    - 数据是程序算出来的,直接写入论文
    - '先做量级检验:人均近 1 辆显然荒谬,逐环节排查程序(如单位换算「万辆/辆」),修正后复算'
  answer_index: 3
  explanation: |
    参考同类城市 20–40 万辆,投放量应在 $10^5$ 量级,人均近 1 辆显然荒谬。
    量级矛盾时先查程序(常见病因是单位错位,把「万辆」当「辆」读入),修正后复算,而不是改措辞。
    A、B 都是「改措辞掩盖矛盾」;C 直接把矛盾交给评委——藏不住的矛盾会被评委抓住,
    主动解释的才是加分项。
  tags: [数值检验, 量级检验]

- id: writer_eval_q1
  unit_id: writer_eval
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    某题的建模核心是需求规划,而队伍在模型评价中写道:「本模型的缺点是没有考虑需求量,因此结果与实际存在较大偏差。」对该写法的正确判断是:
  options:
    - 诚实的缺点应该保留,评委欣赏坦诚
    - 这是致命硬伤,应修复模型而不是写进缺点;缺点应选方法固有的、可控的代价
    - 改为「对需求量的考虑不够充分」更委婉,可以保留
    - 应把这条缺点移到改进方向一节
  answer_index: 1
  explanation: |
    缺点要「可控」:允许写算法近似性、参数估计误差、数据时间跨度等方法固有代价;
    「没完成题目核心要求」是致命硬伤,写出来等于自我否定——硬伤修模型,软肋写评价。
    A、C 试图用「诚实/委婉」化解,但评委不会给残次模型加分;
    D 位置不对:改进方向应针对可控缺点逐条对应。
  tags: [模型评价, 缺点分寸]

- id: writer_eval_q2
  unit_id: writer_eval
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    以下哪条是合格的「改进方向」写法?
  options:
    - 未来可以进一步优化模型。
    - 可以研究更多因素,使模型更加完善。
    - 针对启发式算法无最优性保证的缺点,可将遗传算法替换为分支定价法(branch-and-price),预期将当前 0.69% 的最优性差距降至 0。
    - 模型的求解速度还可以更快。
  answer_index: 2
  explanation: |
    改进方向公式 = 针对哪条缺点 + 用什么方法(点名)+ 预期效果(量化)。
    C 三者齐全:针对缺点(无最优性保证)、方法点名(分支定价法)、预期量化(0.69% → 0)。
    A、B、D 都是零信息空话——没有方法名、没有预期,是评阅中一眼识破的「空话之王」。
  tags: [模型评价, 改进方向]

- id: writer_eval_q3
  unit_id: writer_eval
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    评价节写优点「本模型具有较高的准确性」不合格,原因是:
  options:
    - 准确性不重要,应改为强调创新性
    - 缺少事实与证据——应写成「预测的平均绝对误差 2.3%(表 7),高风险组实际违约率 21.4% 显著高于低风险组的 3.1%」
    - 形容词不够强烈,应改为「极高的准确性」
    - 检验章已写过准确性,评价节不应重复
  answer_index: 1
  explanation: |
    优点写法 = 一个事实 + 一条编号证据(回扣正文的表、式、节),评委能顺着编号验证——
    「有据可查」是评价可信的前提。B 补上了数值事实与表 7 的证据链。
    A、C 在形容词层面打转,没有触及「缺证据」的本质;
    D 说反了:评价节的优点正是「用编号回扣正文结论」,其增量在于提炼归位与改进推广。
  tags: [模型评价, 优点写法, 证据链]

- id: writer_latex_01_q1
  unit_id: writer_latex_01
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    用 pdfLaTeX 编译中文论文出现乱码或报错,正确的做法是:
  options:
    - 把中文全部替换为英文
    - 改用 XeLaTeX 编译 + ctex 文档类,并确认文件为 UTF-8 编码
    - 升级 pdfLaTeX 到最新版本
    - 在导言区加入 \usepackage{chinese}
  answer_index: 1
  explanation: |
    中文文档必须用 XeLaTeX + ctex 文档类(ctexart/cumcmthesis),且文件编码为 UTF-8;
    pdfLaTeX 引擎不支持中文。
    A 逃避问题;C 解决不了引擎不支持中文的根本原因;D 的宏包不存在,属于编造命令。
  tags: [LaTeX, 编译引擎, XeLaTeX, 中文]

- id: writer_latex_01_q2
  unit_id: writer_latex_01
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    编译报错 `Missing $ inserted`,报错定位在 `x_i 是第 i 个变量,其中 x_i >= 0`。原因与修复正确的是:
  options:
    - 变量不能带下标,应把 $x_i$ 改写为 $xi$
    - 中文与数学混排不被支持,应全部改英文
    - article 文档类不支持行内变量,应改为 report
    - 下划线 `_` 与 `>=` 在文本模式使用——应改为数学模式「$x_i$ 是第 $i$ 个变量,其中 $x_i \geq 0$」
  answer_index: 3
  explanation: |
    下划线、上标、希腊字母等数学符号出现在文本模式会触发 `Missing $ inserted`;
    应放进 `$...$`,且比较符号写作 `\geq` 而不是 `>=`。
    A 错——下标是 LaTeX 常规能力,问题在于漏了数学模式;B、C 都与病因无关。
  tags: [LaTeX, 数学模式, 编译错误]

- id: writer_latex_01_q3
  unit_id: writer_latex_01
  role: writer
  category: 论文写作
  difficulty: intermediate
  question: |
    交叉引用处出现 `??`(如「见表 ??」),最可能的原因与正确处理是:
  options:
    - 公式太长,需要拆分成多个 equation 环境
    - 图片路径错误,应检查 \includegraphics 的文件名
    - 只编译了一次——引用编号需完整编译流水线 XeLaTeX → BibTeX/Biber → XeLaTeX → XeLaTeX;若仍为 ??,检查 \label 与 \ref 名称是否一致
    - 文档类版本过低,应更换
  answer_index: 2
  explanation: |
    `\ref` 的编号信息需要第二、三次编译写入辅助文件并稳定,只编译一次必然 `??`;
    多次编译后仍为 `??`,则是 \label 与 \ref 拼写不一致(注意大小写)。
    A、D 与引用机制无关;B 是「图片找不到」的病因,不是引用未解析。
  tags: [LaTeX, 交叉引用, 编译流水线]

- id: writer_reference_q1
  unit_id: writer_reference
  role: writer
  category: 论文写作
  difficulty: advanced
  question: |
    下列参考文献条目中,符合 GB/T 7714 期刊著录格式的是:
  options:
    - '李四, 供应链优化模型研究, 管理科学学报, 2019, 22(3): 12-20.'
    - '王强, 李明. 基于改进遗传算法的车辆路径优化[J]. 运筹与管理, 2022, 31(4): 45-52.'
    - 姜启源. 数学模型
    - '百度百科. 遗传算法. https://baike.baidu.com'
  answer_index: 1
  explanation: |
    GB/T 7714 期刊格式:作者. 题名[J]. 刊名, 年, 卷(期): 页码.——B 要素齐全、分隔符正确。
    A 缺文献类型标识 [J],且作者与题名之间的句点丢失;
    C 缺版本、出版地、出版社、年份,著录要素不全;
    D 百科不是学术文献,评委会直接判定文献质量低下。
  tags: [参考文献, GB/T 7714, 期刊格式]

- id: writer_reference_q2
  unit_id: writer_reference
  role: writer
  category: 论文写作
  difficulty: advanced
  question: |
    国赛论文中,以下哪个位置不属于「五个必引之处」?
  options:
    - '数据来源处:「本模型参数取自 ×× 市统计年鉴(2023)的数据[1]」'
    - '方法出处处:「本文采用遗传算法[3]求解」'
    - '结论印证处:「该结论与文献[5]对同类城市的调查一致」'
    - 自己推导出的模型目标函数处
  answer_index: 3
  explanation: |
    五个必引之处:数据来源、假设依据、方法出处、方法对比、结论印证。
    自己推导的目标函数是原创内容,无需引用(反而应避免无关引用堆砌)。
    A、B、C 都是必引场景——数据有出处、经典方法也要引(既是规范也是站位)、结论与文献互证。
  tags: [参考文献, 引用时机]

- id: writer_reference_q3
  unit_id: writer_reference
  role: writer
  category: 论文写作
  difficulty: advanced
  question: |
    采用 biblatex + gb7714-2015 样式编排中英文参考文献,正确的编译流程是:
  options:
    - xelatex main 一次即可
    - xelatex → bibtex → xelatex → xelatex
    - xelatex → biber → xelatex → xelatex
    - biber → xelatex → bibtex(顺序不影响结果)
  answer_index: 2
  explanation: |
    biblatex 的后端工具是 Biber:先 xelatex 收集 \cite 信息,再 biber 生成文献数据,
    最后再编译两次写入并稳定编号。
    A 只编译一次,引用处显示 [?]、文献表空白;
    B 用了 BibTeX——那是传统 BibTeX 方案的后端,不能处理 biblatex;
    D 顺序错乱,且 biblatex 与 bibtex 混用必然报错。
  tags: [BibTeX, biblatex, 编译流程]

- id: writer_full_paper_q1
  unit_id: writer_full_paper
  role: writer
  category: 论文写作
  difficulty: advanced
  question: |
    三天赛程中,论文写作的正确节奏是:
  options:
    - 前两天专心建模,第 3 天集中写论文,一气呵成
    - '论文从第 1 小时开始写:第 1 天下午建好骨架,写作永远比结果晚一步'
    - 摘要留到交卷前 1 小时写,此时数值最全
    - 论文手前两天旁听讨论即可,第 3 天再落笔
  answer_index: 1
  explanation: |
    铁律:论文从第 1 小时开始写——第 1 天下午完成骨架、问题重述、假设与符号表初稿;
    算法每出一个结果就落笔一段(写作比结果晚一步,而不是晚一天)。第 3 天只做修改,不做新建。
    A、D 是「先做完再写」的错觉,必然第 3 天通宵赶稿;
    C 的摘要数值必须从正文核对抄录,最后 1 小时的摘要必然数值失守。
  tags: [论文写作, 时间管理, 三天计划]

- id: writer_full_paper_q2
  unit_id: writer_full_paper
  role: writer
  category: 论文写作
  difficulty: advanced
  question: |
    三轮修改法中,下列动作与轮次的对应正确的是:
  options:
    - '第一轮(结构):补全图表解读句;第二轮(内容):统一标题层级与编号;第三轮(格式):补章节衔接句'
    - '第一轮(结构):统一参考文献格式;第二轮(内容):补章节衔接句;第三轮(格式):核对摘要数值'
    - '第一轮(结构):修复主线断裂、补衔接句;第二轮(内容):核对数值、补解读句;第三轮(格式):统一标题编号与参考文献格式'
    - 三轮可以合并进行,边改结构边抠标点效率更高
  answer_index: 2
  explanation: |
    轮次纪律:第一轮结构(骨架立得住:缺章、主线、衔接、图表位置),
    第二轮内容(论证站得住:数值核对、解读句、四问、假设回访),
    第三轮格式(观感立得住:标题层级、编号、三线表、文献格式、匿名)。
    A、B 把三类的动作张冠李戴;D 的「三轮混着来」是第 3 天效率崩盘的主因。
  tags: [论文写作, 三轮修改法]

- id: writer_full_paper_q3
  unit_id: writer_full_paper
  role: writer
  category: 论文写作
  difficulty: advanced
  question: |
    交卷前 1 小时发现:参考文献表中 [7] 在正文中从未被引用。正确的处理是:
  options:
    - 在结论末尾随便补一个上标 [7],保证「一一对应」
    - 删除整张参考文献表,避免被扣分
    - 保留不动——参考文献越多越显调研充分
    - 若该文献确实支撑了某处内容,在对应句补上标 [7];若属无用文献,删除该条并顺延编号
  answer_index: 3
  explanation: |
    文献与正文必须一一对应:确有支撑就补标号(正确做法);确属无用就删除并顺延编号
    (LaTeX 自动重排,BibTeX 方案重编译一次)。
    A 是「为了对应而乱标」,评委抽查时一眼看穿;
    C 保留「表里 15 条、正文只引 14 条」是评阅中可见的硬伤;
    B 因噎废食,文献表是论文的必要组成部分。
  tags: [论文写作, 终极检查, 参考文献]
