# 数学建模培训平台题库 — modeler 批次 B(评价/统计/图论/微分方程/综合)
# 20 个单元 × 3 题 = 60 题;格式遵循 EXAMPLES.md

# ============ 1. modeler_ahp_01 层次分析法(AHP) · 评价 · beginner ============
- id: modeler_ahp_01_q1
  unit_id: modeler_ahp_01
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    对任意正互反判断矩阵 $A$,其最大特征值 $\lambda_{\max}$ 与阶数 $n$ 的关系是:
  options:
    - 恒有 $\lambda_{\max} \ge n$,且等号成立当且仅当 $A$ 完全一致
    - 恒有 $\lambda_{\max} \le n$,且等号成立当且仅当 $A$ 完全一致
    - 只有完全一致的矩阵才满足 $\lambda_{\max} \ge n$,不一致的矩阵 $\lambda_{\max}$ 可能小于 $n$
    - $\lambda_{\max}$ 与 $n$ 之间没有确定的大小关系,需要逐题计算才知道
  answer_index: 0
  explanation: |
    对正互反矩阵恒有 $\lambda_{\max} \ge n$:把 $\lambda_{\max}$ 写成 $\dfrac{1}{n}\sum_{i,j} a_{ij}\dfrac{w_j}{w_i}$,
    将 $i<j$ 的项两两配对,由 $a_{ij}a_{ji}=1$ 与均值不等式知每对不小于 2,加上 $n$ 个对角线项后即得下界 $n$。
    等号成立当且仅当每一对均值不等式取等,即 $a_{ij}=w_i/w_j$,等价于矩阵满足传递性(完全一致)。
    「$\lambda_{\max} \le n$」把方向记反;「只有一致矩阵才有 $\lambda_{\max}\ge n$」则把充分条件与必要条件搞反——
    任何正互反矩阵都有 $\lambda_{\max}\ge n$,一致时恰好取等。CI 正是用 $\lambda_{\max}-n$ 度量偏离程度,这一结论是一致性检验的理论根基。
  tags: [层次分析法, 一致性检验, 特征值]

- id: modeler_ahp_01_q2
  unit_id: modeler_ahp_01
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    用和积法求判断矩阵
    $$A = \begin{bmatrix} 1 & 2 & 4 \\ 1/2 & 1 & 2 \\ 1/4 & 1/2 & 1 \end{bmatrix}$$
    的权重向量,并判断其一致性。正确结果是:
  options:
    - $w = (0.5714,\ 0.2857,\ 0.1429)$,矩阵完全一致,$\lambda_{\max} = 3$、$CR = 0$
    - $w = (0.1429,\ 0.2857,\ 0.5714)$,矩阵完全一致,$\lambda_{\max} = 3$、$CR = 0$
    - $w = (0.2973,\ 0.5390,\ 0.1638)$,$\lambda_{\max} = 3.0092$、$CR = 0.0079$
    - $w = (0.5714,\ 0.2857,\ 0.1429)$,但 $\lambda_{\max} = 3.0092$、$CR = 0.0079$
  answer_index: 0
  explanation: |
    列和为 $(7/4,\ 7/2,\ 7)$,列归一化后三列都是 $(4/7,\ 2/7,\ 1/7)^T$,按行平均即权重
    $w = (4/7,\ 2/7,\ 1/7) = (0.5714,\ 0.2857,\ 0.1429)$。
    该矩阵满足传递性($a_{13}=4=2\times 2=a_{12}a_{23}$),是完全一致矩阵,故 $\lambda_{\max}=3$、$CR=0$。
    干扰项分析:选项 B 是「反向比较忘记取倒数」的典型后果(权重排序整个反转);
    选项 C 的权重与 $\lambda_{\max}=3.0092$ 属于另一个矩阵(例题中的准则层矩阵),是「矩阵记混」;
    选项 D 权重算对了却把别的矩阵的检验结果搬来——注意完全一致矩阵的 $\lambda_{\max}$ 恰等于 $n$,不会出现 3.0092。
  tags: [层次分析法, 和积法, 权重计算]

- id: modeler_ahp_01_q3
  unit_id: modeler_ahp_01
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    某 4 阶判断矩阵算得 $\lambda_{\max} = 4.20$。求一致性指标 $CI$ 与一致性比率 $CR$,并判断是否通过检验
    (4 阶的随机一致性指数 $RI = 0.90$):
  options:
    - $CI = 0.0667$,$CR = 0.0741 < 0.1$,通过,一致性可接受
    - $CI = 0.0667$,$CR = 0.1150$(按 3 阶的 $RI = 0.58$ 计算),不通过
    - $CI = 0.05$,$CR = 0.0556 < 0.1$,通过
    - $CI = 0.0667$,$CR = 0.0741$,但不通过,因为 $\lambda_{\max} = 4.20 > 4$ 本身就说明判断无效
  answer_index: 0
  explanation: |
    $$CI = \frac{\lambda_{\max}-n}{n-1} = \frac{4.20-4}{3} = 0.0667, \qquad CR = \frac{CI}{RI} = \frac{0.0667}{0.90} = 0.0741 < 0.1$$
    通过检验。三个干扰项对应三种真实常见错误:①把 $RI$ 误用成 3 阶的 0.58(查表错位,结论从通过翻转为不通过);
    ②$CI$ 的分母误用 $n=4$ 而不是 $n-1=3$;③把「$\lambda_{\max} > n$」当成拒绝理由——任何不完全一致的判断矩阵都有
    $\lambda_{\max} > n$,是否可接受看的恰恰是它偏离的程度(即 $CR$),而不是「是否严格等于 $n$」。
  tags: [层次分析法, 一致性检验, RI表]

# ============ 2. modeler_ahp_02 模糊AHP与改进方法 · 评价 · intermediate ============
- id: modeler_ahp_02_q1
  unit_id: modeler_ahp_02
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    已知三角模糊数 $\tilde{a} = (2, 3, 4)$,另 $\tilde{b} = (1, 2, 3)$。求 $\tilde{a}^{-1}$ 与 $\tilde{a} \otimes \tilde{b}$。正确结果是:
  options:
    - $\tilde{a}^{-1} = (1/4,\ 1/3,\ 1/2)$;$\tilde{a} \otimes \tilde{b} = (2,\ 6,\ 12)$
    - $\tilde{a}^{-1} = (1/2,\ 1/3,\ 1/4)$;$\tilde{a} \otimes \tilde{b} = (2,\ 6,\ 12)$
    - $\tilde{a}^{-1} = (1/4,\ 1/3,\ 1/2)$;$\tilde{a} \otimes \tilde{b} = (3,\ 5,\ 7)$
    - $\tilde{a}^{-1} = (4,\ 3,\ 2)$;$\tilde{a} \otimes \tilde{b} = (2,\ 6,\ 12)$
  answer_index: 0
  explanation: |
    三角模糊数的倒数要把端点顺序反转:$\tilde{a}^{-1} = (1/u,\ 1/m,\ 1/l) = (1/4,\ 1/3,\ 1/2)$——
    因为 $u$ 是最大的端点,其倒数最小,必须放到 $l$ 的位置。选项 B 写 $(1/2, 1/3, 1/4)$ 是「区间端点顺序不反转」的典型错误,
    会得到一条方向颠倒的隶属区间。乘法按分量相乘:$\tilde{a} \otimes \tilde{b} = (2\times1,\ 3\times2,\ 4\times3) = (2,\ 6,\ 12)$;
    选项 C 把「乘」记成了「加」(得 $(3,5,7)$),选项 D 把倒数记成了「取反」(得 $(4,3,2)$)——区间端点顺序反转是模糊运算的第一考点。
  tags: [模糊AHP, 三角模糊数, 模糊运算]

- id: modeler_ahp_02_q2
  unit_id: modeler_ahp_02
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    用 Chang 程度分析法求模糊 AHP 权重时,某因素的权重计算结果为 0(零权重问题)。下列做法**正确**的是:
  options:
    - 这是 Chang 法的已知缺陷(该因素的 $S$ 区间被完全压住),应改用 Buckley 几何平均法,或在论文中明确说明并做敏感性讨论
    - 这说明该因素确实毫不重要,应如实报告零权重,并把它从指标体系中删除
    - 这说明计算过程一定出了错误,应反复调整判断矩阵直到所有权重都大于 0
    - 零权重不影响因素间的相对排序,直接按所得权重报告结论即可
  answer_index: 0
  explanation: |
    Chang 程度分析法在某个因素的模糊综合程度值区间被其他因素完全压住时,可能度 $V(S_i \ge S_k)$ 全部为 0,权重被赋 0——
    这是**方法缺陷**而非真实结论。同一数据用 Buckley 法可得 0.129、经典 AHP 得 0.122,可见该因素并非毫无分量。
    正确应对:首选改用 Buckley 法;若坚持用 Chang 法,必须对零权重做解释与敏感性讨论。
    选项 B「删除指标」把方法缺陷当成了真实结论;选项 C 机械调数据等于为方法辩护而牺牲专家原始判断;
    选项 D 的问题在于零权重会直接改变排序(该因素被彻底踢出),不是「不影响」。
  tags: [模糊AHP, Chang程度分析法, 零权重, Buckley法]

- id: modeler_ahp_02_q3
  unit_id: modeler_ahp_02
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    用 0.1-0.9 标度得到模糊互补判断矩阵
    $$F = \begin{bmatrix} 0.5 & 0.6 & 0.7 \\ 0.4 & 0.5 & 0.6 \\ 0.3 & 0.4 & 0.5 \end{bmatrix}$$
    经检验其满足加法一致性($f_{ik} = f_{ij} + f_{jk} - 0.5$)。求各方案权重:
  options:
    - $w = (0.433,\ 0.333,\ 0.233)$
    - $w = (0.6,\ 0.5,\ 0.4)$
    - $w = (0.233,\ 0.333,\ 0.433)$
    - $w = (0.4,\ 0.333,\ 0.267)$
  answer_index: 0
  explanation: |
    加法一致时权重有解析式 $w_i = \dfrac{2\sum_{j=1}^{n} f_{ij} - 1}{n(n-1)}$。行和依次为 $1.8,\ 1.5,\ 1.2$,故
    $$w_1 = \frac{2\times1.8-1}{3\times2} = \frac{2.6}{6} = 0.433, \quad w_2 = \frac{3-1}{6} = 0.333, \quad w_3 = \frac{2.4-1}{6} = 0.233$$
    三个干扰项对应三种真实错误:选项 B 忘了公式里的「$2\sum f - 1$」结构(直接 $2\sum f/6$,和不为 1);
    选项 C 把权重顺序完全颠倒(方向写反);选项 D 直接把行和归一化(把公式换成了普通归一化)。
    验证:权重满足 $f_{ij} = 0.5 + (w_i - w_j)$ 逐项成立,与判断自洽。
  tags: [模糊互补判断矩阵, 权重公式, 加法一致性]

# ============ 3. modeler_topsis_01 TOPSIS理想解逼近法 · 评价 · beginner ============
- id: modeler_topsis_01_q1
  unit_id: modeler_topsis_01
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    关于 TOPSIS 中的正理想解 $V^+$,下列说法**正确**的是:
  options:
    - $V^+$ 是由各指标在样本内的最优值拼成的虚构方案,通常没有任何真实评价对象能在所有指标上同时最优
    - $V^+$ 一定对应样本中某个真实存在的评价对象
    - $V^+$ 是现实中可以实现的目标方案,可作为绝对标杆使用
    - 只有当样本量足够大时,$V^+$ 才可能对应真实对象
  answer_index: 0
  explanation: |
    正理想解是「每个指标都取所有方案最优值」拼出来的参照点——各指标的最优往往分散在不同对象上,
    所以 $V^+$ 几乎总是一个**虚构方案**,这正是「逼近理想解」中「逼近」二字的含义。
    由此带来的重要推论:TOPSIS 给出的是样本内部的**相对排序**,不是绝对好坏;
    换一批对象或换权重,$V^+$ 与排序都可能改变。选项 B 误把参照点当真实方案;选项 C 把相对参照误当绝对标杆;
    选项 D 把「是否虚构」与样本量挂钩——无论样本多大,「各指标全最优」的对象依然几乎不存在。
  tags: [TOPSIS, 正理想解, 相对评价]

- id: modeler_topsis_01_q2
  unit_id: modeler_topsis_01
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    两个方案、两个指标(均为效益型),决策矩阵 $X = \begin{bmatrix} 4 & 8 \\ 3 & 6 \end{bmatrix}$,取等权。经向量规范化、
    加权并构造理想解后,两方案的贴近度为:
  options:
    - $C_1 = 1$,$C_2 = 0$
    - $C_1 = 0$,$C_2 = 1$
    - $C_1 = C_2 = 0.5$
    - $C_1 = 0.8$,$C_2 = 0.6$
  answer_index: 0
  explanation: |
    列范数:$\sqrt{4^2+3^2} = 5$、$\sqrt{8^2+6^2} = 10$,规范化后 $Z = \begin{bmatrix} 0.8 & 0.8 \\ 0.6 & 0.6 \end{bmatrix}$;
    等权(各 0.5)加权后 $V = \begin{bmatrix} 0.4 & 0.4 \\ 0.3 & 0.3 \end{bmatrix}$。
    方案 1 两个指标都取到列最大值,它**本身就是**正理想解:$V^+ = (0.4, 0.4)$,故 $D_1^+ = 0$、$D_1^- = \sqrt{0.02}$,
    $C_1 = \dfrac{D_1^-}{D_1^+ + D_1^-} = 1$;方案 2 恰是负理想解,$C_2 = 0$。
    选项 B 把分子分母用反($C = D^+/(D^++D^-)$),是「只盯着离正理想解近」的方向性错误;
    选项 C 误以为贴近度是两方案之间的相对比例;选项 D 把规范化值直接当成了贴近度——贴近度必须经过距离计算,不能跳步。
  tags: [TOPSIS, 贴近度, 向量规范化]

- id: modeler_topsis_01_q3
  unit_id: modeler_topsis_01
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    某评价问题中正理想解 $V^+ = (0, 0)$、负理想解 $V^- = (10, 10)$;方案 A 的加权值为 $(0.5,\ 7)$,方案 B 为 $(4.5,\ 4.5)$。
    若只按「离正理想解的距离 $D^+$」排序,与按 TOPSIS 贴近度 $C$ 排序,结论分别是:
  options:
    - 只按 $D^+$:B 更优($D_B^+ = 6.364 < D_A^+ = 7.018$);按贴近度:A 更优($C_A = 0.587 > C_B = 0.550$)
    - 只按 $D^+$:A 更优;按贴近度:B 更优
    - 两种方式都判定 A 更优
    - 两种方式都判定 B 更优
  answer_index: 0
  explanation: |
    先算距离:$D_A^+ = \sqrt{0.5^2 + 7^2} = 7.018$,$D_A^- = \sqrt{(0.5-10)^2 + (7-10)^2} = 9.962$;
    $D_B^+ = \sqrt{4.5^2 + 4.5^2} = 6.364$,$D_B^- = \sqrt{(4.5-10)^2 + (4.5-10)^2} = 7.778$。
    只看 $D^+$ 会判 B 优(它离正理想解更近),但贴近度
    $C_A = \dfrac{9.962}{9.962+7.018} = 0.587 > C_B = \dfrac{7.778}{7.778+6.364} = 0.550$,**A 才是 TOPSIS 的优胜者**。
    原因:A 在指标 1 上几乎贴着正理想解(0.5 对 0),同时远离负理想解;只看 $D^+$ 丢掉了「远离 $V^-$」这一半信息。
    这正是 TOPSIS 必须同时使用两个距离、以 $C = D^-/(D^+ + D^-)$ 排序的原因。
  tags: [TOPSIS, 贴近度, 双距离]

# ============ 4. modeler_entropy 熵权法与客观赋权 · 评价 · beginner ============
- id: modeler_entropy_q1
  unit_id: modeler_entropy
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    若某指标在所有评价对象上的取值完全相同,则熵权法给出的该指标权重是:
  options:
    - 权重为 0(信息熵 $e = 1$,差异系数 $d = 0$),该指标不参与区分任何对象
    - 权重为 1(该指标最稳定,应赋最大权重)
    - 权重为 $1/n$(与其他指标均分)
    - 无法计算(比重为零导致 $\ln 0$ 无定义)
  answer_index: 0
  explanation: |
    取值完全相同 → 每列比重 $p_{ij} = 1/m$ 均匀分布 → 熵取最大值
    $e_j = -\dfrac{1}{\ln m}\cdot m\cdot\dfrac{1}{m}\ln\dfrac{1}{m} = 1$ → 差异系数 $d_j = 1 - e_j = 0$ → 权重 $w_j = 0$。
    这正是「熵大权小」口诀的极端情形:均匀分布 = 完全无法区分对象 = 信息量为零,自然不该参与排序。
    选项 B 把「稳定」当成「重要」,搞反了熵权法的逻辑(它是**区分度**权重,不是重要性权重);
    选项 C 忘了归一化分母只对其他指标求和;$p_{ij} = 0$ 时按约定取 $0\ln 0 = 0$,不会无定义,选项 D 的顾虑在约定下不存在。
  tags: [熵权法, 信息熵, 区分度权重]

- id: modeler_entropy_q2
  unit_id: modeler_entropy
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    2 个评价对象、2 个指标(已同向化、非负),数据 $X = \begin{bmatrix} 1 & 1 \\ 3 & 3 \end{bmatrix}$。求信息熵与熵权:
  options:
    - 两列熵相同:$e_1 = e_2 = 0.8113$;权重 $w = (0.5,\ 0.5)$
    - 两列熵相同:$e_1 = e_2 = 0.5623$;权重 $w = (0.5,\ 0.5)$
    - 两列熵相同:$e_1 = e_2 = 0.8113$;权重 $w = (0.1887,\ 0.1887)$
    - 两列熵相同:$e_1 = e_2 = 0.8113$;权重 $w = (0.25,\ 0.75)$
  answer_index: 0
  explanation: |
    两列数据相同,比重都是 $(1/4,\ 3/4)$,故两列熵相同:
    $$e = -\frac{1}{\ln 2}\left(\frac{1}{4}\ln\frac{1}{4} + \frac{3}{4}\ln\frac{3}{4}\right) = 1.4427 \times (0.3466 + 0.2158) = 0.8113$$
    差异系数 $d = 1 - 0.8113 = 0.1887$,两列相同,归一化后 $w = (0.5,\ 0.5)$——两指标区分能力一样,权重均分,合理。
    干扰项:选项 B 忘记除以 $\ln m = \ln 2$(熵未归一化,是易错点「忽视 $\ln m$」);
    选项 C 把差异系数 $d$ 直接当权重(忘记归一化);选项 D 把比重 $(1/4, 3/4)$ 当成了权重(混淆比重与权重)。
  tags: [熵权法, 信息熵计算, 归一化]

- id: modeler_entropy_q3
  unit_id: modeler_entropy
  role: modeler
  category: 评价
  difficulty: beginner
  question: |
    关于「熵权法是完全客观的赋权方法」这一说法,下列说法**正确**的是:
  options:
    - 不准确。熵权计算虽无人为打分,但结果依赖指标选取、预处理方式(极差/线性比例)与样本组成,「客观」不等于「唯一正确」
    - 准确。熵权法没有任何主观输入环节,权重由数据唯一确定
    - 准确。因为熵权法给出的权重不随样本改变
    - 不准确。因为熵权法仍然需要专家给出指标间的重要性打分
  answer_index: 0
  explanation: |
    「客观」只意味着「没有人为打分环节」,不等于「唯一正确」:①换掉一个指标,所有权重都变;②极差标准化与线性比例法会给出
    不同的权重;③增删一个评价对象,权重整体改变。所以熵权结果必须在同一数据集内部使用,不能跨样本比较。
    选项 B/C 忽略了这三个建模选择的影响;选项 D 说反了——熵权恰恰**不需要**专家打分(那是 AHP 的特征),
    它的风险不是「依赖专家」,而是「可能违背领域常识」(重要但拉不开差距的指标会被赋低权),因此推荐与主观权重组合使用。
  tags: [熵权法, 客观赋权, 组合赋权]

# ============ 5. modeler_fuzzy_eval 模糊综合评价 · 评价 · intermediate ============
- id: modeler_fuzzy_eval_q1
  unit_id: modeler_fuzzy_eval
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    模糊关系矩阵 $R = \begin{bmatrix} 0.6 & 0.3 & 0.1 \\ 0.4 & 0.4 & 0.2 \end{bmatrix}$,权重 $A = (0.6,\ 0.4)$。
    用加权平均型算子 $M(\cdot, +)$ 求综合评价值 $B$:
  options:
    - $B = (0.52,\ 0.34,\ 0.14)$,各分量之和恰为 1
    - $B = (0.5,\ 0.333,\ 0.167)$
    - $B = (0.6,\ 0.4,\ 0.2)$
    - $B = (0.6,\ 0.3,\ 0.1)$
  answer_index: 0
  explanation: |
    $M(\cdot,+)$ 是加权平均:$b_j = \sum_i a_i r_{ij}$,故
    $$b_1 = 0.6\times0.6 + 0.4\times0.4 = 0.52, \quad b_2 = 0.6\times0.3 + 0.4\times0.4 = 0.34, \quad b_3 = 0.6\times0.1 + 0.4\times0.2 = 0.14$$
    和为 1(R 每行归一化、$A$ 归一化时,加权平均的输出天然归一化)。
    选项 B 是主因素决定型 $M(\wedge,\vee)$ 的输出 $(0.6, 0.4, 0.2)$ **归一化后**的结果——算子选错但顺手归一化了;
    选项 C 是 $M(\wedge,\vee)$ 未归一化的原始输出(和为 1.2,不能直接当比例解读);
    选项 D 把 R 的第一行直接当 B(相当于认为权重全给了因素 1)。论文中必须写明算子:$M(\cdot,+)$ 信息利用最充分,是当前主流选择。
  tags: [模糊综合评价, 模糊合成算子, 加权平均型]

- id: modeler_fuzzy_eval_q2
  unit_id: modeler_fuzzy_eval
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    某次模糊综合评价得 $B = (0.4,\ 0.3,\ 0.3)$,评语等级评分向量 $S = (95,\ 85,\ 70)$。
    问:最大隶属度原则是否有效?两种去模糊化方法各得什么结论?
  options:
    - 无效($\beta = 0.4 < 0.5$);最大隶属度会说「优秀」,加权平均法得 84.5 分落「良好」,两者结论相反
    - 有效(0.4 是最大值);结论为「优秀」
    - 无效;加权平均法得 84.5 分,结论也是「优秀」
    - 有效;加权平均法得 84.5 分,结论为「良好」
  answer_index: 0
  explanation: |
    有效性判据 $\beta = \dfrac{\max_j b_j}{\sum_j b_j} = \dfrac{0.4}{0.4+0.3+0.3} = 0.4 < 0.5$,最大隶属度不占优,**原则失效**——
    0.4 的「优秀」隶属度并没有过半,强行取最大等级不可靠。
    加权平均法:得分 $= 0.4\times95 + 0.3\times85 + 0.3\times70 = 84.5$,落入「良好」区间。
    两种方法的结论**相反**:最大隶属度会说「优秀」,加权平均会说「良好」——这正是引入 $\beta$ 判据的意义:
    隶属度分散时(如 $B=(0.35,0.34,0.31)$ 的情形),最大隶属度原则会给出误导性结论,此时应改用加权平均法。
    选项 B/D 忽略了 $\beta$ 检验;选项 C 把 84.5 分的落区看错(84.5 在 85 之下,属「良好」)。
  tags: [模糊综合评价, 最大隶属度原则, 有效性判据, 去模糊化]

- id: modeler_fuzzy_eval_q3
  unit_id: modeler_fuzzy_eval
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    关于模糊综合评价输出的向量 $B = (b_1, \dots, b_m)$,下列说法**正确**的是:
  options:
    - $B$ 的归一化只是为了让它具有「分布」的形式以便比较,隶属度刻画的是「属于某等级的程度」,允许同时属于多个等级,不是概率
    - $B$ 归一化后就是各等级的概率分布,可以对其做频率学派的统计检验
    - 隶属度与概率没有区别,只是叫法不同
    - 隶属度向量必须归一化,否则 $B$ 无意义
  answer_index: 0
  explanation: |
    概率服从可加性(互斥事件概率和为 1,可做统计推断);隶属度刻画「属于某等级的程度」,一个元素可以同时以
    0.9 属于「优秀」、0.1 属于「良好」——这是**程度**,不是频率。把隶属度当概率使用(做假设检验、计算期望时宣称
    是概率意义下的期望)是模糊综合评价的概念性硬伤,评委会一眼看穿。
    选项 B/C 犯了这一硬伤;选项 D 把话说反了——归一化只是便于解读的约定,$M(\wedge,\vee)$ 等算子的输出未归一化时
    先归一化再解读即可,「不归一化则无意义」是过度表述。
  tags: [模糊综合评价, 隶属度, 概率的区别]

# ============ 6. modeler_dea_01 数据包络分析(DEA) · 评价 · advanced ============
- id: modeler_dea_01_q1
  unit_id: modeler_dea_01
  role: modeler
  category: 评价
  difficulty: advanced
  question: |
    某 DMU 的 DEA 效率 $\theta = 1$。下列解读**正确**的是:
  options:
    - 只能说明它在样本内相对有效;且径向模型下 $\theta = 1$ 仍可能存在非零松弛(弱有效),强有效才要求松弛全为 0
    - 说明它经营完美、投入产出无需任何改进
    - 说明它的绝对效率已达到理论上限,换任何参照对象都仍是 1
    - 说明 CCR 与 BCC 效率都必为 1,规模效率也为 1
  answer_index: 0
  explanation: |
    DEA 评价的是**相对**效率:$\theta=1$ 只表示「在这批 DMU 中,无法等比例压缩投入」。
    两重陷阱:①换一批更强的参照对象,它的效率可能跌破 1;②径向模型只度量「等比例压缩」,
    $\theta=1$ 时可能仍有某单项投入冗余(松弛非零),即「弱有效」,只有 $\theta=1$ 且全部松弛为 0 才是强有效。
    选项 B/C 把相对效率绝对化;选项 D 混淆了模型——CCR 效率为 1 时 BCC 效率必为 1,但反之不然
    (BCC 为 1 只说明纯技术有效,规模可能无效,如例题中处于 IRS 区间的 DMU A:PTE=1 而 TE=0.5714)。
    论文中「DEA 有效」应表述为「在样本内相对有效」。
  tags: [DEA, 相对效率, 弱有效, 松弛变量]

- id: modeler_dea_01_q2
  unit_id: modeler_dea_01
  role: modeler
  category: 评价
  difficulty: advanced
  question: |
    4 个 DMU,单投入单产出:DMU1(1, 2)、DMU2(2, 3)、DMU3(3, 6)、DMU4(4, 7)。求 TE(CCR)、PTE(BCC)、SE,
    并判断 DMU2 与 DMU4 的低效来源:
  options:
    - $TE = (1,\ 0.75,\ 1,\ 0.875)$,$PTE = (1,\ 0.75,\ 1,\ 1)$,$SE = (1,\ 1,\ 1,\ 0.875)$;DMU2 低效全来自纯技术,DMU4 低效全来自规模(DRS)
    - 数值同上;但 DMU2 低效全来自规模,DMU4 低效全来自纯技术
    - $TE = (1,\ 0.75,\ 1,\ 0.875)$,$PTE = (1,\ 1,\ 1,\ 1)$,$SE = (1,\ 0.75,\ 1,\ 0.875)$
    - $TE = (1,\ 0.75,\ 1,\ 0.875)$,$PTE = (1,\ 0.75,\ 1,\ 1)$,$SE = TE \times PTE = (1,\ 0.5625,\ 1,\ 0.875)$
  answer_index: 0
  explanation: |
    产出投入比 $y/x = (2,\ 1.5,\ 2,\ 1.75)$,最大为 2,故 $TE = (1,\ 0.75,\ 1,\ 0.875)$。
    VRS 前沿是 DMU1—DMU3(斜率 2)、DMU3—DMU4(斜率 1)的凹包络;DMU2(2,3) 落在前沿线 $y=2x$ 下方
    ($x=2$ 处前沿产出为 4 > 3),投入导向目标 $x^* = 1.5$,故 $PTE_2 = 1.5/2 = 0.75$,其余三点在前沿上 PTE=1。
    $SE = TE/PTE = (1,\ 1,\ 1,\ 0.875)$。DMU2 的 TE 与 PTE 同为 0.75、SE=1:低效**全部来自纯技术**(管理层面);
    DMU4 的 PTE=1 但 SE=0.875:低效**全部来自规模**,且其投入越过最优规模点 DMU3,属规模报酬递减(DRS)。
    选项 B 把两者的低效来源对调;选项 C 漏判了 DMU2 的纯技术无效(把前沿判断错);
    选项 D 把分解公式记成相乘——正确是 $TE = PTE \times SE$,即 $SE = TE/PTE$。
  tags: [DEA, 效率分解, 规模报酬, CCR, BCC]

- id: modeler_dea_01_q3
  unit_id: modeler_dea_01
  role: modeler
  category: 评价
  difficulty: advanced
  question: |
    关于 CCR 与 BCC 两个模型,下列说法**正确**的是:
  options:
    - CCR 假设规模报酬不变(CRS),前沿是过原点的锥;BCC 加入凸性约束 $\sum_j \lambda_j = 1$ 允许规模报酬可变(VRS),前沿是样本的凸包络;两者之比给出规模效率
    - CCR 与 BCC 的区别在于投入导向与产出导向,与规模报酬假设无关
    - CCR 的前沿是样本的凸包络,BCC 的前沿是过原点的射线
    - 两者结果恒相同,实际建模只需跑其中一个
  answer_index: 0
  explanation: |
    CCR(Charnes-Cooper-Rhodes, 1978)假设 CRS:投入翻倍产出也翻倍,包络形式的 $\lambda$ 无额外约束,前沿是过原点的锥;
    BCC(Banker-Charnes-Cooper, 1984)加入 $\sum_j \lambda_j = 1$ 的凸性约束,前沿变为样本的凸包络,更贴合实际规模收益。
    $TE = \theta_{CCR}$、$PTE = \theta_{BCC}$、$SE = TE/PTE$——只跑 CCR 会把规模无效全部归为技术无效,无法区分
    「管理差」与「规模不对」。选项 B 把模型差异与导向差异混淆(CRS 下输入/输出导向结果相同,这是另一个维度);
    选项 C 把两个前沿说反;选项 D 是竞赛论文的常见翻车点(只报 CCR)。
  tags: [DEA, CCR模型, BCC模型, 规模效率]

# ============ 7. modeler_grey_rel 灰色关联分析 · 评价 · intermediate ============
- id: modeler_grey_rel_q1
  unit_id: modeler_grey_rel
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    参考序列 $x_0 = (1, 2, 3)$,比较序列 $x_1 = (1, 2, 3)$ 与 $x_2 = (1, 2, 2)$(数据已同量纲,可直接计算)。
    取分辨系数 $\rho = 0.5$,求两者的邓氏关联度:
  options:
    - $r_1 = 1$(逐点重合);$r_2 = 0.7778$
    - $r_1 = 1$;$r_2 = 0.6667$
    - $r_1 = 1$;$r_2 = 0.8333$
    - $r_1 = r_2 = 1$
  answer_index: 0
  explanation: |
    $x_1$ 与 $x_0$ 逐点重合:差序列全 0,关联系数全 1,$r_1 = 1$。
    对 $x_2$:$\Delta = (0,\ 0,\ 1)$,两级极差 $m = 0$、$M = 1$,$\rho M = 0.5$,关联系数
    $$\xi_2 = \left(1,\ 1,\ \frac{0.5}{1+0.5}\right) = (1,\ 1,\ 0.3333), \qquad r_2 = \frac{1+1+0.3333}{3} = 0.7778$$
    排序 $x_1 > x_2$,符合直觉。干扰项:选项 B 把第三点的关联系数误当成 0(漏掉分子 $m+\rho M$);
    选项 C 是 $\rho = 1$ 时的结果($\xi_3 = 0.5/(1+1) = 0.5$,$r_2 = 0.8333$)——用错分辨系数;
    选项 D 忽略了第三点的差异,误以为「只差一点」不影响关联度。
  tags: [灰色关联分析, 邓氏关联度, 关联系数]

- id: modeler_grey_rel_q2
  unit_id: modeler_grey_rel
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    关于邓氏关联系数 $\xi_i(k) = \dfrac{m + \rho M}{\Delta_i(k) + \rho M}$ 的取值范围,下列说法**正确**的是:
  options:
    - 取值范围是 $\left[\dfrac{\rho}{1+\rho},\ 1\right]$;取 $\rho = 0.5$ 时下限为 $1/3$,所以关联度数值天然「偏高」
    - 取值范围是 $[0, 1]$;$\Delta_i(k) = 0$ 时取 0
    - 取值范围是 $[0, 1]$;只有两点完全重合时才取到 1
    - 取值范围是 $(0, 1)$;端点永远取不到
  answer_index: 0
  explanation: |
    $\Delta_i(k) = 0$(两点重合)时 $\xi = 1$;$\Delta_i(k) = M$(差距最大)时
    $\xi = \dfrac{m+\rho M}{M+\rho M} = \dfrac{\rho M}{(1+\rho)M} = \dfrac{\rho}{1+\rho}$($m=0$ 时),
    取 $\rho=0.5$ 时下限为 $1/3$。所以邓氏关联度的数值看起来总是「偏高」,这是公式构造使然,
    排序比较时不必惊讶,但也意味着**跨数据集比较关联度没有意义**,只能在同一分析内部排序。
    选项 B 把重合点处的取值说成 0(方向完全反了);选项 C 的范围错(下限不是 0);
    选项 D 说端点取不到——重合点与最大差点恰恰把两个端点都取到。
  tags: [灰色关联分析, 关联系数, 分辨系数]

- id: modeler_grey_rel_q3
  unit_id: modeler_grey_rel
  role: modeler
  category: 评价
  difficulty: intermediate
  question: |
    关于分辨系数 $\rho$ 的作用,下列说法**正确**的是:
  options:
    - $\rho$ 越小,各关联系数的数值整体越低、相互差异拉得越大(分辨率越高);单点时点的大小关系与 $\rho$ 无关,但平均关联度的排序可能随 $\rho$ 改变
    - $\rho$ 越大,分辨率越高,关联系数间差异越大
    - $\rho$ 是各比较序列的权重,取值越大表示该序列越重要
    - $\rho$ 的取值不影响任何结论,论文中无需报告
  answer_index: 0
  explanation: |
    $\rho$ 是「分辨系数」而非权重:它控制关联系数的数值区间 $[\rho/(1+\rho), 1]$ 与分辨能力。
    $\rho$ 减小 → 分子 $m+\rho M$ 与分母中的 $\rho M$ 占比同时下降 → 数值整体下降、差异拉大(分辨率提高);
    $\rho$ 增大则数值整体抬升、趋于平坦。对**同一时点**,两个序列关联系数的大小只取决于差序列大小,与 $\rho$ 无关;
    但当两序列的差距「此起彼伏」(前段一个更近、后段另一个更近)时,**平均关联度的排序可能随 $\rho$ 改变**——
    因此通常取 $\rho = 0.5$ 并在论文中说明,必要时做 $\rho = 0.3/0.5/0.7$ 三档敏感性检查。
    选项 B 把方向说反;选项 C 把分辨系数误当权重;选项 D 忽略了排序翻转风险。
  tags: [灰色关联分析, 分辨系数, 敏感性分析]

# ============ 8. modeler_mle_01 极大似然估计 · 统计 · intermediate ============
- id: modeler_mle_01_q1
  unit_id: modeler_mle_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    设 $X \sim N(\mu, \sigma^2)$,样本为 $(2,\ 4,\ 6)$。求 $\mu$ 与 $\sigma^2$ 的极大似然估计,并指出 $\hat{\sigma}^2$ 的性质:
  options:
    - $\hat{\mu} = 4$,$\hat{\sigma}^2 = \dfrac{8}{3} \approx 2.667$(分母为 $n$),这是有偏估计
    - $\hat{\mu} = 4$,$\hat{\sigma}^2 = 4$(分母为 $n-1$),这是无偏估计
    - $\hat{\mu} = 4$,$\hat{\sigma}^2 = \dfrac{8}{3}$,且它是无偏估计
    - $\hat{\mu} = 3$,$\hat{\sigma}^2 = \dfrac{8}{3}$
  answer_index: 0
  explanation: |
    对数似然对 $\mu$、$\sigma^2$ 求偏导得 $\hat{\mu} = \bar{x} = 4$,
    $$\hat{\sigma}^2 = \frac{1}{n}\sum_{i=1}^{n}(x_i - \hat{\mu})^2 = \frac{(2-4)^2 + (4-4)^2 + (6-4)^2}{3} = \frac{8}{3} \approx 2.667$$
    注意分母是 $n$ 而不是 $n-1$:MLE 的 $\hat{\sigma}^2$ 是**有偏**估计($E[\hat{\sigma}^2] = \frac{n-1}{n}\sigma^2$,系统性偏小),
    无偏版本 $s^2 = \frac{1}{n-1}\sum(x_i-\bar{x})^2 = 4$,二者关系 $s^2 = \frac{n}{n-1}\hat{\sigma}^2$。
    选项 B 把无偏估计当成了 MLE(这是最常见的混淆);选项 C 数值对但性质判断错;选项 D 把均值算成了 $(2+4)/2 = 3$(漏了 6)。
  tags: [极大似然估计, 正态分布, 有偏估计]

- id: modeler_mle_01_q2
  unit_id: modeler_mle_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    设 $X_1, \dots, X_n \sim U(0, \theta)$($\theta > 0$ 未知)。$\theta$ 的极大似然估计是:
  options:
    - $\hat{\theta} = \max\{x_i\}$,这是边界解:似然 $1/\theta^n$ 关于 $\theta$ 单调递减,求导无驻点,最大值在可行域下边界取到
    - $\hat{\theta} = \bar{x}$,由得分方程 $\ell'(\theta) = 0$ 解得
    - $\hat{\theta} = 2\bar{x}$,因为均匀分布的期望是 $\theta/2$
    - $\hat{\theta} = \min\{x_i\}$,因为似然关于 $\theta$ 单调递增
  answer_index: 0
  explanation: |
    似然函数 $L(\theta) = \dfrac{1}{\theta^n}\cdot\mathbf{1}\{\max_i x_i < \theta\}$:当 $\theta < \max\{x_i\}$ 时至少一个样本
    落在区间外,似然为 0(该参数根本不可能产生这批数据);当 $\theta \ge \max\{x_i\}$ 时 $L(\theta) = 1/\theta^n$ 随 $\theta$ 增大而
    **单调递减**。所以最大值在可行域的下边界 $\hat{\theta} = \max\{x_i\}$ 取到。单调函数没有驻点,得分方程自然无解——
    这提醒我们:求导只能找到**内部**极值,参数空间的边界必须单独检查。
    选项 B 误用求导法;选项 C 是**矩估计**的结果($\bar{x} = \theta/2 \Rightarrow \hat{\theta} = 2\bar{x}$),混淆了两种估计方法;
    选项 D 把单调方向说反。
  tags: [极大似然估计, 均匀分布, 边界解]

- id: modeler_mle_01_q3
  unit_id: modeler_mle_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    关于极大似然估计(MLE)的性质,下列说法**正确**的是:
  options:
    - MLE 具有一致性、渐近正态性与渐近有效性,且满足不变性($g(\hat{\theta})$ 是 $g(\theta)$ 的 MLE);但它不一定无偏
    - MLE 一定是无偏估计,这是它优于矩估计的原因
    - MLE 一定存在且唯一,并且总能由求导得到
    - MLE 只适用于连续型分布,离散分布无法定义似然函数
  answer_index: 0
  explanation: |
    MLE 的四大优良性质:一致性($n\to\infty$ 时依概率收敛到真值)、渐近正态($\sqrt{n}(\hat{\theta}-\theta)$ 渐近 $N(0, 1/I(\theta))$)、
    渐近有效(方差达到 Cramér-Rao 下界)、不变性(如 $\hat{\lambda}=\bar{x}$ 是泊松参数的 MLE,则 $e^{-\lambda}$ 的 MLE 就是 $e^{-\bar{x}}$)。
    但它**不一定无偏**:正态的 $\hat{\sigma}^2 = \frac{1}{n}\sum(x_i-\bar{x})^2$ 偏小,$U(0,\theta)$ 的 $\hat{\theta} = \max\{x_i\}$ 也偏小
    ($E[\hat{\theta}] = \frac{n}{n+1}\theta$);MLE 拥有的是**渐近无偏性**。
    选项 B 把「渐近无偏」当成了「无偏」;选项 C 被 $U(0,\theta)$ 的边界解反例否决(驻点法失效、需数值优化);
    选项 D 忘了伯努利、泊松等离散分布的 MLE 正是教科书标准内容。
  tags: [极大似然估计, 一致性, 不变性, 渐近性质]

# ============ 9. modeler_bayes_01 贝叶斯推断 · 统计 · intermediate ============
- id: modeler_bayes_01_q1
  unit_id: modeler_bayes_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    某疾病患病率 1%,检测方法对患者呈阳性的概率(灵敏度)为 99%,对健康人误报阳性的概率为 5%。
    一人检测呈阳性,他实际患病的概率约是:
  options:
    - $16.7\%$:$P(D \mid T^+) = \dfrac{0.99 \times 0.01}{0.99 \times 0.01 + 0.05 \times 0.99} = \dfrac{1}{6}$
    - $99\%$(检测的灵敏度就是患病的概率)
    - $1.9\%$(对应患病率 0.1% 的情形)
    - $5\%$(阳性结果中误报的比例)
  answer_index: 0
  explanation: |
    由贝叶斯公式:
    $$P(D \mid T^+) = \frac{P(T^+ \mid D)P(D)}{P(T^+ \mid D)P(D) + P(T^+ \mid \bar{D})P(\bar{D})} = \frac{0.99 \times 0.01}{0.99 \times 0.01 + 0.05 \times 0.99} = \frac{0.0099}{0.0594} = \frac{1}{6} \approx 16.7\%$$
    灵敏度高达 99%,阳性后患病概率却只有 16.7%——因为健康人基数大,5% 的误报制造了大量假阳性。
    这就是**基础比率谬误**:只看灵敏度(选项 B)会严重高估;正确的推理必须把先验(患病率)乘进去。
    选项 C 是把患病率降到 0.1% 时同一检测的结果(约 1.9%),说明先验一变小结论进一步暴跌;
    选项 D 把误报率直接当成患病概率,混淆了 $P(T^+ \mid \bar{D})$ 与 $P(\bar{D} \mid T^+)$。
  tags: [贝叶斯公式, 基础比率谬误, 灵敏度]

- id: modeler_bayes_01_q2
  unit_id: modeler_bayes_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    某路口事故数服从 Poisson($\lambda$),历史经验取先验 $\lambda \sim \text{Gamma}(2, 1)$(先验均值 2)。
    今年观测 1 年发生 3 起事故。$\lambda$ 的后验分布与后验均值是:
  options:
    - 后验为 $\text{Gamma}(5, 2)$,后验均值 $= 5/2 = 2.5$
    - 后验为 $\text{Gamma}(5, 4)$,后验均值 $= 1.25$
    - 后验均值为 3(MLE 的结果)
    - 后验均值为 2(先验均值,数据不改变信念)
  answer_index: 0
  explanation: |
    Gamma–泊松共轭:后验参数 $\alpha' = \alpha + \sum x_i = 2 + 3 = 5$,$\beta' = \beta + n = 1 + 1 = 2$,
    故后验为 $\text{Gamma}(5, 2)$,均值 $\dfrac{5}{2} = 2.5$——介于先验均值 2 与观测值 3 之间,偏向数据一侧。
    选项 B 把 $\beta$ 也加了观测值($1+3$),是「两个参数都加 $\sum x_i$」的常见错误;
    选项 C 是频率学派的 MLE(完全不吸收历史信息)——贝叶斯在小样本下的优势正是把先验「拉进来」;
    选项 D 走向另一个极端:完全忽略数据。样本量越大,后验均值越接近 $\bar{x}$,先验影响渐消。
  tags: [贝叶斯推断, Gamma-泊松共轭, 后验均值]

- id: modeler_bayes_01_q3
  unit_id: modeler_bayes_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    关于 95% 可信区间(credible interval)与 95% 置信区间(confidence interval),下列说法**正确**的是:
  options:
    - 可信区间可直说「给定先验与这批数据,参数落入该区间的概率为 95%」;置信区间是频率性质,不能针对眼前这一次实验说「真值有 95% 概率在区间里」
    - 两者只是名称不同,含义完全相同,可以混用
    - 置信区间可以解读为「真值落在该区间的概率为 95%」
    - 可信区间不依赖先验,只由数据决定
  answer_index: 0
  explanation: |
    置信区间是频率学派的工具:区间端点随样本变化,长期重复抽样下 95% 的实验「区间覆盖真值」;
    但对**眼前这一次**实验,不能说「真值有 95% 概率在区间里」(真值是常数,要么在要么不在)。
    可信区间是贝叶斯学派的工具:给定先验与这批数据,后验分布上 95% 的质量集中在区间内,
    因此可以直说「参数有 95% 概率落在该区间」。选项 B 抹掉了两种概率解释的本质区别;
    选项 C 是频率学派论文里最常见的表述硬伤;选项 D 说反了——可信区间的定义恰恰**依赖先验**(先验变了区间就变)。
    论文表述:频率方法写「在 95% 置信水平下,区间为 …」;贝叶斯方法写「参数的后验 95% 可信区间为 …」。
  tags: [贝叶斯推断, 可信区间, 置信区间]

# ============ 10. modeler_mc_01 蒙特卡洛模拟 · 统计 · beginner ============
- id: modeler_mc_01_q1
  unit_id: modeler_mc_01
  role: modeler
  category: 统计
  difficulty: beginner
  question: |
    关于蒙特卡洛(MC)积分误差,下列说法**正确**的是:
  options:
    - MC 误差为 $O(1/\sqrt{N})$,与积分维数无关;而梯形法等确定性方法在 $d$ 维的误差为 $O(N^{-2/d})$,高维时 MC 几乎是唯一实用选择
    - MC 误差为 $O(1/\sqrt{N})$,但梯形法的误差也与维数无关
    - MC 误差随维数升高而增大,维数灾难同样困扰 MC
    - MC 误差为 $O(1/N)$,比梯形法收敛更快
  answer_index: 0
  explanation: |
    由中心极限定理,样本均值的标准误为 $\sigma/\sqrt{N}$,只取决于被积函数的标准差与样本量,**与维数 $d$ 无关**。
    而确定性数值积分在 $d$ 维空间需要约 $N^d$ 个格点(每维 $N$ 个),梯形法误差 $O(N^{-2/d})$,
    维数越高退化越严重。所以 $d \ge 4$ 左右时,MC 对一般光滑被积函数几乎是唯一实用的选择——「维数灾难」恰恰是 MC 的主场。
    选项 B 误以为梯形法也与维数无关;选项 C 把 MC 的误差(与维数无关)和确定性方法的维数灾难混为一谈;
    选项 D 把收敛阶记错:MC 是 $1/\sqrt{N}$ 而不是 $1/N$,这正是「精度提高 10 倍需样本量增大 100 倍」的根源。
  tags: [蒙特卡洛, 误差分析, 维数灾难]

- id: modeler_mc_01_q2
  unit_id: modeler_mc_01
  role: modeler
  category: 统计
  difficulty: beginner
  question: |
    用投点法估计 $\pi$:在单位正方形内撒 $N = 10000$ 个点,落在四分之一圆内的有 7854 个。$\pi$ 的估计值是:
  options:
    - $\hat{\pi} = 4 \times \dfrac{7854}{10000} = 3.1416$
    - $\hat{\pi} = \dfrac{7854}{10000} = 0.7854$
    - $\hat{\pi} = 4 \times 7854 = 31416$
    - $\hat{\pi} = 1 - \dfrac{7854}{10000} = 0.2146$
  answer_index: 0
  explanation: |
    四分之一圆面积与正方形面积之比恰为 $\pi/4$,命中比例 $\dfrac{7854}{10000} = 0.7854$ 估计的就是 $\pi/4$,
    因此 $\hat{\pi} = 4 \times 0.7854 = 3.1416$(与真值 3.1416 十分接近)。
    选项 B 忘了乘 4——命中比例是 $\pi/4$ 的估计,不是 $\pi$ 本身,这是投点法最经典的跳步错误;
    选项 C 忘了除以 $N$;选项 D 算的是「未命中比例」,方向完全反了。
    报告时还应附标准误 $4\sqrt{p(1-p)/N} \approx 0.0164$,而不是只报一个孤零零的点估计。
  tags: [蒙特卡洛, 投点法, 圆周率]

- id: modeler_mc_01_q3
  unit_id: modeler_mc_01
  role: modeler
  category: 统计
  difficulty: beginner
  question: |
    用蒙特卡洛估计某个量,当前误差约 1%。若想把误差降到约 0.1%(精度提高 10 倍),样本量需要:
  options:
    - 增大到原来的 100 倍(误差按 $1/\sqrt{N}$ 下降,$\dfrac{1}{10}$ 的误差需要 $10^2$ 倍样本)
    - 增大到原来的 10 倍(误差与样本量成反比)
    - 增大到原来的 1000 倍
    - 样本量不变,换更好的随机数生成器即可
  answer_index: 0
  explanation: |
    标准误 $SE = \sigma/\sqrt{N}$:误差降到原来的 $1/10$,需要 $\sqrt{N}$ 增大 10 倍,即 $N$ 增大 $10^2 = 100$ 倍。
    这是 MC 的「笨方法」本质——精度每多一位,成本暴涨两个数量级。所以竞赛中的聪明做法不是盲目加大 $N$,
    而是先做**方差缩减**(对偶变量、控制变量、分层抽样、重要抽样):比如对 $\int_0^1 x^2\,dx$,对偶变量法能把方差压 16 倍,
    相当于样本量免费放大 16 倍。选项 B 把收敛阶记成 $1/N$(线性);选项 C 是「精度 10 倍 → 1000 倍」的过度估计;
    选项 D 混淆了「随机数的质量」与「统计误差」——误差来自抽样波动,不是随机数不够随机。
  tags: [蒙特卡洛, 标准误, 样本量, 方差缩减]

# ============ 11. modeler_pca_01 主成分分析(PCA) · 统计 · intermediate ============
- id: modeler_pca_01_q1
  unit_id: modeler_pca_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    关于「做 PCA 之前是否必须标准化」,下列说法**正确**的是:
  options:
    - 不是必须。各变量量纲一致且方差量级相近时可只做中心化、用协方差矩阵;量纲不同(如身高与体重)或方差悬殊时必须先标准化、用相关矩阵
    - 必须。任何数据在 PCA 前都要标准化到均值 0、方差 1
    - 不需要。PCA 对量纲不敏感,标准化与否不影响结果
    - 只需中心化;标准化会破坏数据信息,PCA 中不应使用
  answer_index: 0
  explanation: |
    PCA 对「信息」的度量是方差:若直接对量纲不同的变量(身高 cm 方差数千 vs 体重 kg 方差数百)做 PCA,
    第一主成分几乎就是身高,其他变量被彻底淹没。原则:想保留各变量的「绝对差异」就用协方差矩阵(仅中心化);
    想一视同仁就用相关矩阵(先标准化)。选项 B 把「视情况」绝对化;选项 C 否认了量纲对结果的决定性影响
    (同一份数据,协方差 PCA 与相关 PCA 可以给出完全不同的主成分);选项 D 说反了——
    标准化是 PCA 的**常规**预处理,「破坏信息」的顾虑只有在刻意保留方差差异时才成立,且此时也应说明理由。
  tags: [PCA, 标准化, 协方差矩阵, 相关矩阵]

- id: modeler_pca_01_q2
  unit_id: modeler_pca_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    某数据中心化后的协方差矩阵为 $S = \begin{bmatrix} 2.5 & 2 \\ 2 & 2.5 \end{bmatrix}$。求特征值、第一主成分方向与方差解释率:
  options:
    - $\lambda_1 = 4.5$,$\lambda_2 = 0.5$;PC1 方向 $(1/\sqrt{2},\ 1/\sqrt{2})$;解释率 90% 与 10%
    - $\lambda_1 = 2.5$,$\lambda_2 = 2$;PC1 方向 $(1,\ 1)$;解释率 55.6% 与 44.4%
    - $\lambda_1 = 4.5$,$\lambda_2 = 0.5$;PC1 方向 $(1/\sqrt{2},\ -1/\sqrt{2})$;解释率 90% 与 10%
    - $\lambda_1 = 4.5$,$\lambda_2 = 0.5$;PC1 方向 $(1/\sqrt{2},\ 1/\sqrt{2})$;解释率 10% 与 90%
  answer_index: 0
  explanation: |
    解特征方程 $|S - \lambda I| = (2.5-\lambda)^2 - 4 = 0$,得 $\lambda = 2.5 \pm 2$,即 $\lambda_1 = 4.5$、$\lambda_2 = 0.5$。
    大特征值 4.5 对应方向:$(S - 4.5I)w = 0$ 给出 $w \propto (1, 1)$,单位化得 $(1/\sqrt{2}, 1/\sqrt{2})$。
    解释率:$\dfrac{4.5}{4.5+0.5} = 90\%$ 与 $\dfrac{0.5}{5} = 10\%$。
    干扰项:选项 B 把**对角元**直接当特征值(忘记非对角元 2 的贡献)——只在对角阵时才成立;
    选项 C 拿成了第二(小)特征值对应的特征向量(主成分按特征值降序取,方向拿反);
    选项 D 把两个主成分的解释率对调(大特征值对应大解释率)。注意特征向量符号可整体翻转,$(-1/\sqrt{2},-1/\sqrt{2})$ 也是 PC1 方向。
  tags: [PCA, 特征分解, 方差解释率, 载荷]

- id: modeler_pca_01_q3
  unit_id: modeler_pca_01
  role: modeler
  category: 统计
  difficulty: intermediate
  question: |
    关于「选择保留前 $k$ 个主成分」的依据,下列说法**正确**的是:
  options:
    - 常用依据:累计方差解释率达到 80%~90%、碎石图的「陡峭转平缓」拐点、Kaiser 准则(特征值 $\ge 1$,仅适用于标准化后的相关矩阵)
    - 恒取 $k = 2$,因为二维图最好展示,与解释率无关
    - 必须保留全部主成分,丢弃任何成分都会损失信息
    - 只看第一个特征值是否大于 1 即可
  answer_index: 0
  explanation: |
    选 $k$ 的三种标准依据:①**累计方差解释率**(前 $k$ 个成分累计解释 80%~90% 以上,最常用,须在论文中报告);
    ②**碎石图拐点**(特征值随序号折线的「陡峭转平缓」处);③**Kaiser 准则**(特征值 ≥1)——注意它只在
    标准化数据(相关矩阵)下有意义,因为相关矩阵的对角元全是 1、总方差等于变量数,特征值 1 是「平均水平」。
    选项 B 把展示方便当成了选 $k$ 的依据(若前两个主成分只解释 30% 方差,降到 2 维会严重失真);
    选项 C 否认了降维的价值(丢弃的残差方差恰为 $\sum_{j=k+1}^{p}\lambda_j$,小特征值方向往往只是噪声);
    选项 D 是 Kaiser 准则的残缺版(该准则要求**所有**保留成分的特征值都 ≥1,而不是只看第一个)。
  tags: [PCA, 主成分个数, 碎石图, Kaiser准则]

# ============ 12. modeler_shortest 最短路径与Dijkstra · 图论 · beginner ============
- id: modeler_shortest_q1
  unit_id: modeler_shortest
  role: modeler
  category: 图论
  difficulty: beginner
  question: |
    为什么 Dijkstra 算法要求所有边权非负?以下说法**正确**的是:
  options:
    - 贪心依据「已确定的最短距离不会再被改小」;负权边允许绕远路反而更短,破坏这一前提。反例:$s \to a = 1$、$s \to b = 2$、$b \to a = -3$,算法报 $\mathrm{dist}[a] = 1$,真实最短是 $s \to b \to a = -1$
    - 因为负权边会让松弛操作陷入无限循环,算法无法终止
    - 其实 Dijkstra 处理负权也没问题,只是 Bellman-Ford 更快而已
    - 因为负权边违反流量守恒,图会变得不可解
  answer_index: 0
  explanation: |
    Dijkstra 每一轮都把「当前距离最小的未确定顶点」收入已确定集合,理由是:经由其他顶点绕路只会更长(所有边非负),
    所以它不可能再被改进。负权边恰好推翻这个理由——绕远路可能更短。
    反例中算法第 1 轮确定 $\mathrm{dist}[a] = 1$ 并「封死」,但 $s \to b \to a = 2 + (-3) = -1 < 1$。
    负权图应改用 Bellman-Ford($O(VE)$,可判负环)或 SPFA。选项 B 说的「死循环」不是真正原因
    (负权下 Dijkstra 仍会终止,只是结果错误;只有负环才会让 Bellman-Ford 检测到问题);
    选项 C 与反例直接矛盾;选项 D 把图论最短路与网络流的概念混为一谈。
  tags: [Dijkstra, 负权边, Bellman-Ford]

- id: modeler_shortest_q2
  unit_id: modeler_shortest
  role: modeler
  category: 图论
  difficulty: beginner
  question: |
    无向图,边权:$s\!-\!a = 1$、$a\!-\!t = 3$、$s\!-\!b = 4$、$b\!-\!t = 1$、$a\!-\!b = 1$。用 Dijkstra 求 $s$ 到 $t$ 的最短距离与路径:
  options:
    - 距离 3,路径 $s \to a \to b \to t$(长度 $1+1+1$)
    - 距离 4,路径 $s \to a \to t$(长度 $1+3$)
    - 距离 5,路径 $s \to b \to t$(长度 $4+1$)
    - 距离 2,路径 $s \to a \to b$(长度 $1+1$)
  answer_index: 0
  explanation: |
    逐步执行:出队 $s$(0),松弛 $a \to 1$、$b \to 4$;出队 $a$(1),松弛 $t \to 1+3 = 4$、$b \to 1+1 = 2$(改进!);
    出队 $b$(2),松弛 $t \to 2+1 = 3$(改进);出队 $t$(3),结束。最短距离 3,路径 $s \to a \to b \to t$。
    两个易错点:①选项 B 把 $t$ 在第 2 轮被松弛到的 4 当成了最终答案——**已松弛的顶点仍可被继续改进**,
    只有「已出队确定」的才封死;②选项 C 只走了直达边,忽略了绕行可能更短;③选项 D 漏掉了最后一段 $b \to t$。
    论文输出永远是「距离 + 路径」,记得维护前驱数组反向回溯。
  tags: [Dijkstra, 松弛操作, 最短路径]

- id: modeler_shortest_q3
  unit_id: modeler_shortest
  role: modeler
  category: 图论
  difficulty: beginner
  question: |
    某城市 $A, B, C$ 三个站点:公交 1 号线 $A \to B$ 行驶 10 分钟,2 号线 $B \to C$ 行驶 8 分钟,在 $B$ 站换乘需等待 5 分钟。
    求 $A$ 到 $C$ 的最短总耗时,正确做法与结果是:
  options:
    - 用拆点建模:$A \to B_{in}$(10)、$B_{in} \to B_{out}$(5)、$B_{out} \to C$(8),总耗时 $10+5+8 = 23$ 分钟
    - 直接连边相加:$10 + 8 = 18$ 分钟
    - 把等待时间加两遍:$10 + 5 + 8 + 5 = 28$ 分钟
    - 只算后半程:$8 + 5 = 13$ 分钟
  answer_index: 0
  explanation: |
    「换乘费」使路径代价不再是边权的简单相加——两次经过同一站点(刚下车 vs 可上车)代价不同,违背了最短路的最优性原理。
    解决办法是**拆点**:把中转站 $B$ 拆成 $B_{in}$(下车)与 $B_{out}$(上车),用一条权为 5 的内部边表示换乘等待,
    再跑一次标准 Dijkstra:$A \to B_{in} \to B_{out} \to C = 10+5+8 = 23$ 分钟。
    选项 B 是裸图建模的典型低估(漏掉等待);选项 C 把等待在上下车两端各算了一次;
    选项 D 漏掉了前半程 10 分钟。时间窗、红绿灯等待、中转次数限制,都是同一拆点套路(参见网络流单元的点容量拆点)。
  tags: [最短路径, 拆点建模, 换乘等待]

# ============ 13. modeler_network 网络流与最大流 · 图论 · intermediate ============
- id: modeler_network_q1
  unit_id: modeler_network
  role: modeler
  category: 图论
  difficulty: intermediate
  question: |
    流网络(有向):$s \to a = 3$、$s \to b = 2$、$a \to b = 1$、$a \to t = 2$、$b \to t = 3$。求最大流值与最小割容量:
  options:
    - 最大流 $= 5$;最小割取 $S = \{s\}$,割边 $s \to a$、$s \to b$,容量 $3+2 = 5$
    - 最大流 $= 4$;最小割容量 $= 4$
    - 最大流 $= 5$;最小割容量 $= 6$
    - 最大流 $= 2$;最小割容量 $= 2$
  answer_index: 0
  explanation: |
    增广过程:①$s \to a \to t$,瓶颈 $\min(3, 2) = 2$,流值 2;②$s \to b \to t$,瓶颈 $\min(2, 3) = 2$,流值 4;
    ③$s \to a \to b \to t$,此时 $s \to a$ 剩 1、$a \to b$ 容量 1、$b \to t$ 剩 1,瓶颈 1,流值 5。
    此后 $s$ 的两条出边全满,剩余网络中 $s$ 可达集 $S = \{s\}$,割边 $s \to a$、$s \to b$ 容量和为 $3+2 = 5$ = 流值,
    最大流最小割定理成立。干扰项:选项 B 漏了第 3 条增广路(只增广两条「直达」路径就停了);
    选项 C 把 $a \to t$ 也当成了割边(它属于 $S$ 内部,割容量只算从 $S$ 跨到 $T$ 的边);
    选项 D 只增广了一条路径就放弃。判断最优看的是「剩余网络中不存在 $s \to t$ 路径」,不是「直观上没有路」。
  tags: [网络流, 最大流, 最小割, Ford-Fulkerson]

- id: modeler_network_q2
  unit_id: modeler_network
  role: modeler
  category: 图论
  difficulty: intermediate
  question: |
    为什么说反向边给了 Ford-Fulkerson「反悔」的能力?以下说法**正确**的是:
  options:
    - 反向边的剩余容量 $c_f(v,u) = f(u,v)$ 允许后续增广「退回」早先推送的流,相当于撤销局部决策;没有反向边的贪心会停在次优解
    - 反向边用来表示双向道路,单行道网络(如物流专线)不需要反向边
    - 反向边的容量等于正向边的容量,增广时两个方向可以同时推送
    - 反向边只是为了编程方便,删掉不影响正确性
  answer_index: 0
  explanation: |
    反向边是「撤销通道」:沿 $u \to v$ 推了 $f$ 的流后,$v \to u$ 获得 $f$ 的剩余容量,后续增广路径可以沿它
    「退回」先前的流,相当于反悔当时的局部决策。经典反例(无反向边会卡在流值 1):
    $s \to a = 1$、$s \to b = 1$、$a \to b = 1$、$a \to t = 1$、$b \to t = 1$。若第一条增广走 $s \to a \to b \to t$,
    则 $a \to t$ 与 $s \to b$ 都被堵死,没有反向边算法停在流值 1;有反向边时,增广 $s \to b \to a \to t$
    沿 $b \to a$ 退回 $a \to b$ 上的 1 个单位,流值到达最优的 2。
    选项 B 混淆了「图的方向」与「流的撤销方向」(单行道网络同样需要反向边);选项 C 把剩余容量与容量混为一谈
    (反向剩余容量来自已推流量,不是原边容量);选项 D 恰好丢掉了 FF 正确性的根基——「局部贪心 + 全局反悔」。
  tags: [网络流, 反向边, 剩余网络, 增广路]

- id: modeler_network_q3
  unit_id: modeler_network
  role: modeler
  category: 图论
  difficulty: intermediate
  question: |
    关于最大流的积分性,下列说法**正确**的是:
  options:
    - 只要所有容量都是整数,FF/EK 每次增广的瓶颈都是整数,最终必存在整数最优流;因此单位容量网络上最大流值 = 最大匹配数
    - 整数容量下也可能得到分数最优流,需要专门算法保证整数性
    - 积分性只对二分图网络成立
    - 只有容量全为 1 时最优流才是整数流
  answer_index: 0
  explanation: |
    积分性定理:容量全为整数时,FF/EK 的每次增广瓶颈 $b$ 都是整数,流量始终是整数,
    最终流必然是整数流(且整数线性规划存在整数最优解)。这使「二分图匹配转最大流」成立:
    所有容量为 1 的网络中,「工人—任务」边上流 1 的边恰好一一对应匹配对,最大流值 = 最大匹配数,
    不会出现「0.5 个人做 0.5 项任务」的荒谬解。选项 B 否定了积分性定理;
    选项 C 把适用范围缩小(积分性对任意整数容量网络成立,二分图只是其应用);
    选项 D 是「容量 1 ⇒ 整数流」的逆命题版本,搞错了方向(容量 5、7 的整数网络同样只有整数最优流)。
  tags: [网络流, 积分性定理, 二分图匹配]

# ============ 14. modeler_mst 最小生成树与TSP · 图论 · intermediate ============
- id: modeler_mst_q1
  unit_id: modeler_mst
  role: modeler
  category: 图论
  difficulty: intermediate
  question: |
    4 个顶点的无向图,边权:$1\!-\!2 = 2$、$1\!-\!3 = 3$、$1\!-\!4 = 1$、$2\!-\!3 = 4$、$2\!-\!4 = 5$、$3\!-\!4 = 6$。
    用 Kruskal 求最小生成树的边集与总权:
  options:
    - 边集 $\{1\!-\!4,\ 1\!-\!2,\ 1\!-\!3\}$,总权 $1+2+3 = 6$
    - 边集 $\{1\!-\!4,\ 1\!-\!2,\ 2\!-\!3\}$,总权 $1+2+4 = 7$
    - 边集 $\{1\!-\!2,\ 1\!-\!3,\ 2\!-\!4\}$,总权 $2+3+5 = 10$
    - 边集 $\{1\!-\!4,\ 1\!-\!2,\ 1\!-\!3,\ 2\!-\!3\}$,总权 $1+2+3+4 = 10$
  answer_index: 0
  explanation: |
    边按权排序:$(1,4)=1$、$(1,2)=2$、$(1,3)=3$、$(2,3)=4$、$(2,4)=5$、$(3,4)=6$。
    依次加入 $(1,4)$、$(1,2)$;考察 $(1,3)$ 时顶点 3 尚未连通,加入;到 $(2,3)$ 时两端已通过 1 连通,加入必成环,跳过。
    共 $4-1 = 3$ 条边,MST 总权 $1+2+3 = 6$(以顶点 1 为中心的星形树)。
    选项 B 在 $\{1,2,4\}$ 与 $\{3\}$ 之间选了权 4 的 $(2,3)$ 而漏了权 3 的 $(1,3)$——贪心要求横跨割取**最小**边;
    选项 C 是生成树但不是最小的(权 10);选项 D 加入了第 4 条边——树只有 $n-1$ 条边,加 $(2,3)$ 会成环,忘了停止条件。
  tags: [最小生成树, Kruskal, 并查集]

- id: modeler_mst_q2
  unit_id: modeler_mst
  role: modeler
  category: 图论
  difficulty: intermediate
  question: |
    下列说法**正确**的是:
  options:
    - 若图中所有边权互不相同,则最小生成树唯一;存在等权边时 MST 可能不唯一,但最小总权值唯一
    - 边权互不相同时 MST 也可能不唯一
    - MST 是否唯一只与顶点数有关,与边权无关
    - 只要存在等权边,MST 一定不唯一
  answer_index: 0
  explanation: |
    边权互异 ⇒ MST 唯一。反证:若有两棵不同 MST $T_1, T_2$,取只属于 $T_1$ 的最小权边 $e$ 加入 $T_2$ 形成环,
    环上必有只属于 $T_2$ 的边 $f$;由环性质与最小性讨论可得 $w(e) \le w(f)$ 且 $w(f) \le w(e)$,即 $w(e) = w(f)$,
    与「互不相同」矛盾。存在等权边时 MST **可能**不唯一(如三边等权的三角形),但只是可能——
    选项 D 把「可能」说成「一定」;而且无论 MST 是否唯一,**最小总权值总是唯一的**,
    比较不同算法/不同排序的结果时只比总权,不比边集(否则会把「MST 不唯一」误判为算法错误)。
    选项 B 与上述证明矛盾;选项 C 忽略了边权结构这个决定因素。
  tags: [最小生成树, 唯一性, 环性质]

- id: modeler_mst_q3
  unit_id: modeler_mst
  role: modeler
  category: 图论
  difficulty: intermediate
  question: |
    关于负权边对两个图论问题的影响,下列说法**正确**的是:
  options:
    - 负权边对 MST 无害(割性质与边权符号无关,负权边只会让树更便宜);却会破坏 Dijkstra(贪心前提「已确定距离不再变小」被绕路推翻)
    - 负权边对 MST 和 Dijkstra 都无害
    - 负权边会使 MST 不存在
    - 负权边对两者都有害,求 MST 也必须改用 Bellman-Ford
  answer_index: 0
  explanation: |
    MST 的贪心由**割性质**支撑:横跨任意割的最小权边必属某棵 MST——该性质与边权正负无关,
    负权边只会让「最小」更突出,树反而更便宜,不存在「绕路」问题(每条边至多被考察一次)。
    最短路则是「沿路径累加」,代价对顺序敏感:负权边允许绕远路把已确定的距离改小,
    颠覆 Dijkstra「一旦确定就封死」的前提,所以负权最短路要用 Bellman-Ford(反复松弛 $n-1$ 轮,可判负环)。
    选项 B 忽视了 Dijkstra 的反例($s \to a=1,\ s \to b=2,\ b \to a=-3$);
    选项 C 把「更便宜」误解为「无意义」——只要图连通,生成树(及最小生成树)恒存在;
    选项 D 把两个问题的敏感性混为一谈,Bellman-Ford 解决的是最短路问题,与 MST 无关。
  tags: [最小生成树, 负权边, 割性质, Dijkstra]

# ============ 15. modeler_ode_01 常微分方程建模 · 微分方程 · intermediate ============
- id: modeler_ode_01_q1
  unit_id: modeler_ode_01
  role: modeler
  category: 微分方程
  difficulty: intermediate
  question: |
    一维自治系统 $\dot{x} = f(x)$ 的平衡点 $x^*$ 满足 $f(x^*) = 0$ 且 $f'(x^*) = 0$。此时能否断定 $x^*$ 的稳定性?
  options:
    - 不能。一阶导数信息不足,需看高阶项:$\dot{x} = x^3$ 与 $\dot{x} = -x^3$ 在 $x^*=0$ 处 $f'$ 都为 0,前者不稳定、后者渐近稳定
    - 能。$f'(x^*) = 0$ 说明既不增长也不衰减,平衡点必稳定
    - 能。导数为 0 意味着该点没有恢复力,必不稳定
    - 不能,因为 $f'(x^*) = 0$ 说明 $x^*$ 根本不是平衡点
  answer_index: 0
  explanation: |
    线性化判据在 $f'(x^*) \ne 0$ 时有效:$f'(x^*)<0$ 渐近稳定、$f'(x^*)>0$ 不稳定;但 $f'(x^*) = 0$ 时线性化「退化了」,
    必须看高阶项。反例:$\dot{x} = x^3$,当 $x>0$ 时 $\dot{x}>0$(解单调增大)、$x<0$ 时 $\dot{x}<0$(解单调减小),$x^*=0$ 半稳定
    (不稳定);$\dot{x} = -x^3$ 则 $x^*=0$ 渐近稳定。两者一阶导数完全相同,结论却相反。
    选项 B/C 把「导数为 0」直接等同于稳定/不稳定,都错;选项 D 把平衡点的定义($f(x^*)=0$)与稳定性判据混为一谈。
    二维系统中对应的情形是特征值纯虚——线性化失效,需找守恒量(如 Lotka-Volterra 的 $H$)或李雅普诺夫函数。
  tags: [常微分方程, 平衡点稳定性, 线性化]

- id: modeler_ode_01_q2
  unit_id: modeler_ode_01
  role: modeler
  category: 微分方程
  difficulty: intermediate
  question: |
    求 $\dot{x} = x(2 - x)$ 的全部平衡点,并判断其稳定性:
  options:
    - $x^* = 0$ 不稳定($f'(0) = 2 > 0$),$x^* = 2$ 渐近稳定($f'(2) = -2 < 0$)
    - $x^* = 0$ 渐近稳定,$x^* = 2$ 不稳定
    - 两个平衡点都稳定
    - 两个平衡点都不稳定
  answer_index: 0
  explanation: |
    平衡点:$x(2-x) = 0 \Rightarrow x^* = 0$ 与 $x^* = 2$。$f'(x) = 2 - 2x$:
    $f'(0) = 2 > 0$,任何正的小扰动都会被 $x(2-x) > 0$ 放大(灭绝状态被微扰打破),不稳定;
    $f'(2) = -2 < 0$,偏离 2 的扰动会被拉回,渐近稳定。
    这正是 Logistic 方程 $r=2$、$K=2$ 的结论:任何正初值都收敛到环境容量 2。
    选项 B 把符号判反(把 $f'(x^*)$ 的符号与稳定性方向弄反是最常见的错误);
    选项 C 忘了 0 处的不稳定性(灭绝态是「不稳定平衡」的经典例子);选项 D 则两个都判错。
    稳定性看的是 $f'(x^*)$ 的**符号**,不是平衡点本身。
  tags: [常微分方程, Logistic方程, 平衡点]

- id: modeler_ode_01_q3
  unit_id: modeler_ode_01
  role: modeler
  category: 微分方程
  difficulty: intermediate
  question: |
    某地区人口上限 $K = 1000$ 万,2010 年人口 $N_0 = 100$ 万,固有增长率 $r = 0.5$/年,服从 Logistic 模型。
    人口达到 800 万的时间约是:
  options:
    - $2\ln 36 \approx 7.17$ 年($800 = \dfrac{1000}{1+9e^{-0.5t}} \Rightarrow e^{-0.5t} = \dfrac{1}{36}$)
    - $\ln 36 \approx 3.58$ 年
    - $2\ln 4 \approx 2.77$ 年
    - $2\ln 9 \approx 4.39$ 年
  answer_index: 0
  explanation: |
    代入 Logistic 解析解 $N(t) = \dfrac{1000}{1 + 9e^{-0.5t}}$:
    $$800 = \frac{1000}{1+9e^{-0.5t}} \Rightarrow 1 + 9e^{-0.5t} = 1.25 \Rightarrow e^{-0.5t} = \frac{0.25}{9} = \frac{1}{36} \Rightarrow t = 2\ln 36 \approx 7.17\ \text{年}$$
    干扰项:选项 B 解出 $\ln 36$ 后忘了除以系数 0.5(即忘了乘 2)——指数里的系数处理漏掉是最常见的手算错误;
    选项 C 把 $1+9e^{-0.5t} = 1.25$ 中的 9 弄丢,解成 $e^{-0.5t} = 0.25$;
    选项 D 是「增长速度最快时刻」$t = 2\ln 9 \approx 4.39$ 年(拐点 $N = K/2 = 500$ 万)——把两个问题搞混了。
    记结论:拐点在 $N = K/2$,不必对 $N(t)$ 求二阶导硬算。
  tags: [常微分方程, Logistic模型, 解析解]

# ============ 16. modeler_pde_01 偏微分方程与有限差分 · 微分方程 · advanced ============
- id: modeler_pde_01_q1
  unit_id: modeler_pde_01
  role: modeler
  category: 微分方程
  difficulty: advanced
  question: |
    一维热方程 $u_t = \alpha u_{xx}$ 的显式格式(FTCS),取 $s = \dfrac{\alpha \Delta t}{\Delta x^2}$。
    关于三种取值的数值行为,下列说法**正确**的是:
  options:
    - $s = 0.25$ 稳定,$s = 0.5$ 临界稳定,$s = 0.6$ 发散——von Neumann 分析给出稳定条件 $s \le 1/2$
    - $s = 0.25$ 与 $s = 0.6$ 都稳定,只是后者精度略差
    - $s = 0.6$ 只是精度下降,不会发散
    - $s = 0.25$ 也不稳定,必须 $s \le 0.1$ 才安全
  answer_index: 0
  explanation: |
    von Neumann 分析:设模态 $u_i^n = g^n e^{ikx_i}$,代入显式格式得增长因子
    $g = 1 - 4s\sin^2\dfrac{k\Delta x}{2}$。稳定要求所有波数 $|g| \le 1$,最坏情形 $\sin^2 = 1$ 给出
    $-1 \le 1 - 4s \Rightarrow s \le \dfrac{1}{2}$。
    $s = 0.25$:一切模态 $|g| < 1$,稳定衰减;$s = 0.5$:高频模态 $|g| = 1$,误差不增不减,临界;
    $s = 0.6$:高频模态 $|g| > 1$,解按 $(-1)^n$ 逐层交替振荡并指数发散(画出来像锯齿噪音)。
    选项 B/C 把「发散」误判为「精度差」——发散是灾难性的,不是精度问题;选项 D 的 $s \le 0.1$ 没有依据。
    实际计算建议取 $s = 0.2 \sim 0.4$,留出安全裕度;跑显式程序前先手算 $s$ 并确认 $\le 1/2$。
  tags: [偏微分方程, 显式格式, von Neumann稳定性, CFL条件]

- id: modeler_pde_01_q2
  unit_id: modeler_pde_01
  role: modeler
  category: 微分方程
  difficulty: advanced
  question: |
    某材料热扩散率 $\alpha = 5\times10^{-5}\ \text{m}^2/\text{s}$,空间步长取 $\Delta x = 0.02\ \text{m}$。
    用显式格式模拟一维热传导,时间步长最大可取多少?
  options:
    - $4\ \text{s}$:$\Delta t_{\max} = \dfrac{\Delta x^2}{2\alpha} = \dfrac{(0.02)^2}{2\times5\times10^{-5}}$
    - $8\ \text{s}$:$\Delta t_{\max} = \dfrac{\Delta x^2}{\alpha}$
    - $200\ \text{s}$:$\Delta t_{\max} = \dfrac{\Delta x}{2\alpha}$
    - $0.04\ \text{s}$:把 $\Delta x$ 误作 $0.002\ \text{m}$ 计算
  answer_index: 0
  explanation: |
    由稳定性条件 $s = \dfrac{\alpha\Delta t}{\Delta x^2} \le \dfrac{1}{2}$:
    $$\Delta t_{\max} = \frac{\Delta x^2}{2\alpha} = \frac{4\times10^{-4}}{10^{-4}} = 4\ \text{s}$$
    取 4 s 时 $s = 0.5$ 处于临界,稳妥做法取 2 s($s = 0.25$)。
    干扰项:选项 B 忘了分母里的 2(稳定条件记成 $s \le 1$);选项 C 把 $\Delta x^2$ 误用成 $\Delta x$
    (量纲错:秒与米² 必须配平,$\alpha$ 的单位是 $\text{m}^2/\text{s}$);选项 D 是米/厘米单位混乱
    (0.02 m = 2 cm 误作 2 mm = 0.002 m)的典型翻车。
    另注意:空间步长减半,允许的 $\Delta t$ 缩小到 $1/4$——加密网格时必须同步收紧时间步长,否则反而发散。
  tags: [偏微分方程, 显式格式, 稳定性条件, 时间步长]

- id: modeler_pde_01_q3
  unit_id: modeler_pde_01
  role: modeler
  category: 微分方程
  difficulty: advanced
  question: |
    二维热方程显式格式,取 $\alpha = 0.1$、$\Delta x = \Delta y = 0.1$。时间步长上限是多少?
    若退化为同参数的一维问题($\Delta x = 0.1$),上限又是多少?
  options:
    - 二维 $\Delta t \le \dfrac{h^2}{4\alpha} = 0.025$;一维 $\Delta t \le \dfrac{h^2}{2\alpha} = 0.05$——二维上限恰好是一维的一半
    - 二维 $\Delta t \le 0.05$;一维 $\Delta t \le 0.025$
    - 二维与一维上限相同,都是 $0.05$
    - 二维 $\Delta t \le 0.0025$;一维 $\Delta t \le 0.005$
  answer_index: 0
  explanation: |
    二维稳定性条件为 $s = \alpha\Delta t\left(\dfrac{1}{\Delta x^2} + \dfrac{1}{\Delta y^2}\right) \le \dfrac{1}{2}$;
    $\Delta x = \Delta y = h$ 时 $\Delta t \le \dfrac{h^2}{4\alpha} = \dfrac{0.01}{0.4} = 0.025$。
    一维对应 $\Delta t \le \dfrac{h^2}{2\alpha} = \dfrac{0.01}{0.2} = 0.05$,恰好是二维的两倍——
    **维数越高,显式格式的时间步长限制越严**,这是「维数灾难」在数值求解中的体现。
    选项 B 把一维与二维对调;选项 C 忽略了第二维的贡献(误以为两个方向共享一个时间步);
    选项 D 是 $h^2 = 0.01$ 计算错位(把 $0.1^2$ 算成 0.001)。
    空间步长加密时该限制按平方收紧,显式格式对细网格成本暴涨,工程上此时通常转向隐式格式或直接解稳态方程。
  tags: [偏微分方程, 二维扩散, 显式格式, 稳定性]

# ============ 17. modeler_queue_01 排队论建模 · 综合 · intermediate ============
- id: modeler_queue_01_q1
  unit_id: modeler_queue_01
  role: modeler
  category: 综合
  difficulty: intermediate
  question: |
    某 M/M/1 排队系统,到达率 $\lambda = 12$ 人/小时,服务率 $\mu = 10$ 人/小时。能否用公式 $L = \dfrac{\rho}{1-\rho}$ 计算平均人数?
  options:
    - 不能。$\rho = 12/10 = 1.2 > 1$,系统不稳定,队列长度随时间线性增长,不存在稳态分布,一切稳态公式失效
    - 能。公式对任意 $\lambda$、$\mu$ 都成立,结果是负的平均人数
    - 能。取 $|\rho| = 1.2$ 代入即可
    - 不能。因为此时 Little 公式 $L = \lambda W$ 不成立
  answer_index: 0
  explanation: |
    M/M/1 稳态分布 $p_n = (1-\rho)\rho^n$ 的归一化要求 $\rho = \lambda/\mu < 1$;
    $\rho = 1.2 > 1$ 时到达快于服务,队列无限增长,$\sum \rho^n$ 发散,稳态根本不存在,
    $L = \rho/(1-\rho)$ 会给出负值,没有意义。正确做法:增加服务台(如改成 M/M/2)或提高 $\mu$,把服务强度压到 1 以下再计算。
    选项 B/C 属于「照套公式不看前提」——**第一步永远是检查 $\rho < 1$**;
    选项 D 的诊断有偏差:Little 公式失效是因为**系统没有稳态**(它的前提之一是稳态、顾客守恒),而不是公式本身的问题。
    单位也要先统一(λ 用小时、μ 用分钟会差 60 倍)。
  tags: [排队论, M/M/1, 服务强度, 稳态条件]

- id: modeler_queue_01_q2
  unit_id: modeler_queue_01
  role: modeler
  category: 综合
  difficulty: intermediate
  question: |
    某 M/M/1 系统:顾客到达率 $\lambda = 30$ 人/小时,服务率 $\mu = 40$ 人/小时。求 $\rho$、$p_0$、$L$ 与平均逗留时间 $W$:
  options:
    - $\rho = 0.75$,$p_0 = 0.25$,$L = 3$ 人,$W = 6$ 分钟
    - $\rho = 0.75$,$p_0 = 0.25$,$L = 3.2$ 人,$W = 9.6$ 分钟
    - $\rho = 1.33$,$p_0 = -0.33$,$L = -4$ 人,$W = -8$ 分钟
    - $\rho = 0.75$,$p_0 = 0.25$,$L = 3$ 人,$W = 4.5$ 分钟
  answer_index: 0
  explanation: |
    $\rho = \dfrac{30}{40} = 0.75 < 1$,系统稳定。$p_0 = 1 - \rho = 0.25$;
    $L = \dfrac{\rho}{1-\rho} = \dfrac{0.75}{0.25} = 3$ 人;
    $W = \dfrac{1}{\mu - \lambda} = \dfrac{1}{10}$ 小时 = 6 分钟(用 Little 公式验证:$W = L/\lambda = 3/30 = 0.1$ h ✓)。
    干扰项:选项 B 把 $L_q = \rho^2/(1-\rho) = 2.25$… 实为把 $L$ 记成了 $L_q$、$W$ 记成了 $W_q$ 的数值
    (混用下标是排队题最常见的失分点,正确自查式:$L = L_q + \rho$、$W = W_q + 1/\mu$);
    选项 C 把 $\rho$ 除反($40/30$),得到负概率的荒谬结果却没停下来检查;
    选项 D 把 $W$ 当成了 $W_q = \rho/(\mu-\lambda) = 4.5$ 分钟。另注意 $W = 6$ 分钟是**平均**值,
    等待时间服从指数分布,约 37% 的顾客会超过均值,容量设计要用 $P(N \ge k) = \rho^k$ 而不是均值。
  tags: [排队论, M/M/1, Little公式, 性能指标]

- id: modeler_queue_01_q3
  unit_id: modeler_queue_01
  role: modeler
  category: 综合
  difficulty: intermediate
  question: |
    某 M/M/1 系统服务强度 $\rho = 0.75$。「没有人在排队」(队列为空,即系统中人数为 0 或 1)的概率是:
  options:
    - $P(N \le 1) = p_0 + p_1 = (1-\rho) + (1-\rho)\rho = 1 - \rho^2 = 0.4375$
    - $P(\text{队列为空}) = p_0 = 1 - \rho = 0.25$
    - $P(\text{队列为空}) = \rho^2 = 0.5625$
    - $P(\text{队列为空}) = p_1 = \rho(1-\rho) = 0.1875$
  answer_index: 0
  explanation: |
    「队列为空」≠「系统空闲」:系统中 0 人(系统空)或 1 人(正在服务、无人排队)都算无人排队,
    故 $P(N \le 1) = p_0 + p_1 = (1-\rho) + (1-\rho)\rho = 1 - \rho^2 = 1 - 0.5625 = 0.4375$。
    选项 B 是本题的头号陷阱:把「系统空闲概率」$p_0 = 1-\rho$ 当成了答案——「空闲」要求**一个顾客都没有**,
    比「无人排队」更严格;选项 C 把几何分布的尾概率 $P(N \ge 2)$ 与 $P(N \le 1)$ 搞反($P(N\ge2) = \rho^2 = 0.5625$);
    选项 D 算的是「恰好 1 人在系统中」的概率,漏掉了 0 人的情形。这类「文字 → 事件」的翻译题,
    建议先写出 $P(N \le 1)$ 再套几何分布,避免直接套公式。
  tags: [排队论, 几何分布, 队列空概率]

# ============ 18. modeler_game_01 博弈论基础 · 综合 · intermediate ============
- id: modeler_game_01_q1
  unit_id: modeler_game_01
  role: modeler
  category: 综合
  difficulty: intermediate
  question: |
    关于 Nash 均衡(NE)与帕累托最优的关系,下列说法**正确**的是:
  options:
    - NE 不一定是帕累托最优:囚徒困境的唯一 NE(坦白,坦白)收益 $(-5,-5)$,被非均衡结果(沉默,沉默)的 $(-1,-1)$ 帕累托占优
    - NE 一定是帕累托最优,否则双方会继续偏离
    - NE 一定不是帕累托最优,均衡与效率必然冲突
    - 囚徒困境中(沉默,沉默)也是 NE,因为双方都不愿偏离它
  answer_index: 0
  explanation: |
    NE 是**稳定性**概念(无人愿意单方面偏离),不是**福利**概念。囚徒困境中(坦白,坦白)是唯一 NE:
    任何一方单方面沉默都会从 $-5$ 恶化到 $-10$;而(沉默,沉默)虽然帕累托更优(两人都从 $-5$ 改善到 $-1$),
    但**任何一方单方面坦白都能从 $-1$ 改善到 $0$**——所以它不是稳定状态,不是 NE。
    选项 B 误以为均衡自动最优;选项 C 走向另一个极端(如古诺均衡虽然不如合谋,但也不是「必然最差」);
    选项 D 忽略了(沉默,沉默)中的单方背叛动机——这正是「个体理性滑向集体双输」的机制。
    破解之道(机制设计):重复博弈的惩罚、外部制度、合同约束,让个体理性与集体理性重合。
  tags: [博弈论, Nash均衡, 帕累托最优, 囚徒困境]

- id: modeler_game_01_q2
  unit_id: modeler_game_01
  role: modeler
  category: 综合
  difficulty: intermediate
  question: |
    智猪博弈:大猪、小猪各可选「按按钮」或「等待」。按按钮成本 2;按钮一按 10 单位食物落下,大猪先到吃 9、小猪吃 1;
    小猪先到吃 4、大猪吃 6。收益矩阵(行:大猪,列:小猪):
    $$\begin{bmatrix} (5, 1) & (4, 4) \\ (9, -1) & (0, 0) \end{bmatrix}$$
    用划线法求纯策略 Nash 均衡:
  options:
    - (按, 等待),收益 $(4, 4)$:小猪「按」时大猪最优是等待,小猪「等待」时大猪最优是按;大猪「按」与「等待」时小猪最优都是等待——双圈在(按, 等待)
    - (等待, 按),收益 $(9, -1)$:大猪搭便车最优
    - (按, 按),收益 $(5, 1)$:双方都出力
    - (等待, 等待),收益 $(0, 0)$:双方都不动
  answer_index: 0
  explanation: |
    划线法必须**双方同时最优**:
    对行玩家(大猪)逐列圈最优——小猪「按」时:大猪按得 5、等待得 9,圈等待;小猪「等待」时:大猪按得 4、等待得 0,圈按。
    对列玩家(小猪)逐行圈最优——大猪「按」时:小猪按得 1、等待得 4,圈等待;大猪「等待」时:小猪按得 $-1$、等待得 0,圈等待。
    双圈格子:(按, 等待),收益 $(4, 4)$——**大猪按、小猪等待**是唯一 NE。
    小猪「搭便车」看似占便宜,实则是均衡:大猪不按则两人都没得吃 $(0,0)$,所以大猪只能按。
    选项 B 只划了大猪一边(单边最优不是 NE);选项 C/D 都存在一方单方面偏离的动机。
    这正是「搭便车」问题的经典寓言:能力大者多出力,在均衡意义上是「不得不」。
  tags: [博弈论, 划线法, 纯策略Nash均衡, 智猪博弈]

- id: modeler_game_01_q3
  unit_id: modeler_game_01
  role: modeler
  category: 综合
  difficulty: intermediate
  question: |
    古诺双寡头:市场需求 $P = 40 - Q$(反需求函数),两家企业边际成本均为 $c = 10$,同时定产量。
    求均衡产量、均衡价格与每家利润:
  options:
    - $q_1^* = q_2^* = \dfrac{a-c}{3b} = 10$;$P^* = \dfrac{a+2c}{3} = 20$;$\pi_i^* = (20-10)\times10 = 100$
    - $q_1^* = q_2^* = 15$;$P^* = 25$;$\pi_i^* = 225$
    - $q_1^* = q_2^* = 7.5$;$P^* = 25$;$\pi_i^* = 112.5$
    - $q_1^* = q_2^* = 20$;$P^* = 0$;$\pi_i^* = 0$
  answer_index: 0
  explanation: |
    利润 $\pi_i = (40 - q_1 - q_2 - 10)q_i$,一阶条件 $\dfrac{\partial \pi_1}{\partial q_1} = 30 - 2q_1 - q_2 = 0$
    得反应函数 $q_i = \dfrac{30 - q_j}{2}$,对称解 $q_1^* = q_2^* = 10$;
    总产量 20,价格 $P^* = 40 - 20 = 20$,每家利润 $(20-10)\times10 = 100$。
    对照三个参照系(线性需求下):垄断 $Q = 15$、$P = 25$、总利润 225——选项 B 把**垄断**解当成了古诺解;
    合谋卡特尔每家产量 $\dfrac{a-c}{4b} = 7.5$、总利润 225——选项 C 把**卡特尔**解当成了古诺解;
    完全竞争 $P = c = 10$、$Q = 30$——选项 D 把每家产量取成总产量、价格为 0,走向了荒谬。
    古诺均衡恰在垄断与竞争之间:产量 20 介于 15 与 30 之间,这正是「寡头竞争降低价格、造福消费者」的量化体现。
  tags: [博弈论, 古诺模型, 反应函数, 市场结构对比]

# ============ 19. modeler_ca_01 元胞自动机建模 · 综合 · advanced ============
- id: modeler_ca_01_q1
  unit_id: modeler_ca_01
  role: modeler
  category: 综合
  difficulty: advanced
  question: |
    关于初等元胞自动机 Rule 90(输出串 $01011010_2$),下列说法**正确**的是:
  options:
    - Rule 90 的更新即「新值 = 左右邻居异或」;从单个 1 出发的演化图恰好是 Pascal 三角形按奇偶(模 2)染色的图形,呈 Sierpinski 分形
    - Rule 90 的演化结果是随机噪声,没有规律可言
    - Rule 90 的演化图对应 Pascal 三角形本身(不取模),每行是二项式系数的精确值
    - 该说法只对前两行成立,之后出现偏差
  answer_index: 0
  explanation: |
    Rule 90 的 8 位输出串 $01011010_2 = 64+16+8+2 = 90$,正是「新值 = 左 XOR 右」:
    左右都为 1 时输出 0,恰一个为 1 时输出 1。二项式系数的递推 $\binom{n}{k} = \binom{n-1}{k-1} + \binom{n-1}{k}$
    在**模 2**(不进位加法,即异或)下与 Rule 90 的更新完全相同,所以第 $t$ 行的格局就是二项式系数第 $t$ 行的奇偶分布:
    $1;\ 1,1;\ 1,0,1;\ 1,1,1,1;\ \dots$,正是 Pascal 三角形模 2,整体呈现 Sierpinski 分形。
    选项 B 把确定性规则的结果当成随机噪声;选项 C 漏了「模 2」——精确的 1,2,1 不是 0/1 状态;
    选项 D 与递推式矛盾(逐行恒成立,可归纳证明)。这个例子也是验证 CA 程序的好手段:
    把演化图与已知数学结构对照,证明「程序没有 bug」。
  tags: [元胞自动机, Rule 90, Wolfram编号, Sierpinski分形]

- id: modeler_ca_01_q2
  unit_id: modeler_ca_01
  role: modeler
  category: 综合
  difficulty: advanced
  question: |
    生命游戏中(Moore 邻域,「2-3 存活、3 出生」):一个**活**细胞有 4 个活邻居,一个**死**细胞有 3 个活邻居。
    下一时刻两者的状态分别是:
  options:
    - 活细胞死亡(过度拥挤),死细胞出生——「4 个邻居」超过存活上限 3,「恰好 3 个邻居」是唯一的出生条件
    - 活细胞继续存活,死细胞保持死亡——4 个邻居也算「有邻居」,3 个邻居不足以出生
    - 活细胞死亡,死细胞保持死亡——邻居太多都会死亡
    - 活细胞继续存活,死细胞出生——4 与 3 都在「不多不少」范围内
  answer_index: 0
  explanation: |
    生命游戏的两条规则要背到条件反射:
    **存活**:活细胞有 2 或 3 个活邻居 → 继续活;少于 2(孤独)或多于 3(拥挤)→ 死亡;
    **出生**:死细胞恰好 3 个活邻居 → 变活。
    因此活细胞 + 4 邻居 → **死亡**(过度拥挤);死细胞 + 3 邻居 → **出生**。
    选项 B 把存活条件放宽成「≥2」,并漏掉了出生规则;选项 C 只记了一半(拥挤死),忘记了「3 个邻居出生」;
    选项 D 把存活上限记成了 4、出生条件记成了 3 或 4。
    正是这条「不多不少」的规则让静物(方块)、振荡子(blinker,周期 2)、滑翔机(周期 4 且整体平移)得以涌现——
    极简局部规则产生复杂宏观行为,是 CA 建模吸引力的核心。
  tags: [元胞自动机, 生命游戏, 涌现]

- id: modeler_ca_01_q3
  unit_id: modeler_ca_01
  role: modeler
  category: 综合
  difficulty: advanced
  question: |
    NaSch 交通流模型取随机慢化概率 $p = 0$、最大速度 $v_{\max} = 3$。基本图($J = \min(v_{\max}\rho,\ 1-\rho)$)的临界密度与最大流量是:
  options:
    - $\rho^* = \dfrac{1}{v_{\max}+1} = \dfrac{1}{4}$;$J_{\max} = \dfrac{v_{\max}}{v_{\max}+1} = \dfrac{3}{4}$
    - $\rho^* = \dfrac{1}{3}$;$J_{\max} = \dfrac{2}{3}$
    - $\rho^* = \dfrac{3}{4}$;$J_{\max} = \dfrac{1}{4}$
    - $\rho^* = \dfrac{1}{2}$;$J_{\max} = \dfrac{1}{2}$
  answer_index: 0
  explanation: |
    $p=0$ 时基本图可手算:低密度自由流 $J = v_{\max}\rho = 3\rho$;高密度拥堵流 $J = 1-\rho$(前方每空一格前进一步)。
    两段交点:$3\rho = 1 - \rho \Rightarrow \rho^* = \dfrac{1}{4}$,$J_{\max} = \dfrac{3}{4}$。
    选项 B 是 $v_{\max}=2$ 时的结果(把别的参数的结果搬来);选项 C 把分子分母颠倒(密度 3/4 的「流量」1/4 违反直觉);
    选项 D 把分母里的 $v_{\max}+1$ 记成了 $v_{\max}-1$。
    注意两个结论:①速度上限越高,每辆车需要的空间越大,临界密度越低($v_{\max}=2$ 时 $\rho^*=1/3$,$v_{\max}=3$ 时降为 1/4),
    更早进入拥堵区;②$p > 0$ 时随机慢化使最大流量下降、拥堵在更低密度出现,手算不再可行,必须多次仿真取均值,
    并给出流量-密度图的误差棒——单次模拟的曲线只能当插图,不能当结论。
  tags: [元胞自动机, NaSch模型, 基本图, 交通流]

# ============ 20. modeler_model_combo 组合模型设计 · 综合 · advanced ============
- id: modeler_model_combo_q1
  unit_id: modeler_model_combo
  role: modeler
  category: 综合
  difficulty: advanced
  question: |
    把同一个模型在同一份数据上拟合两次,再取平均,预测误差会减半吗?
  options:
    - 不会。同模型同数据的两次拟合误差相关系数 $\rho \approx 1$,由方差公式 $\mathrm{Var} = \dfrac{\sigma^2 + \sigma^2 + 2\sigma^2}{4} = \sigma^2$,方差不变
    - 会。两次独立拟合取平均,方差降为 $\sigma^2/2$
    - 会。平均两次方差降为 $\sigma^2/4$,平均次数越多降得越多
    - 会。只要拟合次数足够多,方差可以任意接近 0
  answer_index: 0
  explanation: |
    组合收益来自基模型**有差异且误差不相关**:等权平均方差
    $\mathrm{Var} = \dfrac{\sigma_1^2 + \sigma_2^2 + 2\rho\sigma_1\sigma_2}{4}$,同模型同数据时 $\rho \approx 1$、$\sigma_1 = \sigma_2$,
    代入得 $\dfrac{\sigma^2+\sigma^2+2\sigma^2}{4} = \sigma^2$——**方差纹丝不动**。
    选项 B 把「误差独立」的前提套到了「同模型」上($\rho=0$ 公式);选项 C 是「平均两次减半、再平均再减半」的想当然;
    选项 D 更极端——同质模型平均一万次也还是同一个估计,方差不会趋零(趋零的前提是**独立**的估计,
    而 Bagging 之所以有效,正是因为自助采样使各基模型产生了差异)。
    竞赛中的第一步永远是检验基模型误差的相关性(散点图 + 相关系数),再决定「该不该组合、怎么组合」。
  tags: [组合模型, 误差相关性, Bias-Variance, 并联集成]

- id: modeler_model_combo_q2
  unit_id: modeler_model_combo
  role: modeler
  category: 综合
  difficulty: advanced
  question: |
    两个无偏预测模型,误差方差都是 $\sigma^2$。等权平均后的方差是(记两模型误差相关系数为 $\rho$):
  options:
    - $\rho = 0$ 时 $\dfrac{\sigma^2}{2}$;$\rho = 0.5$ 时 $\dfrac{3\sigma^2}{4}$
    - $\rho = 0$ 时 $\dfrac{\sigma^2}{4}$;$\rho = 0.5$ 时 $\dfrac{\sigma^2}{2}$
    - $\rho = 0$ 时 $\dfrac{\sigma^2}{2}$;$\rho = 0.5$ 时仍是 $\dfrac{\sigma^2}{2}$(相关性不影响平均方差)
    - $\rho = 0$ 时 $\sigma^2$;$\rho = 0.5$ 时 $1.25\sigma^2$(平均反而更差)
  answer_index: 0
  explanation: |
    等权平均方差公式 $\mathrm{Var} = \dfrac{\sigma_1^2 + \sigma_2^2 + 2\rho\sigma_1\sigma_2}{4}$,代入 $\sigma_1 = \sigma_2 = \sigma$:
    $$\rho = 0:\ \mathrm{Var} = \frac{\sigma^2 + \sigma^2}{4} = \frac{\sigma^2}{2}; \qquad \rho = 0.5:\ \mathrm{Var} = \frac{\sigma^2 + \sigma^2 + \sigma^2}{4} = \frac{3\sigma^2}{4}$$
    两个**独立**模型平均方差减半(标准差降为 $1/\sqrt{2}$);相关度 0.5 时只降 25%——相关性吃掉了组合收益的一半。
    选项 B 忘了分母是 4(把「方差减半」又减半了一次);选项 C 忽略了交叉项 $2\rho\sigma_1\sigma_2$ 的贡献;
    选项 D 把 $\rho=0$ 的公式也算错,且「平均更差」只会在 $\rho$ 很高且方差悬殊时出现(如两个方差相同的模型,
    $\rho < 1$ 时平均方差恒不大于 $\sigma^2$)。一般结论:相关性越低、方差越接近,组合收益越大。
  tags: [组合模型, 方差公式, 误差相关性, 等权平均]

- id: modeler_model_combo_q3
  unit_id: modeler_model_combo
  role: modeler
  category: 综合
  difficulty: advanced
  question: |
    三个误差互不相关的预测模型,误差方差分别为 $\sigma_1^2 = 4$、$\sigma_2^2 = 9$、$\sigma_3^2 = 16$。
    按逆方差加权的最优权重是:
  options:
    - $w = \left(\dfrac{36}{61},\ \dfrac{16}{61},\ \dfrac{9}{61}\right) \approx (0.590,\ 0.262,\ 0.148)$——方差越小的模型权重越大
    - $w = \left(\dfrac{9}{61},\ \dfrac{16}{61},\ \dfrac{36}{61}\right) \approx (0.148,\ 0.262,\ 0.590)$
    - $w \approx (0.461,\ 0.308,\ 0.231)$
    - $w = (1/3,\ 1/3,\ 1/3)$
  answer_index: 0
  explanation: |
    误差互不相关时,使组合方差最小的权重为 $w_i \propto \dfrac{1}{\sigma_i^2}$:
    $$\frac{1}{4} + \frac{1}{9} + \frac{1}{16} = \frac{36+16+9}{144} = \frac{61}{144}, \qquad w_1 = \frac{1/4}{61/144} = \frac{36}{61} \approx 0.590,\ w_2 = \frac{16}{61} \approx 0.262,\ w_3 = \frac{9}{61} \approx 0.148$$
    权重和为 1,方差最小的模型(σ²=4)拿到最大权重——「谁的误差小,就多听谁的」。
    选项 B 把「方差小权重大」的方向搞反;选项 C 是**按标准差倒数**加权($1/2, 1/3, 1/4$ 归一化)的结果,
    把最优公式里的方差换成了标准差;选项 D 是等权——等权只在各方差相等时才是最优。
    若误差相关,需用协方差矩阵的一般解 $w^* = \dfrac{\Sigma^{-1}\mathbf{1}}{\mathbf{1}^T\Sigma^{-1}\mathbf{1}}$;
    权重必须在基模型没见过的**留出集**上估计,否则会奖励过拟合的基模型。
  tags: [组合模型, 逆方差加权, 最优权重, Stacking]
