[project]
name = "math-model-agent"
version = "0.1.0"
description = "数学建模多智能体辅助系统"
requires-python = ">=3.11"
# 注：readme 字段已移除——backend/ 下无 README.md（在仓库根），poetry-core 构建元数据会因读不到而失败

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "fakeredis>=2.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "duckduckgo-search>=6.0.0",
    "sympy>=1.12",
    "cvxpy>=1.4.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "python-docx>=1.0.0",
    "pdfplumber>=0.10.0",
    "pymupdf>=1.24.0",
    "rapidocr_onnxruntime>=1.3.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.poetry]
packages = [{ include = "app", from = "." }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
