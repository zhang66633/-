method_card:
  id: "mc_025"
  name: "LSTM 时间序列预测"
  name_en: "Long Short-Term Memory Networks"
  category: ["预测", "机器学习"]
  principle: |
    LSTM（长短期记忆网络）是一种特殊的 RNN，通过门控机制解决传统 RNN 的梯度消失/爆炸问题，
    能够捕捉时间序列中的长期依赖关系。

    **核心结构（LSTM 单元）**：
    1. 遗忘门 f_t = σ(W_f·[h_{t-1}, x_t] + b_f)：决定丢弃哪些旧记忆
    2. 输入门 i_t = σ(W_i·[h_{t-1}, x_t] + b_i)：决定存储哪些新信息
    3. 候选记忆 C̃_t = tanh(W_c·[h_{t-1}, x_t] + b_c)：创建候选记忆
    4. 更新记忆 C_t = f_t ⊙ C_{t-1} + i_t ⊙ C̃_t：选择性遗忘旧 + 选择性存入新
    5. 输出门 o_t = σ(W_o·[h_{t-1}, x_t] + b_o)：决定输出什么
    6. 隐状态 h_t = o_t ⊙ tanh(C_t)：当前时刻输出

    **为什么适合时间序列**：
    - 记忆单元 C_t 可以在长时间跨度内携带信息，不受短期波动干扰
    - 门控机制自动学习"记住多久"和"何时遗忘"
    - 可处理变长序列，对缺失值有一定鲁棒性

  formulas:
    - "遗忘门: f_t = σ(W_f·[h_{t-1}, x_t] + b_f)"
    - "记忆更新: C_t = f_t·C_{t-1} + i_t·tanh(W_c·[h_{t-1}, x_t] + b_c)"
    - "输出: h_t = o_t·tanh(C_t)"
    - "σ = sigmoid 激活函数，tanh 为双曲正切"

  applicable_when:
    - "时间序列数据量充足（建议 ≥ 1000 个时间步）"
    - "序列存在复杂非线性模式和长期依赖"
    - "ARIMA/指数平滑等传统方法无法捕捉的季节性突变或趋势拐点"
    - "多变量输入（如用气温、节假日、促销活动预测销量）"

  typical_scenarios:
    - "销量/需求预测：零售、电力负荷、交通流量"
    - "金融预测：股价趋势、汇率、波动率"
    - "竞赛中的大规模时序预测题（数据多、模式复杂）"
    - "多步预测：预测未来 7 天 / 30 天的序列"
    - "异常检测：重构误差大于阈值为异常（LSTM AutoEncoder）"

  common_mistakes:
    - mistake: "数据量不足时使用 LSTM（< 500 样本）"
      solution: "小样本优先用 ARIMA、指数平滑、Prophet；LSTM 至少要数千时间步"
    - mistake: "不归一化直接输入，导致梯度爆炸"
      solution: "用 MinMaxScaler 或 StandardScaler 归一化到 [0,1] 或 N(0,1)"
    - mistake: "直接单步预测多步，误差累积"
      solution: "多步预测用 Seq2Seq 架构或递归多步策略（Recursive Multi-Step）"
    - mistake: "过拟合：训练 loss 低但测试 loss 高"
      solution: "加 Dropout（0.2-0.5）、Early Stopping、降低隐藏层维度"

  code_snippets:
    - language: "python"
      description: "Keras LSTM 时间序列预测（单步）"
      code: |
        import numpy as np
        from tensorflow.keras.models import Sequential
        from tensorflow.keras.layers import LSTM, Dense, Dropout
        from sklearn.preprocessing import MinMaxScaler

        def lstm_forecast(series, lookback=30, epochs=50):
            # 归一化
            scaler = MinMaxScaler()
            scaled = scaler.fit_transform(series.reshape(-1, 1))
            # 构造滑动窗口
            X, y = [], []
            for i in range(lookback, len(scaled)):
                X.append(scaled[i-lookback:i, 0])
                y.append(scaled[i, 0])
            X, y = np.array(X), np.array(y)
            X = X.reshape(X.shape[0], X.shape[1], 1)
            # LSTM 模型
            model = Sequential([
                LSTM(64, return_sequences=True, input_shape=(lookback, 1)),
                Dropout(0.2),
                LSTM(32),
                Dropout(0.2),
                Dense(1)
            ])
            model.compile(optimizer='adam', loss='mse')
            model.fit(X, y, epochs=epochs, batch_size=32, validation_split=0.2, verbose=0)
            return model, scaler

