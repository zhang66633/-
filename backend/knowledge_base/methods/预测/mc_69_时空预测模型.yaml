method_card:
  name: 时空预测模型
  name_en: ''
  category:
  - 预测
  principle: "时空预测模型用于同时考虑时间和空间相关性的预测问题，如交通流量预测、空气质量预测、疫情传播等。\n\n#### 10.1 时空数据特点\n\n**时空相关性**：\n- **时间依赖**：当前状态受历史状态影响\n\
    - **空间依赖**：当前位置受邻近位置影响\n- **时空交互**：时间和空间相互影响\n\n**时空数据表示**：\n$$\nX \\in \\mathbb{R}^{N \\times T \\\
    times F}\n$$\n\n其中：$N$是空间节点数，$T$是时间步长，$F$是特征维度。\n\n#### 10.2 经典时空预测模型\n\n**ARIMA时空扩展**：STARIMA\n$$\n\
    X_t = \\sum_{k=1}^{p} \\Phi_k X_{t-k} + \\sum_{l=1}^{q} \\Theta_l \\epsilon_{t-l} + \\epsilon_t\n\
    $$\n\n**时空图卷积网络**：STGCN\n\n结合图卷积网络(GCN)和时序卷积网络(TCN)。\n\n**图卷积层**：\n$$\nH^{(l+1)} = \\sigma(\\tilde{D}^{-\\\
    frac{1}{2}}\\tilde{A}\\tilde{D}^{-\\frac{1}{2}} H^{(l)} W^{(l)})\n$$\n\n其中$\\tilde{A} = A + I$（加入自连接），$\\\
    tilde{D}_{ii} = \\sum_j \\tilde{A}_{ij}$\n\n**时间卷积层**：使用1D卷积捕获时序模式。\n\n#### 10.3 交通流量预测示例\n\n**基于图神经网络的交通预测**：\n\
    \n1. **构建道路网络图**：$G = (V, E, W)$\n   - $V$：道路节点\n   - $E$：道路连接\n   - $W$：连接权重（距离、相似度等）\n\n2. **时空注意力机制**：\n\
    $$\n\\alpha_{ij}^t = \\frac{\\exp(score(s_i^t, s_j^t))}{\\sum_{k \\in \\mathcal{N}(i)} \\exp(score(s_i^t,\
    \ s_k^t))}\n$$\n\n3. **预测输出**：\n$$\n\\hat{X}_{t+1:t+H} = \\text{Decoder}(\\text{Encoder}(X_{t-T:t},\
    \ G))\n$$\n\n#### 10.4 评价指标\n\n**RMSE**（均方根误差）：\n$$\nRMSE = \\sqrt{\\frac{1}{NTH} \\sum_{n,t,h} (X_{n,t+h}\
    \ - \\hat{X}_{n,t+h})^2}\n$$\n\n**MAE**（平均绝对误差）：\n$$\nMAE = \\frac{1}{NTH} \\sum_{n,t,h} |X_{n,t+h}\
    \ - \\hat{X}_{n,t+h}|\n$$\n\n**MAPE**（平均绝对百分比误差）：\n$$\nMAPE = \\frac{100\\%}{NTH} \\sum_{n,t,h} \\\
    left|\\frac{X_{n,t+h} - \\hat{X}_{n,t+h}}{X_{n,t+h}}\\right|\n$$"
