    description: 时空预测模型 实现要点
    code: "import numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport networkx\
      \ as nx\nimport matplotlib.pyplot as plt\n\n# 构建时空图\ndef build_spatial_graph(adj_matrix, threshold=0.1):\n\
      \    \"\"\"\n    构建空间图\n    :param adj_matrix: 邻接矩阵或距离矩阵\n    :param threshold: 连接阈值\n    :return:\
      \ NetworkX图\n    \"\"\"\n    G = nx.Graph()\n    n = adj_matrix.shape[0]\n\n    for i in range(n):\n\
      \        for j in range(i+1, n):\n            if adj_matrix[i, j] > threshold:\n               \
      \ G.add_edge(i, j, weight=adj_matrix[i, j])\n\n    return G\n\ndef compute_normalized_laplacian(adj_matrix):\n\
      \    \"\"\"\n    计算归一化拉普拉斯矩阵\n    :param adj_matrix: 邻接矩阵\n    :return: 归一化拉普拉斯矩阵\n    \"\"\"\n\
      \    A = adj_matrix + np.eye(adj_matrix.shape[0])  # 自连接\n    D = np.diag(A.sum(axis=1))\n    D_inv_sqrt\
      \ = np.linalg.inv(np.sqrt(D))\n    L = np.eye(A.shape[0]) - D_inv_sqrt @ A @ D_inv_sqrt\n    return\
      \ torch.FloatTensor(L)\n\n# 时空图卷积层\nclass STGCNBlock(nn.Module):\n    \"\"\"时空图卷积块\"\"\"\n    def\
      \ __init__(self, in_channels, out_channels, num_nodes):\n        super().__init__()\n        self.temporal_conv\
      \ = nn.Conv2d(in_channels, out_channels, kernel_size=(1, 3), padding=(0, 1))\n        self.graph_conv\
      \ = GraphConv(out_channels, out_channels, num_nodes)\n        self.bn = nn.BatchNorm2d(out_channels)\n\
      \        self.relu = nn.ReLU()\n\n    def forward(self, x, laplacian):\n        # x: (batch, channels,\
      \ time, nodes)\n        x = self.temporal_conv(x)\n        x = self.graph_conv(x, laplacian)\n \
      \       x = self.bn(x)\n        x = self.relu(x)\n        return x\n\nclass GraphConv(nn.Module):\n\
      \    \"\"\"图卷积层\"\"\"\n    def __init__(self, in_channels, out_channels, num_nodes):\n        super().__init__()\n\
      \        self.theta = nn.Parameter(torch.FloatTensor(in_channels, out_channels))\n        nn.init.xavier_uniform_(self.theta)\n\
      \n    def forward(self, x, laplacian):\n        # x: (batch, channels, time, nodes)\n        batch,\
      \ channels, time, nodes = x.shape\n        x = x.permute(0, 2, 3, 1)  # (batch, time, nodes, channels)\n\
      \        x = torch.matmul(x, self.theta)  # (batch, time, nodes, out_channels)\n        # 图卷积: x\
      \ = L @ x\n        x = torch.matmul(laplacian, x)  # (batch, time, nodes, out_channels)\n      \
      \  x = x.permute(0, 3, 1, 2)  # (batch, out_channels, time, nodes)\n        return x\n\n# 简化的时空预测模型\n\
