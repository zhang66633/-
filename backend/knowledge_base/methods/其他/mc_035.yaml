method_card:
  id: mc_035
  name: 变分法
  name_en: Calculus of Variations
  category:
  - 优化
  - 微分方程
  principle: 变分法是研究泛函极值问题的经典数学方法。其核心思想是将泛函的极值问题转化为求解欧拉方程，通过变分（泛函增量的线性主部）和泛函极值的必要条件（一阶变分为零）推导出极值曲线满足的微分方程。对于最简泛函
    J = ∫F(t,x,ẋ)dt，在端点固定条件下，极值曲线满足欧拉方程 F_x - d/dt(F_{ẋ}) = 0。对于不同依赖形式的被积函数F，欧拉方程可简化为首次积分等形式。端点变动时需引入横截条件确定积分常数。
  formulas:
  - name: 最简泛函
    latex: $$J(x(t)) = \int_{t_0}^{t_f} F(t, x, \dot{x}) dt$$
    description: 最简泛函的一般形式，其中F是t, x, ẋ的连续可微函数。
  - name: 欧拉方程
    latex: $$F_x - \frac{d}{dt}F_{\dot{x}} = 0$$
    description: 泛函取极值的必要条件，即极值曲线满足的二阶微分方程。
  - name: 欧拉方程展开形式
    latex: $$F_{x\dot{x}}\ddot{x} + F_{xt}\dot{x} + F_{tx} - F_x = 0$$
    description: 欧拉方程的展开形式，便于直接求解。
  - name: 横截条件（端点变动）
    latex: $$[F + (\dot{\psi} - \dot{x})F_{\dot{x}}]_{t=t_f} = 0$$
    description: 当端点沿给定曲线ψ(t)变动时，确定欧拉方程通解中常数的定解条件。
  applicable_when:
  - 问题可归结为求某个泛函（函数的函数）的极值
  - 控制函数或路径可以事先确定为某种函数形式
  - 动态系统的最优控制问题，且控制变量无约束或可转化为无约束问题
  - 被积函数F至少二阶连续可微，容许函数满足一定的光滑性（如二次可微）
  not_applicable_when:
  - 泛函不可微或变分不存在
  - 控制变量受不等式约束（此时需用最优控制理论中的最大值原理）
  - 问题涉及随机过程或离散变量
  - 容许函数集不满足必要的连续性或边界条件
  typical_scenarios:
  - 最速降线问题（求质点沿曲线下滑时间最短的曲线）
  - 最小旋转面问题（求绕轴旋转所得侧面积最小的曲线）
  - 测地线问题（求曲面上两点间最短路径）
  - 等周问题（在给定周长下求面积最大的曲线）
  - 物理中的最小作用量原理（力学、光学等）
  common_mistakes:
  - mistake: 忽略边界条件直接求解欧拉方程，导致通解中的常数无法确定
    solution: 必须根据端点固定或变动情况正确应用边界条件或横截条件。
  - mistake: 误将泛函极值的必要条件（欧拉方程）当作充分条件
    solution: 欧拉方程仅给出极值候选曲线，还需通过二阶变分或实际物理意义判断极值类型。
  - mistake: 在F不依赖于ẋ时仍使用欧拉方程的一般形式，导致错误
    solution: 此时F_x=0给出隐式代数方程，通常无解，应直接判断变分问题无解。
  code_snippets:
  - language: python
    description: 使用sympy符号计算求解最速降线问题的欧拉方程（F = sqrt(1+y'^2)/sqrt(2gy)）
    code: 'import sympy as sp


      # 定义符号

      y = sp.Function(''y'')

      x = sp.symbols(''x'')

      g = sp.symbols(''g'', positive=True)


      # 定义被积函数F

      yprime = sp.diff(y(x), x)

      F = sp.sqrt(1 + yprime**2) / sp.sqrt(2*g*y(x))


      # 计算欧拉方程: F_y - d/dx(F_{y''}) = 0

      F_y = sp.diff(F, y(x))

      F_yprime = sp.diff(F, yprime)

      dF_yprime_dx = sp.diff(F_yprime, x)


      euler_eq = sp.simplify(F_y - dF_yprime_dx)

      print("欧拉方程:", euler_eq)


      # 由于F不显含x，可得到首次积分: F - y''*F_{y''} = C

      first_integral = sp.simplify(F - yprime * F_yprime)

      print("首次积分:", first_integral, "= C")'
