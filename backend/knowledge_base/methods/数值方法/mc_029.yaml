method_card:
  id: mc_029
  name: 拉格朗日多项式插值
  name_en: Lagrange Polynomial Interpolation
  category:
  - 数值方法
  principle: 拉格朗日多项式插值是一种代数插值方法，通过构造一组基函数（拉格朗日基函数）来直接得到满足插值条件的多项式。给定n+1个互异节点及其函数值，可以唯一确定一个不超过n次的多项式，该多项式在节点处与给定函数值相等。基函数满足在对应节点处取值为1，在其他节点处取值为0，从而插值多项式为各节点函数值与对应基函数的线性组合。拉格朗日插值多项式形式对称、易于理解，但当节点增加时需重新计算所有基函数。
  formulas:
  - name: 拉格朗日插值多项式
    latex: $$L_n(x) = \sum_{i=0}^{n} y_i \prod_{\substack{j=0 \\ j \neq i}}^{n} \frac{x
      - x_j}{x_i - x_j}$$
    description: n次拉格朗日插值多项式，其中y_i为节点x_i处的函数值，基函数为n次多项式，满足在x_i处为1，在其他节点处为0。
  - name: 拉格朗日基函数
    latex: $$l_i(x) = \prod_{\substack{j=0 \\ j \neq i}}^{n} \frac{x - x_j}{x_i -
      x_j}$$
    description: 拉格朗日基函数，为n次多项式，满足l_i(x_j)=δ_{ij}。
  - name: 插值余项
    latex: $$R_n(x) = f(x) - L_n(x) = \frac{f^{(n+1)}(\xi)}{(n+1)!} \prod_{i=0}^{n}
      (x - x_i)$$
    description: 拉格朗日插值余项，ξ介于最小和最大节点之间，要求f(x)具有n+1阶连续导数。
  applicable_when:
  - 已知有限个互异节点及其函数值，需要构造一个多项式近似函数
  - 节点数量较少（一般n≤10），避免高次多项式振荡
  - 函数值精确，不需要考虑数据误差
  - 需要插值多项式在节点处精确通过给定点
  not_applicable_when:
  - 节点数量很大（n>10），高次多项式易产生龙格现象
  - 数据含有噪声或测量误差，此时应使用拟合方法
  - 需要插值函数具有连续导数（如Hermite插值更合适）
  - 节点等距且区间端点附近，高次拉格朗日插值可能发散
  typical_scenarios:
  - 数学函数表的插值计算
  - 实验数据点较少时的曲线拟合（精确通过数据点）
  - 数值积分和数值微分的基础构造
  - 计算机图形学中的曲线生成
  common_mistakes:
  - mistake: 节点数量过多时仍使用高次拉格朗日插值，导致龙格振荡
    solution: 当节点较多时，应改用分段低次插值（如分段线性插值、三次样条插值）
  - mistake: 误认为拉格朗日插值多项式唯一，但不同构造方式（如牛顿插值）本质相同
    solution: 理解插值多项式的唯一性定理，不同方法只是计算形式不同
  - mistake: 忽略节点必须互异，否则基函数分母为零
    solution: 确保所有插值节点互不相同
  code_snippets:
  - language: matlab
    description: 拉格朗日插值函数实现，输入节点数据x0,y0和插值点x，输出插值结果y
    code: "function y=lagrange(x0,y0,x);\nn=length(x0);m=length(x);\nfor i=1:m\n \
      \  z=x(i);\n   s=0.0;\n   for k=1:n\n      p=1.0;\n      for j=1:n\n       \
      \  if j~=k\n            p=p*(z-x0(j))/(x0(k)-x0(j));\n         end\n      end\n\
      \      s=p*y0(k)+s;\n   end\n   y(i)=s;\nend"
  related_cards: []
  related_papers: []
  difficulty: 3
  quality_rating: 4
