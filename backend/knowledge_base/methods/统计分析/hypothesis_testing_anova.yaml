method_card:
  id: mc_023
  name: 假设检验与方差分析
  name_en: Hypothesis Testing & ANOVA
  category:
  - 统计分析
  - 评价
  principle: '假设检验是统计推断的核心方法，用于判断样本数据是否支持某个关于总体的假设。

    方差分析（ANOVA）是假设检验在比较多个总体均值时的扩展。


    **假设检验基本框架**：

    1. 提出 H₀（原假设，通常是"无差异/无效应"）和 H₁（备择假设）

    2. 选择检验统计量（t、F、χ² 等）和显著性水平 α（通常 0.05）

    3. 计算 p 值 = P(观察到更极端结果 | H₀ 为真)

    4. p < α → 拒绝 H₀，结果显著；p ≥ α → 不拒绝 H₀


    **常见检验**：

    - t 检验：比较两组均值（独立样本/配对）

    - χ² 检验：检验分类变量的独立性或拟合优度

    - 单因素 ANOVA：比较 k（k≥3）组均值是否相等

    - 双因素 ANOVA：同时考察两个因素的影响及交互作用

    - F 检验：比较两个方差或检验回归模型整体显著性

    '
  formulas:
  - '单样本 t: t = (x̄ - μ₀) / (s/√n)，df = n-1'
  - '两独立样本 t: t = (x̄₁ - x̄₂) / (s_p·√(1/n₁ + 1/n₂))'
  - χ² = Σ (Oᵢ-Eᵢ)² / Eᵢ，df = (r-1)(c-1)
  - ANOVA F = MS_between / MS_within = (SS_between/df_between) / (SS_within/df_within)
  applicable_when:
  - 需要判断两组或多组数据的差异是否统计显著
  - 建模前探索性数据分析（EDA）：检验变量间关系
  - 模型验证：检验残差正态性、方差齐性
  - 竞赛中需要给出结论的可信度论证（不只是比大小，要给 p 值）
  typical_scenarios:
  - A/B 测试：新旧方案的效果是否有显著差异
  - 因素筛选：多个自变量中哪些对因变量有显著影响
  - 模型假设验证：检验回归残差是否满足正态性和同方差性
  - 多方案比选：用 ANOVA + 事后检验选出最优方案
  - 竞赛中的灵敏度分析：参数变化对结果的影响是否显著
  common_mistakes:
  - mistake: p > 0.05 就说'两组无差异'
    solution: 应该说'没有足够证据拒绝 H₀'，不能证明 H₀ 为真；考虑增大样本量
  - mistake: 多重比较不做校正（多次 t 检验代替 ANOVA）
    solution: k 组比较用 ANOVA 先判断整体差异，有差异再做 Bonferroni/Tukey 事后检验
  - mistake: 违背 ANOVA 假设（正态性、方差齐性、独立性）
    solution: 用 Shapiro-Wilk 检验正态性，Levene 检验方差齐性；不满足用 Kruskal-Wallis 非参数检验
  - mistake: 只看 p 值忽略效应量
    solution: 报告 Cohen's d / η² 等效应量指标；大样本下微小差异也可能 p<0.05
  code_snippets:
  - language: python
    description: scipy 假设检验 + statsmodels ANOVA
    code: "from scipy import stats\nimport numpy as np\n\n# t 检验\ndef t_test_example(group_a, group_b):\n\
      \    t_stat, p_val = stats.ttest_ind(group_a, group_b)\n    cohens_d = (np.mean(group_a) - np.mean(group_b))\
      \ / \\\n               np.sqrt((np.var(group_a) + np.var(group_b)) / 2)\n    return {\"t\": t_stat,\
      \ \"p\": p_val, \"cohens_d\": abs(cohens_d)}\n\n# 单因素 ANOVA\ndef anova_example(*groups):\n    f_stat,\
      \ p_val = stats.f_oneway(*groups)\n    # 效应量 η²\n    all_data = np.concatenate(groups)\n    ss_total\
      \ = np.sum((all_data - np.mean(all_data))**2)\n    ss_between = sum(len(g) * (np.mean(g) - np.mean(all_data))**2\
      \ for g in groups)\n    eta_sq = ss_between / ss_total\n    return {\"F\": f_stat, \"p\": p_val,\
      \ \"eta_sq\": eta_sq}\n"
