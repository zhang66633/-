method_card:
  id: mc_057
  name: 无约束确定型存贮模型（EOQ/EPQ）
  name_en: Unconstrained Deterministic Inventory Models (EOQ/EPQ)
  category:
  - 优化
  principle: 存贮论将供应与需求通过存贮中心连接，以单位时间平均总费用最小为目标。在需求连续均匀且确定、费用参数已知、无约束条件下，总费用由订货费、存贮费和缺货损失费构成；对费用函数关于订货批量或存贮周期求一阶条件，得到经济订购批量、最优周期和最小费用。若补充需要一定时间，引入生产速率P，形成经济生产批量模型；若允许缺货，引入缺货费C_S，通过存贮状态图推导最优补货与缺货时间。核心是平衡订货或生产准备成本与库存持有成本，使系统总成本最低。
  formulas:
  - name: EOQ模型平均总费用
    latex: $$C(Q)=\frac{1}{2}C_P Q+\frac{C_D D}{Q}$$
    description: 模型一不允许缺货、补充时间极短时的单位时间平均总费用，第一项为平均存贮费，第二项为平均订货费。
  - name: 经济订购批量（EOQ）
    latex: $$Q^*=\sqrt{\frac{2C_D D}{C_P}}$$
    description: 对C(Q)求导并令为零得到的最优订货量，平衡存贮费与订货费。
  - name: 最优订货周期
    latex: $$T^*=\frac{Q^*}{D}=\sqrt{\frac{2C_D}{D C_P}}$$
    description: 最优订货间隔期，等于最优订货量除以需求率D。
  - name: EOQ最小费用
    latex: $$C^*=\sqrt{2 C_D C_P D}$$
    description: 将Q*代入总费用函数得到的最小单位时间平均费用。
  - name: 经济生产批量模型最优生产周期
    latex: $$T^*=\sqrt{\frac{2C_D(C_P+C_S)}{D C_P C_S(1-D/P)}}$$
    description: 模型二允许缺货且补充需一定时间时的最优存贮周期，P为生产速度。
  - name: 经济生产批量
    latex: $$Q^*=D T^*$$
    description: 最优生产批量等于需求率乘以最优存贮周期。
  - name: 不允许缺货、补充时间较长的最优生产量
    latex: $$Q^*=\sqrt{\frac{2 C_D D}{C_P(1-D/P)}}$$
    description: 模型三中取消允许缺货条件（C_S→∞）后的最优生产量。
  - name: 不允许缺货、补充时间较长的最优费用
    latex: $$C^*=\sqrt{2 C_D C_P D(1-D/P)}$$
    description: 模型三中对应最优生产量的最小平均总费用。
  applicable_when:
  - 需求连续、均匀且需求率D为常数
  - 订货费C_D、单位存贮费C_P等费用参数已知且稳定
  - 不允许缺货或允许缺货但缺货损失费可量化
  - 补充可瞬时完成或以恒定速率P连续补充
  - 单品种、单存储点、无库存空间和资金约束
  not_applicable_when:
  - 需求随机、波动明显，需要概率分布描述
  - 存在数量折扣、价格折扣或运输批量优惠
  - 多品种、多级库存或库存空间与资金有限
  - 提前期随机或不允许用确定性近似
  - 货物价值随时间变化、易变质或存在过期损失
  typical_scenarios:
  - 零售商品的最经济定期进货批量与周期
  - 生产企业自制自销设备的批量组织
  - 需求稳定的备品备件订货决策
  - 生产速率高于需求速率时的库存补充计划
  common_mistakes:
  - mistake: 把年需求量和日需求量混用，导致费用单位不一致
    solution: 统一时间单位后再代入公式，例如将年需求换成日需求或按年统一费率。
  - mistake: 求出最优订货次数不是整数时直接四舍五入
    solution: 比较相邻整数次订货对应的年度总费用，选择费用较小者。
  - mistake: 将基本EOQ公式误用于允许缺货或生产补充时间较长的场景
    solution: 先判断是否存在缺货费C_S或生产速率P，选择对应模型（EPQ/缺货模型）。
  - mistake: 忽略订货点L或提前期
    solution: 若存在定时/定点订货情形，需按L=Dt_0设置订货点，当库存降到L即订货。
  code_snippets:
  - language: python
    description: 基本EOQ模型参数计算示例
    code: "import math\n\ndef eoq(D, C_D, C_P):\n    Q = math.sqrt(2 * C_D * D / C_P)\n\
      \    T = Q / D\n    C = math.sqrt(2 * C_D * C_P * D)\n    return Q, T, C\n\n\
      # 例：D=100件/天, C_D=10元, C_P=0.005元/件/天\nQ, T, C = eoq(100, 10, 0.005)\nprint(Q,\
      \ T, C)  # 632.45, 6.32, 3.16"
