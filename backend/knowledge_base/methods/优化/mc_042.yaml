method_card:
  id: mc_042
  name: 经济订购批量存贮模型
  name_en: Economic Ordering Quantity (EOQ) Model
  category:
  - 优化
  principle: 经济订购批量（EOQ）模型是存贮论中经典的确定性模型，用于在需求连续均匀、不允许缺货、补充时间极短的假设下，确定最优订货批量以最小化总库存成本。模型通过平衡订货费（每次固定）与存贮费（与库存量成正比），推导出使单位时间平均总费用最小的订货量Q*、订货周期T*和最小费用C*。核心思想是当订货费与存贮费相等时总费用最小，公式为Q*
    = sqrt(2 D C_D / C_P)，其中D为需求率，C_D为单次订货费，C_P为单位存贮费。
  formulas:
  - name: 经济订购批量
    latex: $$Q^* = \sqrt{\frac{2 D C_D}{C_P}}$$
    description: 最优订货批量，使总费用最小
  - name: 最佳订货周期
    latex: $$T^* = \frac{Q^*}{D} = \sqrt{\frac{2 C_D}{D C_P}}$$
    description: 最优订货间隔时间
  - name: 最小平均总费用
    latex: $$C^* = \sqrt{2 D C_D C_P}$$
    description: 单位时间的最小平均总费用（订货费+存贮费）
  applicable_when:
  - 需求连续均匀且为常数
  - 不允许缺货（缺货费无穷大）
  - 补充时间极短（可视为瞬时到货）
  - 每次订货量不变，订购费固定
  - 单位存贮费为常数
  not_applicable_when:
  - 需求随机或波动较大
  - 允许缺货或补充需要时间
  - 订货费或存贮费非线性变化
  - 存在数量折扣或价格变动
  typical_scenarios:
  - 企业采购原材料或商品的库存管理
  - 零售业确定最优订货批量
  - 制造业中标准件的库存控制
  common_mistakes:
  - mistake: 将EOQ模型直接用于需求波动大或季节性明显的场景
    solution: 应使用随机存贮模型或考虑安全库存的动态规划方法
  - mistake: 忽略订货周期必须为整数（如天数、月数）导致实际执行偏差
    solution: 计算后需对订货次数取整，并比较相邻整数解的总费用
  code_snippets:
  - language: LINGO
    description: 求解EOQ模型并确定最优订货次数（整数解）
    code: 'model:

      sets:

      times/1..100/:C,Q;

      endsets

      C_D=10;

      D=100*365;

      C_P=0.005*365;

      @for(times(i):Q(i)=D/i;C(i)=0.5*C_P*Q+C_D*D/Q);

      C_min=@min(times:C);

      Q_best=@sum(times(i):Q(i)*(C(i) #eq# C_min));

      N_best=D/Q_best;

      end'
  related_cards: []
  related_papers: []
  difficulty: 2
  quality_rating: 4
