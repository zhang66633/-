method_card:
  name: 鲸鱼优化算法
  name_en: Whale Optimization Algorithm, WOA
  category:
  - 优化
  principle: '鲸鱼优化算法是Mirjalili等人于2016年提出的一种新型元启发式算法，模拟座头鲸的泡泡网捕食行为。算法通过座头鲸包围猎物、螺旋更新位置和随机搜索三种机制实现全局优化。


    **位置更新公式**：


    **包围猎物**：

    $$

    \vec{D} = |\vec{C} \cdot \vec{X}^*(t) - \vec{X}(t)|

    $$

    $$

    \vec{X}(t+1) = \vec{X}^*(t) - \vec{A} \cdot \vec{D}

    $$


    **螺旋更新**：

    $$

    \vec{X}(t+1) = \vec{D}'' \cdot e^{bl} \cdot \cos(2\pi l) + \vec{X}^*(t)

    $$


    其中 $\vec{D}'' = |\vec{X}^*(t) - \vec{X}(t)|$ 表示鲸鱼与猎物的距离


    **参数**：

    - $\vec{A}$：收敛系数，随迭代从2线性递减到0

    - $\vec{C}$：摇摆系数，[0, 2]随机数

    - $b$：对数螺旋形状常数（通常取1）

    - $l$：[-1, 1]随机数'
  applicable_when: []
  typical_scenarios: []
  code_snippets:
  - language: python
    description: 鲸鱼优化算法 实现要点
    code: "import numpy as np\n\ndef whale_optimization(objective_func, dim, bounds, n_whales=30, max_iter=100):\n\
      \    # 初始化鲸鱼位置\n    whales = np.random.uniform(bounds[0], bounds[1], (n_whales, dim))\n    best_whale\
      \ = whales[0].copy()\n    best_fitness = objective_func(best_whale)\n\n    for iteration in range(max_iter):\n\
      \        # 线性递减a从2到0\n        a = 2 - iteration * (2 / max_iter)\n\n        for i in range(n_whales):\n\
      \            r1 = np.random.rand()\n            r2 = np.random.rand()\n\n            A = 2 * a *\
      \ r1 - a\n            C = 2 * r2\n\n            p = np.random.rand()\n\n            if p < 0.5:\n\
      \                # 包围机制\n                if abs(A) < 1:\n                    D = abs(C * best_whale\
      \ - whales[i])\n                    whales[i] = best_whale - A * D\n                else:\n    \
      \                # 随机搜索\n                    random_whale = whales[np.random.randint(n_whales)]\n\
      \                    D = abs(C * random_whale - whales[i])\n                    whales[i] = random_whale\
      \ - A * D\n            else:\n                # 螺旋更新\n                D_prime = abs(best_whale -\
      \ whales[i])\n                b = 1\n                l = (np.random.rand() * 2 - 1)\n          \
      \      whales[i] = D_prime * np.exp(b * l) * np.cos(2 * np.pi * l) + best_whale\n\n            #\
      \ 边界处理\n            whales[i] = np.clip(whales[i], bounds[0], bounds[1])\n\n            # 更新最优解\n\
      \            fitness = objective_func(whales[i])\n            if fitness < best_fitness:\n     \
      \           best_fitness = fitness\n                best_whale = whales[i].copy()\n\n    return\
      \ best_whale, best_fitness\n"
