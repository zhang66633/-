  name: 网络流问题
  name_en: Network Flow Problem
  category:
  - 图论
  principle: '网络流问题研究在网络中从源点到汇点的最大流量。


    #### 3.1 最大流问题


    **基本概念**：

    - **容量**：每条边的最大流量限制$c(u,v)$

    - **流量**：每条边的实际流量$f(u,v)$

    - **源点**：流出的起点$s$

    - **汇点**：流入的终点$t$


    **流量守恒**：

    $$

    \sum_{v} f(v, u) = \sum_{v} f(u, v), \quad \forall u \neq s, t

    $$


    **容量限制**：

    $$

    0 \leq f(u, v) \leq c(u, v)

    $$


    #### 3.2 Ford-Fulkerson算法


    通过寻找增广路径增加流量，直到不存在增广路径。


    **残差网络**：

    $$

    c_f(u, v) = \begin{cases}

    c(u, v) - f(u, v), & \text{如果}(u, v) \in E \\

    f(v, u), & \text{如果}(v, u) \in E \\

    0, & \text{否则}

    \end{cases}

    $$


    #### 3.3 Edmonds-Karp算法


    Ford-Fulkerson的实现，使用BFS找增广路径。


    **时间复杂度**：$O(VE^2)$


    #### 3.4 Dinic算法


    使用层次图和多路增广，效率更高。


    **时间复杂度**：$O(V^2E)$


    #### 3.5 最小费用最大流


    在最大流的基础上使总费用最小。


    **目标**：

    $$

    \min \sum_{(u,v) \in E} f(u, v) \cdot cost(u, v)

    $$'
