  title: "2023 年高教社杯全国大学生数学建模竞赛题目"
  full_text: |
    2023 年高教社杯全国大学生数学建模竞赛题目 
    （请先阅读“全国大学生数学建模竞赛论文格式规范”） 
     
    D 题  圈养湖羊的空间利用率 
    规模化的圈养养殖场通常根据牲畜的性别和生长阶段分群饲养，适应不同种类、不同阶段
    的牲畜对空间的不同要求，以保障牲畜安全和健康；与此同时，也要尽量减少空间闲置所造成
    的资源浪费。在实际运营中，还需要考虑市场上饲料价格和产品销售价格的波动以及气候、疾
    病、种畜淘汰、更新等诸多复杂且关联的因素，但空间利用率是相对独立并影响养殖场经营效
    益的重要问题。 
    湖羊是国家级绵羊保护品种，具有早期生长快、性成熟早、四季发情并且可以圈养等优良
    特性。湖羊养殖场通常建有若干标准羊栏，每一标准羊栏所能容纳的羊只数量由羊的性别、大
    小、生长阶段决定。 
    湖羊养殖的生产过程主要包括繁殖和育肥两大环节。人工授精技术要求高，因此湖羊繁殖
    大多采用种公羊和基础母羊自然交配的方式。怀孕母羊分娩后给羔羊哺乳，羔羊断奶后独立喂
    饲，育肥长成后出栏。自然交配时将若干基础母羊与一只种公羊关在一个羊栏中，自然交配期
    约为3 周，然后将种公羊移出。受孕母羊的孕期约为5 个月，每胎通常产羔2 只。母羊分娩后
    哺乳期通常控制在6 周左右，断奶后将羔羊移至育肥羊栏喂饲。一般情况下，羔羊断奶后经过
    7 个月左右育肥就可以出栏。母羊停止哺乳后，经过约3 周的空怀休整期，一般会很快发情，
    可以再次配种。按上述周期，正常情况下，每只基础母羊每2 年可生产3 胎。在不考虑种公羊
    配种能力差异的情况下，种公羊与基础母羊一般按不低于1:50 的比例配置。种公羊和母羊在非
    交配期原则上不关在同一栏中。 
    某湖羊养殖场设置标准羊栏，规格是：空怀休整期每栏基础母羊不超过14 只；非交配期的
    种公羊每栏不超过4 只；自然交配期每栏1 只种公羊及不超过14 只基础母羊；怀孕期每栏不超
    过8 只待产母羊；分娩后的哺乳期，每栏不超过6 只母羊及它们的羔羊；育肥期每栏不超过14
    只羔羊。原则上不同阶段的羊只不能同栏。 
    养殖场的经营管理者为保障效益，需要通过制定生产计划来优化养殖场的空间利用率。这
    里的生产计划，主要是决定什么时间开始对多少可配种的基础母羊进行配种，控制羊只的繁育
    期，进而调节对羊栏的需求量，以确保有足够多的羊栏，同时尽量减少羊栏闲置。当羊栏不够
    时，可以租用其他场地。 
    请建立数学模型讨论并解决以下问题： 
    问题1  不考虑不确定因素和种羊的淘汰更新，假定自然交配期20 天，母羊都能受孕，孕
    期149 天，每胎产羔2 只，哺乳期40 天，羔羊育肥期210 天，母羊空怀休整期20 天。该湖羊
    养殖场现有112 个标准羊栏，在实现连续生产的条件下，试确定养殖场种公羊与基础母羊的合
    理数量，并估算年化出栏羊只数量的范围。若该养殖场希望每年出栏不少于1500 只羊，试估算
    现有标准羊栏数量的缺口。 
    问题2  在问题1 的基础上，对112 个标准羊栏给出具体的生产计划（包括种公羊与基础
    母羊的配种时机和数量、羊栏的使用方案、年化出栏羊只数量等），使得年化出栏羊只数量最
    大。 
    问题3  问题1 和问题2 中用到的数据都没有考虑不确定性，一旦决定了什么时间开始对
    多少可配种的基础母羊进行配种，后续对羊栏的安排和需求也就随之确定。例如，用3 个羊栏
    
    
    给42 只母羊进行配种，孕期需要6 个羊栏，哺乳期需要7 个羊栏给怀孕母羊分娩和哺乳，哺乳
    期结束就需要给84 只断奶羔羊和42 只母羊共安排9 个羊栏进行育肥和休整。但实际情况并非
    如此，配种成功率、分娩羔羊的数目和死亡率等都有不确定性，哺乳时间也可以调控，这些都
    会影响空间需求。 
    现根据经验作以下考虑： 
    (1) 母羊通过自然交配受孕率为85%，交配期结束后30 天可识别出是否成功受孕； 
    (2) 在自然交配的20 天中受孕母羊的受孕时间并不确知，而孕期会在147-150 天内波动，
    这些因素将影响到预产期范围； 
    (3) 怀孕母羊分娩时一般每胎产羔2 只，少部分每胎产羔1 只或3 只及以上，目前尚没有
    实用手段控制或提前得知产羔数。羔羊出生时，有夭折的可能，多羔死亡率高于正常。通常可
    以按平均每胎产羔2.2 只、羔羊平均死亡率3%估算。 
    (4) 母羊哺乳期过短不利于羔羊后期的生长，通常是羔羊体重达到一定标准后断奶；而哺乳
    期过长，母羊的身体消耗就越大，早点断奶，有利于早恢复、早发情配种。一种经验做法是将
    哺乳期控制在35-45 天内，以40 天为基准，哺乳期每减少1 天，羔羊的育肥期增加2 天；哺乳
    期每增加1 天，羔羊的育肥期减少2 天。除此之外，母羊的空怀休整期可在不少于18 天的前提
    下灵活调控。 
    此外，如有必要，允许分娩日期相差不超过7 天的哺乳期母羊及所产羔羊同栏，允许断奶
    日期相差不超过7 天的育肥期羔羊同栏，允许断奶日期相差不超过7 天的休整期母羊同栏。为
    简化问题，不考虑母羊流产、死亡以及羔羊在哺乳期或育肥期夭折和个体发育快慢等情况。 
    在以上不确定性的考虑下，生产计划的制定与问题1 和问题2 将有较大的不同：一旦作出
    了“什么时间开始对多少可配种的基础母羊进行配种”的决定，后续羊栏的需求和安排不再是
    随之确定的，而是每一步都会出现若干种可能的情况需要作相应的并遵从基本规则的安排处理，
    但无法改变或调整上一步。因此，某种意义上，本问题要讨论研究的生产计划将是一个应对多
    种可能情况的“预案集”。 
    请综合考虑可行性和年化出栏羊只数量，制定具体的生产计划，使得整体方案的期望损失
    最小。其中整体方案的损失由羊栏使用情况决定，当羊栏空置时，每栏每天的损失为1；当羊栏
    数量不够时，所缺的羊栏每栏每天的损失（即租用费）为3。
