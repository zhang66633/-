paper:
  id: paper_2005_国赛__2005A_长江水质的评价和预测
  year: 2005
  competition: 国赛
  problem_id: ''
  title: 长江水质的评价和预测
  tags:
    problem_type:
    - 评价
    - 预测
    - 反演
    core_models:
    - 归一化综合评判
    - 反应扩散方程
    - 差分方程反演
    - 回归分析
    - 二元线性回归
    techniques:
    - 归一化处理
    - F检验
    - 最小二乘法
    - 三项移动平均
  analysis:
    problem_summary: 基于长江水质监测数据，建立综合评价指标评估水质，反演污染源分布，预测未来水质变化趋势，并计算达到水质目标所需的年污水处理量。
    key_assumptions:
    - 干流相邻观测站间水流横截面积之差等于所有支流水流横截面积之和
    - 两观测站之间所有支流水流横截面积相等
    - 支流汇入干流后瞬间与干流水质均匀混合
    - 任意观测站到下一个干流观测站之间水质均匀，与该观测站水质相同
    - 扩散系数取13 km²/天
    - 降解系数介于0.1~0.5之间
    objective: 综合评价长江水质，判定主要污染源分布，预测未来10年水质变化趋势，并确定使不可饮用水比例控制在20%以内且无劣V类水所需的年污水处理量。
    constraints: 未来10年内长江干流不可饮用水（IV类和V类水）比例控制在20%以内，且没有劣V类水
  model:
    approach: 首先对原始数据进行归一化处理并构造综合评判指标函数，利用反应扩散方程和差分/微分反演模型判定污染源，再通过回归分析预测水质变化，最后基于二元线性回归模型求解所需污水处理量。
    innovation: 将归一化综合评判与反应扩散方程反演相结合，并利用二元线性回归模型综合考虑IV类、V类和劣V类水对排污量的影响，提高了预测的合理性。
    solution_method: 归一化处理、梯形积分、差分反演、最小二乘回归、F检验、三项移动平均平滑、二元线性回归
  evaluation:
    strengths:
    - 对原始数据进行了合理的归一化和综合处理，构造了清晰的水质综合评判指标
    - 采用多种反演模型（差分、微分、含支流）相互验证，结论一致性强
    - 回归分析中使用了F检验和移动平均平滑，提高了预测的可靠性
    - 二元线性回归模型有效减少了零值影响，结果更符合实际
    weaknesses:
    - 部分假设（如支流横截面积相等、瞬间均匀混合）可能与实际存在偏差
    - 对PH值的处理方式较为简化，可能影响综合评判的精度
    - 回归模型中剔除了个别特殊点，可能损失部分信息
    lessons: 可以学习如何将多源监测数据通过归一化和加权综合转化为单一评判指标，以及如何利用反应扩散方程和回归分析相结合解决环境评价与预测问题。
  quality_rating: 4
  source: 2005A：长江水质的评价和预测.pdf
