paper:
  id: paper_2014_国赛_A_A19004009__Γ________
  year: 2014
  competition: 国赛
  problem_id: A
  title: 嫦娥三号软着陆轨道设计与控制策略
  tags:
    problem_type:
    - 优化
    - 轨道设计
    - 控制策略
    core_models:
    - 轨道定位模型
    - 控制策略最优模型
    - 误差和敏感性分析模型
    techniques:
    - 霍曼转移
    - 动力学模型
    - 非线性规划
    - 离散化
    - 数值逼近
    - 控制变量法
  analysis:
    problem_summary: 针对嫦娥三号月球软着陆问题，设计着陆准备轨道（近月点、远月点位置与速度）及软着陆6个阶段的最优控制策略，并进行误差与敏感性分析。
    key_assumptions:
    - 软着陆下降轨迹平面在环月停泊轨道平面内
    - 嫦娥三号只受重力影响，不考虑科氏加速度
    - 月球引力非球项、日月引力摄动等影响因素均可忽略不计
    - 忽略月球自转
    objective: 确定着陆准备轨道近月点和远月点的位置与速度；确定嫦娥三号的着陆轨道和在6个阶段的最优控制策略；对设计出的着陆轨道和控制策略做误差分析和敏感性分析。
    constraints: 着陆准备轨道为近月点15km、远月点100km的椭圆形轨道；软着陆过程共6个阶段，每个阶段需满足关键点状态；尽量减少燃料消耗。
  model:
    approach: 建立下降轨道参考系和月心赤道惯性系，通过坐标转换和软着陆动力学模型求近月点经纬度；利用霍曼转移计算速度；针对6个阶段分别建模，主减速段以燃料最优为目标建立最优化方程，采用离散化和数值逼近求解；误差和敏感性分析采用控制变量法。
    innovation: 对月球软着陆轨道离散化时，利用离散点处状态连续作为约束条件，将常推力月球软着陆轨道优化问题归结为非线性规划问题，初值均为有物理意义的状态和控制量，避免了传统优化方法中对无物理意义变量初值的猜测。
    solution_method: 使用Matlab进行坐标转换矩阵计算、动力学模型求解、离散化处理、函数迭代和数值逼近、非线性规划求解、控制变量法进行误差与敏感性分析。
  evaluation:
    strengths:
    - 模型结构清晰，分阶段处理问题，针对性强
    - 创新性地将轨道优化转化为非线性规划问题，避免了初值猜测的困难
    - 进行了系统的误差和敏感性分析，验证了模型的稳定性
    weaknesses:
    - 部分假设（如忽略月球自转、科氏加速度等）可能对实际精度有影响
    - 模型求解过程依赖Matlab编程，未提供完整的理论推导细节
    lessons: 可以学习如何将复杂的航天器轨道优化问题分解为多个阶段，结合动力学模型和优化理论，采用离散化和数值方法求解，并通过敏感性分析评估模型的稳健性。
  quality_rating: 4
