paper:
  id: paper_0_国赛__1998A_投资收益与风险的优化模型
  year: 0
  competition: 国赛
  problem_id: ''
  title: 投资收益与风险的优化模型
  tags:
    problem_type:
    - 优化
    core_models:
    - 多目标优化
    - 加权组合
    techniques:
    - 净收益率排序
    - 风险固定优先法
  analysis:
    problem_summary: 在投资额一定的情况下，通过优化组合不同投资方式，使经济效益尽可能大、风险尽可能小。
    key_assumptions:
    - 银行存款可视为一种投资，其平均收益率、风险损失率、购买费率均为0
    - 各项投资量都比较大，对第i项的投资至少应大于等于某个值
    objective: 在给定投资资金和风险约束下，最大化总体净收益（或投资效益）
    constraints: 总体风险不超过给定值，总投资额不超过总资金，各投资项目的购买额非负且满足最低投资额要求
  model:
    approach: 将二目标优化问题通过加权组合转化为单目标优化问题，采用净收益率排序、风险固定时净收率大者优先的原则逐项确定各投资项目的投资额。
    innovation: 提出两个准则：准则一在风险一定时按净收益率大小顺序优先投资；准则二在特定条件下全部资金投资于净收益率最大的项目。
    solution_method: 对投资效益率排序，按优先顺序先后投资，以给定风险为限，逐项计算各投资项目的购买额。
  evaluation:
    strengths:
    - 模型简明清晰，解题步骤和理论依据明确
    - 给出了理论证明支持解法的合理性
    weaknesses:
    - 模型评价与推广部分缺失，未对模型局限性进行讨论
    - 部分符号和公式表述不够清晰，存在排版错误
    lessons: 在处理多目标优化问题时，可以通过排序和优先规则简化求解过程，同时需要理论证明保证解法的合理性。
  quality_rating: 3
  source: 1998A：投资收益与风险的优化模型.pdf
