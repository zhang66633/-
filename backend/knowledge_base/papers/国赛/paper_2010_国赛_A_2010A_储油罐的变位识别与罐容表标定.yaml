paper:
  id: paper_2010_国赛_A_2010A_储油罐的变位识别与罐容表标定
  year: 2010
  competition: 国赛
  problem_id: A
  title: 储油罐的变位识别与罐容表标定
  tags:
    problem_type:
    - 变位识别
    - 标定
    core_models:
    - 微积分体积积分模型
    - 最小二乘法拟合
    techniques:
    - 微元法
    - 空间解析几何
    - 离差平方和
  analysis:
    problem_summary: 针对储油罐因地基变形等原因发生纵向倾斜和横向偏转后，罐容表（油位高度与储油量对应关系）发生变化的问题，建立数学模型识别变位参数并重新标定罐容表。
    key_assumptions:
    - 罐内储油不受温度压强等影响，体积只与油位高度有关
    - 油浮子大小可忽略不计
    - 储油罐壁厚度可忽略
    - 外界因素不影响储油罐形状，不发生形变
    - 储油罐内部罐壁为理想对称几何图形
    - 内部小构件对储油量影响忽略不计
    - 油的自身性质和蒸发损耗忽略不计
    - 油浮子与油接触带来的仪器误差忽略不计
    objective: 建立储油罐变位后罐内储油量与油位高度及变位参数（纵向倾斜角度α、横向偏转角度β）之间的函数关系，确定变位参数，并给出罐容表标定值。
    constraints: 油位高度测量范围、储油罐几何尺寸（圆柱体、球冠体、椭圆截面）、变位参数范围
  model:
    approach: 应用微积分和空间解析几何，采用微元法建立油罐体积积分函数模型V(H,α,β)；通过分步考虑（先横向倾斜再纵向倾斜）简化模型，利用最小二乘法或离差平方和拟合实际数据与理论模型，确定变位参数。
    innovation: 将横向倾斜和纵向倾斜分步处理，利用几何对称性简化模型；通过最小二乘法拟合实际数据与理论模型来识别变位参数并验证模型准确性。
    solution_method: 使用Matlab软件求解体积积分模型，采用最小二乘法拟合理论储油量与实测储油量，确定变位参数α、β（α=4.9°），并给出罐容表标定值表。
  evaluation:
    strengths:
    - 模型与实际情况吻合度高，吻合系数达到0.9996
    - 分步处理变位，简化了复杂几何建模
    - 利用实际数据拟合验证，方法可靠
    weaknesses:
    - 模型假设较多，忽略温度、压强、蒸发等实际因素
    - 对油浮子等细节简化可能引入一定误差
    lessons: 可以学习如何利用微积分和空间几何建立复杂形状容器的体积模型，以及如何通过最小二乘法拟合实际数据来识别未知参数和验证模型。
  quality_rating: 4
  source: 2010A：储油罐的变位识别与罐容表标定 (2).pdf
