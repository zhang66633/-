paper:
  id: paper_2023_国赛_C_2018B_基于_0_1_规划的单_RG
  year: 2023
  competition: 国赛
  problem_id: C
  title: 基于0-1规划的单RGV动态调度模型
  tags:
    problem_type:
    - 优化
    - 调度
    core_models:
    - 0-1规划
    - 双目标规划
    techniques:
    - 启发式算法
    - 仿真
    - 循环遍历法
  analysis:
    problem_summary: 研究智能加工系统中单RGV的动态调度问题，针对单工序、双工序及CNC概率故障三种情况，建立调度模型并求解。
    key_assumptions:
    - 系统启动后中途不能更换刀具
    - RGV运行至CNC处时，上料传送带将生料同时送到该CNC正前方，下料传送带将清洗后的成料能立刻送走
    - CNC一旦发生故障，工作人员即刻开始排除故障
    - RGV所有的计算处理时间为0
    - 除非系统因已连续工作8小时而停止作业，RGV的操作不会被中途停止
    objective: 获得最多成料（单工序）；获得最多成料且RGV工作时间尽可能小（双工序）
    constraints: 每次调度单RGV仅能对一台CNC进行作业、每班次RGV工作时长不超过8小时、RGV下轮作业移动起点为上轮作业终点、每台CNC每次作业仅能加工一个物料、每台CNC仅能装配一种刀具加工一道工序、物料工序状况与CNC加工工序类型相匹配、CNC加工过程中有1%的概率发生故障、故障发生时该CNC正加工的物料即刻报废、排除故障时长服从10~20分钟的均匀分布
  model:
    approach: 以RGV调度路径为决策变量，以0-1规划思想建立单目标或双目标规划模型，针对不同情况增加相应约束条件，并设计启发式算法求解。
    innovation: 将CNC故障和维修等效转换为一次时间较长的加工作业，并在算法中加入仿真随机故障处理；针对双工序问题，采用循环遍历法求最优刀具分布方案。
    solution_method: 启发式算法（基于每轮上下料最短所需时长的启发信息），结合仿真随机故障（情况3），以及循环遍历法（双工序刀具分布）
  evaluation:
    strengths:
    - 模型具有普适性，能处理单工序、双工序及故障情况
    - 算法有效性高，程序运行时间和内存使用情况良好
    - 通过多组参数检验，结果稳定，实用性高
    weaknesses:
    - 模型假设较多，可能与实际系统存在偏差
    - 启发式算法得到的是近似最优解，而非精确最优解
    lessons: 可以学习如何利用0-1规划思想建立调度模型，以及如何将随机故障等效为加工时间并融入启发式算法中，同时掌握双目标规划的处理方法。
  quality_rating: 4
  source: 2018B：基于 0-1 规划的单 RGV 动态调度模型.pdf
