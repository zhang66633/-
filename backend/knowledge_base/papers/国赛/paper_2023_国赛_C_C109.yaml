paper:
  id: paper_2023_国赛_C_C109
  year: 2020
  competition: 国赛
  problem_id: C
  title: 基于梯度下降的决策树算法与非线性规划的信贷风险评估与信贷策略模型
  tags:
    problem_type:
    - 优化
    - 分类
    core_models:
    - 梯度下降决策树
    - 非线性规划
    techniques:
    - 集成学习
    - 正则化
    - 多目标规划
  analysis:
    problem_summary: 针对中小微企业信贷决策问题，建立信贷风险评估模型和银行最优信贷策略模型，并考虑突发因素调整策略。
    key_assumptions:
    - 贷款利率仅与客户流失率有关，不考虑其他影响因素
    - 银行针对各企业的信贷评估仅考虑企业实力、企业信誉两方面
    - 银行通过综合评估企业的信贷风险来确定具体的信贷策略，不考虑其他因素
    objective: 银行收益最大化、客户流失率最小、客户违约风险最小
    constraints: 银行贷款额度、银行贷款利率、银行客户流失率、银行是否放贷、企业违约概率
  model:
    approach: 首先利用改进的梯度下降决策树模型（集成学习+正则项）建立信贷风险评估模型预测违约概率；然后基于违约概率建立多目标非线性规划模型求解最优信贷策略；针对无信贷记录企业先进行信誉评级再应用模型；针对突发因素引入行业分类和宏观微观分析调整策略。
    innovation: 对传统决策树模型添加正则项抑制过拟合，利用梯度下降迭代优化集成多个弱分类器；将信贷风险与多目标规划结合，并考虑突发因素分类调整。
    solution_method: 梯度下降法优化集成决策树模型，fmincon求解非线性规划
  evaluation:
    strengths:
    - 模型预测准确率高（96.75%），优于传统决策树和BP神经网络
    - 综合考虑多目标（收益、风险、客户流失）
    - 针对无信贷记录企业和突发因素有相应处理
    weaknesses:
    - 假设较为简化，可能忽略实际复杂因素
    - 突发因素分析依赖股票价格等替代指标，可能不够全面
    lessons: 集成学习和正则化可有效提升分类模型性能；多目标规划在金融决策中有广泛应用价值；突发因素需结合宏观微观数据分类处理。
  quality_rating: 4
  source: C109.pdf
  problem_ref: prob_008
