paper:
  id: paper_2003_国赛__2002A_关于_车灯线光源的优化设计_
  year: 2002
  competition: 国赛
  problem_id: A
  title: 关于“车灯线光源的优化设计”问题的光学思路
  tags:
    problem_type:
    - 优化
    core_models:
    - 朗白定律
    - 光线反射定律向量方程
    - 照度分布
    - 同心光束
    - 象散光束分析
    techniques:
    - 照度叠加原理
    - 等照度线
  analysis:
    problem_summary: 运用光学方法（朗白定律、反射定律、照度分布等）讨论车灯线光源的优化设计问题，计算线光源长度和屏上照度分布。
    key_assumptions:
    - 线光源上各点同方向的光亮度相同
    - 线光源为漫射发光面（线），遵循朗白定律
    - 直射光对屏上照度的影响可忽略不计
    - 反射镜为镜面反射
    objective: 在满足给定条件下，计算出线光源长度和屏上的照度分布，并进行相关讨论。
    constraints: 屏上照度公式需乘以sinα、(PQ)^(-2)、cosβ等因子；反射光遵循反射定律；照度叠加原理；线光源长度与屏上照度分布的关系需利于数学讨论。
  model:
    approach: 先计算从一点P到一点Q再到屏上一点C的照度关系，再对P和Q进行叠加；或先对一点Q，对所有P点计算，再对所有Q计算。
    innovation: 将光源的朗白定律、反射定律的向量方程、照度余弦法则（布给定律）及象散光束分析结合，并考虑近似平行光束处理。
    solution_method: 通过几何光学和光度学公式推导，叠加计算照度分布，得到线光源长度L≈3.12毫米。
  evaluation:
    strengths:
    - 运用光学基本原理（朗白定律、反射定律、照度余弦法则）进行建模
    - 考虑了光束的象散特性及近似平行光束的处理
    - 提出了两种叠加计算思路，便于验证
    weaknesses:
    - 对线光源的透明性假设与实际不符
    - 未详细给出数值计算的具体步骤和误差分析
    - 部分推导（如L=3.12毫米）缺乏详细论证
    lessons: 在光学优化问题中，应综合运用光度学和几何光学定律，注意光束特性（平行、象散）的判别，并合理简化假设以利于数学处理。
  quality_rating: 3
  source: 2002A：关于_车灯线光源的优化设计_问题的光学思路.pdf
  problem_ref: prob_31
